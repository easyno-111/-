<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라이브 코드 에디터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #f4f7f6; display: flex; flex-direction: column; }
        
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background-color: #e0e6ed; border-bottom: 2px solid #bdc3c7;
            flex-wrap: wrap; gap: 10px;
        }
        .title { font-weight: bold; color: #2c3e50; font-size: 18px; }
        
        .btn-group { display: flex; gap: 8px; }

        .run-btn {
            background-color: #27ae60; color: white; border: none; padding: 10px 20px;
            font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .sub-btn {
            background-color: #3498db; color: white; border: none; padding: 8px 15px;
            font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        @media (max-width: 800px) { .workspace { flex-direction: column; } }

        .pane { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #bdc3c7; }
        
        .pane-header {
            background: #34495e; color: white; padding: 8px 15px; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .fullscreen-btn {
            background-color: #f39c12; color: white; border: none; padding: 5px 12px;
            font-size: 13px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        textarea {
            flex: 1; padding: 15px; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; background-color: #1e1e1e; color: #d4d4d4;
            border: none; resize: none; outline: none; line-height: 1.4;
        }

        .preview-wrapper { flex: 1; background: white; display: flex; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; }

        .fullscreen-mode {
            position: fixed !important; top: 0; left: 0; width: 100vw !important;
            height: 100vh !important; z-index: 9999; background-color: white;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="title">👩‍💻 코딩 실험실</div>
        <div class="btn-group">
            <button class="sub-btn" onclick="copyToClipboard()" style="background-color: #9b59b6;">📋 코드 복사</button>
            <button class="sub-btn" onclick="downloadAsTxt()">💾 문서로 저장(.txt)</button>
            <button class="run-btn" onclick="runCode()">▶ 화면 새로고침</button>
        </div>
    </div>

    <div class="workspace">
        <div class="pane">
            <div class="pane-header">코드 입력</div>
            <textarea id="codeInput" spellcheck="false">
<!DOCTYPE html>
<html>
<head>
    <style>
        body { text-align: center; margin-top: 50px; font-family: sans-serif; }
        h1 { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>학생의 코드를 여기에! 🐷</h1>
</body>
</html></textarea>
        </div>

        <div class="pane" id="right-pane">
            <div class="pane-header">
                <span>실행 결과</span>
                <button class="fullscreen-btn" id="fs-btn" onclick="toggleFullScreen()">전체화면 ⛶</button>
            </div>
            <div class="preview-wrapper">
                <iframe id="preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        function runCode() {
            const code = document.getElementById('codeInput').value;
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        // 👑 1. 코드를 .txt 문서 파일로 저장하는 함수
        function downloadAsTxt() {
            const code = document.getElementById('codeInput').value;
            // 파일 형식을 'text/plain'으로 설정하여 일반 문서로 인식하게 함
            const blob = new Blob([code], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            
            // 학번/이름을 적기 편하게 파일명을 설정
            const fileName = prompt("파일 이름을 입력하세요 (예: 10101_홍길동)", "my_code");
            if (fileName) {
                a.download = fileName + '.txt';
                a.click();
            }
            window.URL.revokeObjectURL(url);
        }

        // 👑 2. 코드를 한 번에 복사하는 함수 (아이패드 편리 기능)
        function copyToClipboard() {
            const textArea = document.getElementById('codeInput');
            textArea.select();
            textArea.setSelectionRange(0, 99999); // 모바일 대응
            
            navigator.clipboard.writeText(textArea.value).then(() => {
                alert("코드가 클립보드에 복사되었습니다! 패들렛에 붙여넣기 하세요.");
            });
        }

        function toggleFullScreen() {
            const pane = document.getElementById('right-pane');
            const btn = document.getElementById('fs-btn');
            pane.classList.toggle('fullscreen-mode');
            if (pane.classList.contains('fullscreen-mode')) {
                btn.textContent = '원래화면 복귀 ↩';
                btn.style.backgroundColor = '#e74c3c';
            } else {
                btn.textContent = '전체화면 ⛶';
                btn.style.backgroundColor = '#f39c12';
            }
        }

        window.onload = runCode;
    </script>
</body>
</html>
