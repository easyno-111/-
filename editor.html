<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라이브 코드 에디터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #f4f7f6; display: flex; flex-direction: column; }
        
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background-color: #e0e6ed; border-bottom: 2px solid #bdc3c7;
        }
        .title { font-weight: bold; color: #2c3e50; font-size: 18px; }
        
        .run-btn {
            background-color: #27ae60; color: white; border: none; padding: 10px 25px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.2s;
        }
        .run-btn:hover { background-color: #2ecc71; }
        .run-btn:active { transform: translateY(2px); box-shadow: none; }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        @media (max-width: 800px) { .workspace { flex-direction: column; } }

        .pane { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #bdc3c7; }
        .pane:last-child { border-right: none; }
        
        /* 헤더 부분에 Flex를 주어 버튼을 우측으로 정렬합니다 */
        .pane-header {
            background: #34495e; color: white; padding: 8px 15px; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 전체화면 버튼 스타일 */
        .fullscreen-btn {
            background-color: #f39c12; color: white; border: none; padding: 4px 10px;
            font-size: 12px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .fullscreen-btn:hover { background-color: #e67e22; }

        textarea {
            flex: 1; padding: 15px; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; background-color: #1e1e1e; color: #d4d4d4;
            border: none; resize: none; outline: none;
        }

        /* 전체화면 시 배경을 하얗게 유지하기 위한 래퍼 */
        .preview-wrapper { flex: 1; background: white; display: flex; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="title">👩‍💻 코딩 실험실</div>
        <button class="run-btn" onclick="runCode()">▶ 화면 새로고침</button>
    </div>

    <div class="workspace">
        <div class="pane">
            <div class="pane-header">코드 입력 (HTML/CSS/JS)</div>
            <textarea id="codeInput" spellcheck="false">
<!DOCTYPE html>
<html>
<head>
    <style>
        body { text-align: center; margin-top: 50px; font-family: sans-serif; }
        h1 { color: #e74c3c; }
        button { font-size: 20px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>안녕, 돼지게임! 🐷</h1>
    <button onclick="alert('꿀꿀!')">돼지 버튼</button>
</body>
</html></textarea>
        </div>

        <div class="pane">
            <div class="pane-header">
                <span>실행 결과</span>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">전체화면 ⛶</button>
            </div>
            <div class="preview-wrapper" id="preview-wrapper">
                <iframe id="preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        function runCode() {
            const code = document.getElementById('codeInput').value;
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            
            doc.open();
            doc.write(code);
            doc.close();
        }

        // 👑 아이패드 호환 전체화면 기능
        function toggleFullScreen() {
            const wrapper = document.getElementById('preview-wrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // 전체화면 켜기
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) { // 아이패드(사파리)용
                    wrapper.webkitRequestFullscreen();
                }
            } else {
                // 전체화면 끄기
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { // 아이패드(사파리)용
                    document.webkitExitFullscreen();
                }
            }
        }

        window.onload = runCode;
    </script>
</body>
</html>
