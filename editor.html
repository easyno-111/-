<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라이브 코드 에디터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #f4f7f6; display: flex; flex-direction: column; }
        
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background-color: #e0e6ed; border-bottom: 2px solid #bdc3c7;
        }
        .title { font-weight: bold; color: #2c3e50; font-size: 18px; }
        
        .run-btn {
            background-color: #27ae60; color: white; border: none; padding: 10px 25px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: background-color 0.2s;
        }
        .run-btn:hover { background-color: #2ecc71; }
        .run-btn:active { transform: translateY(2px); box-shadow: none; }

        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        @media (max-width: 800px) { .workspace { flex-direction: column; } }

        .pane { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #bdc3c7; transition: all 0.3s ease; }
        .pane:last-child { border-right: none; }
        
        .pane-header {
            background: #34495e; color: white; padding: 8px 15px; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 전체화면 버튼 스타일 */
        .fullscreen-btn {
            background-color: #f39c12; color: white; border: none; padding: 5px 12px;
            font-size: 13px; border-radius: 4px; cursor: pointer; font-weight: bold;
            transition: background-color 0.2s;
        }
        .fullscreen-btn:hover { background-color: #e67e22; }

        textarea {
            flex: 1; padding: 15px; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; background-color: #1e1e1e; color: #d4d4d4;
            border: none; resize: none; outline: none; line-height: 1.4;
        }

        .preview-wrapper { flex: 1; background: white; display: flex; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; }

        /* 👑 아이패드 필승 비법: 가짜 전체화면 CSS */
        .fullscreen-mode {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999; /* 화면의 가장 맨 위로 올림 */
            background-color: white;
            border: none !important;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="title">👩‍💻 코딩 실험실</div>
        <button class="fullscreen-btn" onclick="downloadCode()" style="background-color: #3498db; margin-right: 10px;">💾 내 코드 저장</button>
        <button class="run-btn" onclick="runCode()">▶ 화면 새로고침</button>
    </div>

    <div class="workspace">
        <div class="pane">
            <div class="pane-header">코드 입력 (HTML/CSS/JS)</div>
            <textarea id="codeInput" spellcheck="false">
<!DOCTYPE html>
<html>
<head>
    <style>
        body { text-align: center; margin-top: 50px; font-family: sans-serif; }
        h1 { color: #e74c3c; }
        button { font-size: 20px; padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>안녕, 돼지게임! 🐷</h1>
    <button onclick="alert('꿀꿀!')">돼지 버튼</button>
</body>
</html></textarea>
        </div>

        <div class="pane" id="right-pane">
            <div class="pane-header">
                <span>실행 결과</span>
                <button class="fullscreen-btn" id="fs-btn" onclick="toggleFullScreen()">전체화면 ⛶</button>
            </div>
            <div class="preview-wrapper">
                <iframe id="preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        // 👑 내 코드를 파일로 만들어주는 마법의 함수
        function downloadCode() {
            const code = document.getElementById('codeInput').value;
            // 코드를 텍스트(HTML) 파일 형태로 변환
            const blob = new Blob([code], { type: 'text/html' });
            const url = window.URL.createObjectURL(blob);
            
            // 임시 링크를 만들어 강제로 다운로드 실행
            const a = document.createElement('a');
            a.href = url;
            // 학생들에게 저장될 파일 이름 (예: my_game.html)
            a.download = 'my_game.html'; 
            a.click();
            
            window.URL.revokeObjectURL(url);
        }
        // 코드 실행 함수
        function runCode() {
            const code = document.getElementById('codeInput').value;
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            
            doc.open();
            doc.write(code);
            doc.close();
        }

        // 👑 권한이 필요 없는 CSS 강제 전체화면 함수
        function toggleFullScreen() {
            const pane = document.getElementById('right-pane');
            const btn = document.getElementById('fs-btn');
            
            // fullscreen-mode 클래스를 넣었다 뺐다 합니다.
            pane.classList.toggle('fullscreen-mode');
            
            // 전체화면 상태일 때 버튼 모양 바꾸기
            if (pane.classList.contains('fullscreen-mode')) {
                btn.textContent = '원래화면 복귀 ↩';
                btn.style.backgroundColor = '#e74c3c'; // 빨간색으로 변경
            } else {
                btn.textContent = '전체화면 ⛶';
                btn.style.backgroundColor = '#f39c12'; // 다시 주황색으로
            }
        }

        // 처음에 한 번 실행
        window.onload = runCode;
    </script>
</body>
</html>
