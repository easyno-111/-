<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>라이브 코드 에디터</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #f4f7f6; display: flex; flex-direction: column; }
        
        .toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; background-color: #e0e6ed; border-bottom: 2px solid #bdc3c7;
            flex-wrap: wrap; gap: 10px;
        }
        .title { font-weight: bold; color: #2c3e50; font-size: 18px; }
        
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

        /* 메인 실행 버튼 */
        .run-btn {
            background-color: #27ae60; color: white; border: none; padding: 10px 18px;
            font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* 기능 버튼들 */
        .sub-btn {
            background-color: #3498db; color: white; border: none; padding: 8px 12px;
            font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        /* 삭제 버튼 (빨간색) */
        .del-btn {
            background-color: #e74c3c; color: white; border: none; padding: 8px 12px;
            font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }

        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        @media (max-width: 800px) { .workspace { flex-direction: column; } }

        .pane { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #bdc3c7; }
        
        .pane-header {
            background: #34495e; color: white; padding: 8px 15px; font-size: 14px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .fullscreen-btn {
            background-color: #f39c12; color: white; border: none; padding: 5px 12px;
            font-size: 13px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        textarea {
            flex: 1; padding: 15px; font-family: 'Courier New', Courier, monospace;
            font-size: 16px; background-color: #1e1e1e; color: #d4d4d4;
            border: none; resize: none; outline: none; line-height: 1.4;
        }

        .preview-wrapper { flex: 1; background: white; display: flex; }
        iframe { flex: 1; width: 100%; height: 100%; border: none; }

        .fullscreen-mode {
            position: fixed !important; top: 0; left: 0; width: 100vw !important;
            height: 100vh !important; z-index: 9999; background-color: white;
        }

        /* 파일 업로드 숨기기용 */
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="title">👩‍💻 코딩 실험실</div>
        <div class="btn-group">
            <button class="del-btn" onclick="clearCode()">🗑️ 전체 삭제</button>
            <button class="sub-btn" onclick="copyToClipboard()" style="background-color: #9b59b6;">📋 복사</button>
            <button class="sub-btn" onclick="document.getElementById('fileInput').click()">📂 불러오기</button>
            <button class="sub-btn" onclick="downloadAsTxt()">💾 저장(.txt)</button>
            <button class="run-btn" onclick="runCode()">▶ 실행</button>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".txt,.html" onchange="loadFiles(this)">

    <div class="workspace">
        <div class="pane">
            <div class="pane-header">코드 입력</div>
            <textarea id="codeInput" spellcheck="false" placeholder="여기에 코드를 입력하거나 파일을 불러오세요.">
<!DOCTYPE html>
<html>
<body>
    <h1 style="text-align:center;">안녕! 🐷</h1>
</body>
</html></textarea>
        </div>

        <div class="pane" id="right-pane">
            <div class="pane-header">
                <span>실행 결과</span>
                <button class="fullscreen-btn" id="fs-btn" onclick="toggleFullScreen()">전체화면 ⛶</button>
            </div>
            <div class="preview-wrapper">
                <iframe id="preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        const codeArea = document.getElementById('codeInput');

        // 1. 코드 실행
        function runCode() {
            const code = codeArea.value;
            const iframe = document.getElementById('preview');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();
        }

        // 2. 👑 전체 삭제 기능
        function clearCode() {
            if(confirm("입력한 코드를 모두 삭제할까요?")) {
                codeArea.value = "";
                runCode();
            }
        }

        // 3. 👑 파일 불러오기 기능 (패들렛 다운로드 파일 보기 해결책)
        function loadFiles(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    codeArea.value = e.target.result;
                    runCode(); // 불러오자마자 바로 실행
                    alert("파일을 성공적으로 불러왔습니다!");
                };
                reader.readAsText(file, "UTF-8");
            }
        }

        // 4. 문서 저장 (.txt)
        function downloadAsTxt() {
            const code = codeArea.value;
            const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fileName = prompt("파일 이름을 입력하세요", "my_code");
            if (fileName) {
                a.href = url;
                a.download = fileName + '.txt';
                a.click();
            }
            window.URL.revokeObjectURL(url);
        }

        // 5. 클립보드 복사
        function copyToClipboard() {
            codeArea.select();
            codeArea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(codeArea.value).then(() => {
                alert("코드가 복사되었습니다!");
            });
        }

        // 6. 가짜 전체화면
        function toggleFullScreen() {
            const pane = document.getElementById('right-pane');
            const btn = document.getElementById('fs-btn');
            pane.classList.toggle('fullscreen-mode');
            btn.textContent = pane.classList.contains('fullscreen-mode') ? '원래화면 복귀 ↩' : '전체화면 ⛶';
            btn.style.backgroundColor = pane.classList.contains('fullscreen-mode') ? '#e74c3c' : '#f39c12';
        }

        window.onload = runCode;
    </script>
</body>
</html>
