<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>울타리 최대 넓이 시뮬레이션</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
        body { background-color: #f5f5f7; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; border-radius: 25px; padding: 30px; width: 100%; max-width: 800px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 25px; }
        .visual-area { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .fence-viz { flex: 1; min-width: 300px; height: 250px; background: #f9f9fb; border-radius: 20px; display: flex; align-items: center; justify-content: center; position: relative; border: 2px dashed #d1d1d6; }
        .fence-rect { background: #34c759; border: 3px solid #28a745; position: relative; transition: all 0.1s; }
        .label-x { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); font-weight: bold; color: #28a745; }
        .label-y { position: absolute; left: -50px; top: 50%; transform: translateY(-50%); font-weight: bold; color: #007aff; }
        .graph-area { flex: 1; min-width: 300px; height: 250px; background: white; }
        .control-panel { background: #f2f2f7; padding: 20px; border-radius: 20px; text-align: center; }
        input[type=range] { width: 80%; height: 10px; margin: 20px 0; }
        .stats { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🏠 울타리 만들기 미션</h2>
            <p>총 길이 20m의 철망으로 가장 넓은 울타리를 만드세요!</p>
        </div>

        <div class="visual-area">
            <div class="fence-viz">
                <div id="rect" class="fence-rect">
                    <span class="label-x" id="disp-x">가로</span>
                    <span class="label-y" id="disp-y">세로</span>
                </div>
            </div>
            <canvas id="graph" class="graph-area"></canvas>
        </div>

        <div class="control-panel">
            <div class="stats">가로(x): <span id="val-x">5</span>m | 넓이(y): <span id="val-area">25</span>m²</div>
            <input type="range" id="slider" min="0.5" max="9.5" step="0.1" value="5" oninput="update()">
            <p>함수: y = x(10 - x) = -x² + 10x</p>
        </div>
    </div>

    <script>
        const slider = document.getElementById('slider');
        const rect = document.getElementById('rect');
        const canvas = document.getElementById('graph');
        const ctx = canvas.getContext('2d');

        function update() {
            const x = parseFloat(slider.value);
            const y = 10 - x;
            const area = x * y;

            document.getElementById('val-x').innerText = x.toFixed(1);
            document.getElementById('val-area').innerText = area.toFixed(1);
            document.getElementById('disp-x').innerText = x.toFixed(1) + 'm';
            document.getElementById('disp-y').innerText = y.toFixed(1) + 'm';

            // 울타리 그래픽 업데이트
            rect.style.width = (x * 20) + 'px';
            rect.style.height = (y * 20) + 'px';

            drawGraph(x, area);
        }

        function drawGraph(curX, curArea) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const scale = 20;
            const margin = 30;

            // 축
            ctx.strokeStyle = "#8e8e93";
            ctx.beginPath(); ctx.moveTo(margin, canvas.height-margin); ctx.lineTo(canvas.width, canvas.height-margin); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(margin, 0); ctx.lineTo(margin, canvas.height-margin); ctx.stroke();

            // 이차함수 그래프
            ctx.strokeStyle = "#34c759"; ctx.lineWidth = 2;
            ctx.beginPath();
            for(let mx=0; mx<=10; mx+=0.1) {
                let my = mx * (10 - mx);
                ctx.lineTo(margin + mx*scale, (canvas.height-margin) - my*scale);
            }
            ctx.stroke();

            // 현재 위치 점
            ctx.fillStyle = "#ff3b30";
            ctx.beginPath();
            ctx.arc(margin + curX*scale, (canvas.height-margin) - curArea*scale, 5, 0, Math.PI*2);
            ctx.fill();
        }

        window.onload = () => {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            update();
        };
    </script>
</body>
</html>
