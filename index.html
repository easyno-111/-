<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="themeColor" name="theme-color" content="#fff8fb">
  <meta name="description" content="수업과 학급 운영에 필요한 웹 도구 모음">
  <title>수학 실험실</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem('teacherPortalTheme');
      document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="assets/portal.css?v=20260722-interaction2">
</head>
<body class="portal-view">
  <div class="portal-shell">
    <header class="portal-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div class="brand-copy">
            <h1 class="brand-title" id="brandTitle">수학 실험실</h1>
            <p class="brand-caption">TEACHER APP PORTAL</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="installPortalButton" class="install-portal-button hidden" type="button">앱 설치</button>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="어두운 화면으로 변경" aria-pressed="false">
            <span class="theme-toggle-track" aria-hidden="true">
              <span class="theme-toggle-sun">☀</span>
              <span class="theme-toggle-moon">☾</span>
              <span class="theme-toggle-thumb"></span>
            </span>
            <span id="themeToggleLabel" class="theme-toggle-label">라이트</span>
          </button>
          <a class="icon-link" href="admin.html" aria-label="관리자 화면">
            <span>⚙</span><span class="header-admin-label">관리</span>
          </a>
        </div>
      </div>
    </header>

    <main class="portal-main">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">CLASSROOM DIGITAL TOOLBOX</p>
          <h2 id="heroTitle">수학 실험실</h2>
          <p id="heroSubtitle">수업과 학급 운영에 필요한 도구를 한곳에서 시작하세요.</p>
        </div>
        <div class="hero-stat" aria-label="공개 앱 수">
          <strong id="appCount">—</strong>
          <span>사용 가능한 도구</span>
        </div>
      </section>

      <div id="notice" class="notice hidden"></div>

      <section id="draftPreviewSection" class="draft-preview-section hidden" aria-live="polite"></section>
      <section id="lessonSetsSection" class="lesson-sets-section hidden" aria-label="수업 준비 세트">
        <div class="section-heading"><div><h3>수업 준비 세트</h3><p>준비한 순서대로 앱을 실행하며 수업을 진행하세요.</p></div></div>
        <div id="lessonSetCards" class="lesson-set-cards"></div>
      </section>

      <section class="toolbar" aria-label="앱 검색과 분류">
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="search" placeholder="앱 이름이나 설명으로 검색" autocomplete="off">
        </div>
        <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="카테고리">
          <button class="category-tab active" type="button" data-category="all">전체</button>
        </div>
      </section>

      <div class="section-heading category-overview-heading">
        <div>
          <h3 id="sectionTitle">카테고리별 도구</h3>
          <p>카테고리 제목을 누르면 앱 목록이 부드럽게 펼쳐집니다.</p>
        </div>
        <div id="resultCount" class="result-count"></div>
      </div>

      <section id="categorySections" class="category-sections" aria-live="polite">
        <div class="category-section category-section-skeleton"><div class="skeleton"></div></div>
        <div class="category-section category-section-skeleton"><div class="skeleton"></div></div>
      </section>
    </main>

    <footer class="portal-footer">
      <span id="footerText">MATHEMATICS LAB · Easy NO</span>
      <a href="admin.html">관리자</a>
    </footer>
  </div>


  <div class="portal-quick-launcher">
    <button id="quickLauncherButton" class="quick-launcher-button" type="button" aria-expanded="false" aria-label="빠른 메뉴">＋</button>
    <div id="quickLauncherMenu" class="quick-launcher-menu hidden">
      <a href="admin.html">관리자 화면</a>
      <button id="quickInstallButton" type="button">홈 화면에 설치</button>
      <button id="refreshPortalButton" type="button">화면 새로고침</button>
    </div>
  </div>

  <dialog id="lessonRunnerDialog" class="lesson-runner-dialog">
    <form method="dialog"><button class="lesson-runner-close" aria-label="닫기">×</button></form>
    <div id="lessonRunnerContent"></div>
  </dialog>

  <script type="module" src="js/portal.js?v=20260722-interaction2"></script>
  <script type="module" src="js/portal-enhancements.js?v=20260722-interaction2"></script>
</body>
</html>
