<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy NO 수학 실험실</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }

        .top-bar {
            width: 100%; height: 60px; background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); color: #1d1d1f; display: flex; align-items: center; justify-content: center;
            padding: 0 20px; box-shadow: 0 1px 0 rgba(0,0,0,0.1); position: relative; z-index: 10;
        }
        
        .menu-btn {
            position: absolute; left: 15px; background: none; border: none;
            color: #007aff; font-size: 26px; cursor: pointer; padding: 5px;
        }

        .header-title { font-size: 18px; font-weight: 700; cursor: pointer; }

        .sidebar {
            position: fixed; top: 0; left: -320px; width: 320px; height: 100%;
            background-color: #ffffff; box-shadow: 2px 0 20px rgba(0,0,0,0.15);
            transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 20;
            display: flex; flex-direction: column;
        }
        .sidebar.open { left: 0; }

        .sidebar-header {
            padding: 30px 20px 20px; font-size: 24px; font-weight: 800; color: #1d1d1f;
            border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { background: none; border: none; font-size: 28px; color: #86868b; cursor: pointer; }

        .menu-list { flex: 1; padding: 20px; overflow-y: auto; }
        .menu-group { margin-bottom: 25px; }
        .menu-label { font-size: 13px; font-weight: 700; color: #86868b; margin-bottom: 10px; padding-left: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .menu-item {
            display: flex; align-items: center; width: 100%; padding: 12px 15px; margin-bottom: 5px;
            text-align: left; background: none; border: none; border-radius: 10px;
            font-size: 16px; color: #1d1d1f; cursor: pointer; transition: background 0.2s; font-weight: 500;
        }
        .menu-item:hover, .menu-item:active { background-color: #f5f5f7; color: #007aff; }
        .menu-icon { margin-right: 12px; font-size: 20px; }

        .footer { padding: 20px; text-align: center; font-size: 13px; color: #86868b; border-top: 1px solid #f0f0f0; background-color: #fafafa; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4); opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease; z-index: 15;
        }
        .overlay.show { opacity: 1; visibility: visible; }

        #app-frame { width: 100%; height: calc(100% - 60px); border: none; background-color: #f5f5f7; }

        /* 📱 스마트폰을 위한 반응형 코드 */
        @media (max-width: 600px) {
            .sidebar { width: 280px; left: -280px; } /* 사이드바 너비를 스마트폰에 맞게 살짝 축소 */
            .sidebar.open { left: 0; }
            .header-title { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div class="header-title" onclick="loadApp('home.html')">수학 실험실</div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            메뉴
            <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>
        
<div class="menu-list">
            <button class="menu-item" onclick="loadApp('home.html')" style="background-color: #f0f8ff; color: #007aff; margin-bottom: 20px;">
                <span class="menu-icon">🏠</span> 메인 화면으로
            </button>

            <div class="menu-group">
                <div class="menu-label">수업 도구</div>
                <button class="menu-item" onclick="loadApp('quadratic.html')"><span class="menu-icon">📈</span> 이차함수 탐구</button>
                <button class="menu-item" onclick="loadApp('lock.html')"><span class="menu-icon">🔐</span> 자물쇠 방탈출</button>
                <button class="menu-item" onclick="loadApp('fence.html')"><span class="menu-icon">🏠</span> 울타리 최대 넓이</button>
            </div>

            <div class="menu-group">
                <div class="menu-label">수학 게임</div>
                <button class="menu-item" onclick="loadApp('pig.html')"><span class="menu-icon">🐷</span> 돼지게임</button>
                <button class="menu-item" onclick="loadApp('pig2.html')"><span class="menu-icon">🐽</span> 돼지게임(변형)</button>
                <button class="menu-item" onclick="loadApp('nunchi.html')"><span class="menu-icon">👀</span> 눈치게임</button>
                <button class="menu-item" onclick="loadApp('auction.html')"><span class="menu-icon">🔨</span> 마이너스 경매</button>
            </div>

            <div class="menu-group">
                <div class="menu-label">코딩 실습</div>
                <button class="menu-item" onclick="loadApp('editor.html')"><span class="menu-icon">⌨️</span> 코드 에디터</button>
            </div>
        </div>
        
        <div class="footer">
            Designed by <b>Easy NO</b>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <iframe id="app-frame" src="home.html"></iframe>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const appFrame = document.getElementById('app-frame');

        function toggleMenu() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        function loadApp(url) {
            appFrame.src = url;
            if (sidebar.classList.contains('open')) {
                toggleMenu();
            }
        }
    </script>
</body>
</html>
