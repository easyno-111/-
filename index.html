<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AGENT DASHBOARD - 수학 실험실</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #92fe9d;
            --dark-bg: #0a0b10;
            --panel-bg: rgba(10, 11, 16, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--dark-bg); color: white; }

        .top-bar {
            width: 100%; height: 60px; background-color: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            display: flex; align-items: center; justify-content: center;
            padding: 0 20px; position: relative; z-index: 10;
        }
        
        .menu-btn {
            position: absolute; left: 15px; background: none; border: none;
            color: var(--neon-blue); font-size: 26px; cursor: pointer; padding: 5px;
            text-shadow: 0 0 8px var(--neon-blue); transition: 0.3s;
        }
        .menu-btn:hover { color: white; }

        .header-title { 
            font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 700; 
            cursor: pointer; color: var(--neon-blue); letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .sidebar {
            position: fixed; top: 0; left: -320px; width: 320px; height: 100%;
            background-color: var(--panel-bg); border-right: 1px solid var(--neon-blue);
            box-shadow: 5px 0 20px rgba(0, 210, 255, 0.1);
            transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 20;
            display: flex; flex-direction: column;
        }
        .sidebar.open { left: 0; }

        .sidebar-header {
            padding: 30px 20px 20px; font-size: 20px; font-family: 'Orbitron', sans-serif; 
            font-weight: 700; color: white; border-bottom: 1px solid rgba(0, 210, 255, 0.3); 
            display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { background: none; border: none; font-size: 28px; color: #86868b; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: var(--neon-blue); }

        .menu-list { flex: 1; padding: 20px; overflow-y: auto; }
        .menu-group { margin-bottom: 25px; }
        .menu-label { 
            font-size: 12px; font-weight: 700; color: var(--neon-blue); 
            margin-bottom: 10px; padding-left: 10px; letter-spacing: 2px; font-family: 'Orbitron', sans-serif;
        }

        .menu-item {
            display: flex; align-items: center; width: 100%; padding: 12px 15px; margin-bottom: 5px;
            text-align: left; background: none; border: 1px solid transparent; border-radius: 8px;
            font-size: 15px; color: #ccc; cursor: pointer; transition: all 0.2s; font-weight: 500;
        }
        .menu-item:hover, .menu-item:active { 
            background-color: rgba(0, 210, 255, 0.1); color: white;
            border: 1px solid var(--neon-blue); box-shadow: inset 0 0 10px rgba(0,210,255,0.2);
        }
        .menu-icon { margin-right: 12px; font-size: 18px; width: 25px; text-align: center; color: var(--neon-purple); }

        .footer { 
            padding: 20px; text-align: center; font-size: 12px; color: #666; 
            border-top: 1px solid rgba(0, 210, 255, 0.3); background-color: #050505; 
            font-family: 'Orbitron', sans-serif;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7); opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease; z-index: 15; backdrop-filter: blur(3px);
        }
        .overlay.show { opacity: 1; visibility: visible; }

        #app-frame { width: 100%; height: calc(100% - 60px); border: none; background-color: var(--dark-bg); }

        @media (max-width: 600px) {
            .sidebar { width: 280px; left: -280px; }
            .sidebar.open { left: 0; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="header-title" onclick="loadApp('home.html')">SYSTEM OVERRIDE</div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span><i class="fa-solid fa-terminal"></i> MENU</span>
            <button class="close-btn" onclick="toggleMenu()">×</button>
        </div>
        
        <div class="menu-list">
            <button class="menu-item" onclick="loadApp('home.html')" style="background: rgba(0,210,255,0.15); color: var(--neon-blue); border: 1px solid var(--neon-blue); margin-bottom: 20px;">
                <span class="menu-icon"><i class="fa-solid fa-house-chimney-crack"></i></span> 메인 화면으로
            </button>

            <button class="menu-item" onclick="loadApp('lesson_start.html')" style="margin-bottom: 20px; border-left: 3px solid var(--neon-purple);">
                <span class="menu-icon"><i class="fa-solid fa-chalkboard-user"></i></span> 요원 브리핑 (수업)
            </button>

            <div class="menu-group">
                <div class="menu-label">수업 도구 (TRAINING)</div>
                <button class="menu-item" onclick="loadApp('quadratic.html')"><span class="menu-icon">📈</span> 데이터 시뮬레이터</button>
                <button class="menu-item" onclick="loadApp('lock.html')"><span class="menu-icon">🔐</span> 암호 해독 (방탈출)</button>
                <button class="menu-item" onclick="loadApp('fence.html')"><span class="menu-icon">🏠</span> 필드 테스트 (울타리)</button>
            </div>

            <div class="menu-group">
                <div class="menu-label">수학 게임 (SIMULATION)</div>
                <button class="menu-item" onclick="loadApp('pig.html')"><span class="menu-icon">🐷</span> PIG 프로젝트 (기본)</button>
                <button class="menu-item" onclick="loadApp('pig2.html')"><span class="menu-icon">🐽</span> PIG 프로젝트 (심화)</button>
                <button class="menu-item" onclick="loadApp('nunchi.html')"><span class="menu-icon">👀</span> 심리전 시뮬레이터</button>
                <button class="menu-item" onclick="loadApp('auction.html')"><span class="menu-icon">🔨</span> 마이너스 옥션</button>
            </div>

            <div class="menu-group">
                <div class="menu-label">코딩 실습 (CODING LAB)</div>
                <button class="menu-item" onclick="loadApp('editor.html')"><span class="menu-icon">⌨️</span> 라이브 코드 에디터</button>
                <button class="menu-item" onclick="loadApp('shooter.html')"><span class="menu-icon">🚀</span> 화력 슈팅 서바이버</button>
                <button class="menu-item" onclick="loadApp('survival.html')"><span class="menu-icon">🛡️</span> 서바이벌 게임</button>
            </div>
        </div>
        
        <div class="footer">
            SECURE SYSTEM by <b>Easy NO</b>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <iframe id="app-frame" src="home.html"></iframe>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const appFrame = document.getElementById('app-frame');

        function toggleMenu() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        function loadApp(url) {
            appFrame.src = url;
            if (sidebar.classList.contains('open')) {
                toggleMenu();
            }
        }
    </script>
</body>
</html>
