<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="themeColor" name="theme-color" content="#fff8fb">
  <meta name="description" content="수업과 학급 운영에 필요한 웹 도구 모음">
  <title>수학 실험실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem('teacherPortalTheme');
      document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="assets/portal.css">
</head>
<body class="portal-view">
  <div class="portal-shell">
    <header class="portal-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div class="brand-copy">
            <h1 class="brand-title" id="brandTitle">수학 실험실</h1>
            <p class="brand-caption">TEACHER APP PORTAL</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="어두운 화면으로 변경" aria-pressed="false">
            <span class="theme-toggle-track" aria-hidden="true">
              <span class="theme-toggle-sun">☀</span>
              <span class="theme-toggle-moon">☾</span>
              <span class="theme-toggle-thumb"></span>
            </span>
            <span id="themeToggleLabel" class="theme-toggle-label">라이트</span>
          </button>
          <a class="icon-link" href="admin.html" aria-label="관리자 화면">
            <span>⚙</span><span class="header-admin-label">관리</span>
          </a>
        </div>
      </div>
    </header>

    <main class="portal-main">
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">CLASSROOM DIGITAL TOOLBOX</p>
          <h2 id="heroTitle">수학 실험실</h2>
          <p id="heroSubtitle">수업과 학급 운영에 필요한 도구를 한곳에서 시작하세요.</p>
        </div>
        <div class="hero-stat" aria-label="공개 앱 수">
          <strong id="appCount">—</strong>
          <span>사용 가능한 도구</span>
        </div>
      </section>

      <div id="notice" class="notice hidden"></div>

      <section class="toolbar" aria-label="앱 검색과 분류">
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="search" placeholder="앱 이름이나 설명으로 검색" autocomplete="off">
        </div>
        <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="카테고리">
          <button class="category-tab active" type="button" data-category="all">전체</button>
        </div>
      </section>

      <div class="section-heading">
        <div>
          <h3 id="sectionTitle">전체 도구</h3>
          <p>카드의 버튼을 눌러 원하는 활동을 시작하세요.</p>
        </div>
        <div id="resultCount" class="result-count"></div>
      </div>

      <section id="appGrid" class="app-grid" aria-live="polite">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </section>
    </main>

    <footer class="portal-footer">
      <span id="footerText">MATHEMATICS LAB · Easy NO</span>
      <a href="admin.html">관리자</a>
    </footer>
  </div>

  <script type="module" src="js/portal.js"></script>
</body>
</html>
