<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta id="themeColor" name="theme-color" content="#15352b">
  <meta name="description" content="수업과 학급 운영에 필요한 웹 도구 모음">
  <title>수학 실험실</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon-192.png">
  <link rel="apple-touch-icon" href="icons/app-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    try {
      const savedTheme = localStorage.getItem('teacherPortalTheme');
      document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="assets/portal.css?v=20260722-interaction2">
  <link rel="stylesheet" href="assets/chalkboard-theme.css?v=20261015-launcher1">
  <link rel="stylesheet" href="assets/portal-interactions.css?v=20261022-app-details1">
  <link rel="stylesheet" href="assets/portal-reorder.css?v=20261022-app-details1">
</head>
<body class="portal-view">
  <div class="portal-shell">
    <!-- 칠판 띠: 이름 · 검색 · 날짜 · 버튼 -->
    <header class="portal-header">
      <div class="header-inner">
        <div class="brand">
          <h1 class="brand-title" id="brandTitle">수학 실험실</h1>
          <p class="brand-caption">TEACHER APP PORTAL</p>
        </div>
        <div class="search-wrap">
          <input id="searchInput" class="search-input" type="search" placeholder="앱 검색" aria-label="앱 검색 (/ 키로 바로 검색)" autocomplete="off">
        </div>
        <div class="header-actions">
          <time id="todayDate" class="today-date"></time>
          <button id="installPortalButton" class="install-portal-button hidden" type="button">앱 설치</button>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="어두운 화면으로 변경" aria-pressed="false">
            <span class="theme-toggle-sun" aria-hidden="true">☀</span>
            <span class="theme-toggle-moon" aria-hidden="true">☾</span>
          </button>
          <a class="icon-link" href="admin.html" aria-label="관리자 화면" title="관리자 화면">⚙</a>
        </div>
      </div>
    </header>

    <main class="portal-main">
      <div id="notice" class="notice hidden"></div>

      <nav id="categoryTabs" class="category-tabs" role="tablist" aria-label="카테고리">
        <button class="category-tab active" type="button" data-category="all">전체</button>
      </nav>

      <section id="quickAccessSection" class="quick-row hidden" aria-label="자주 쓰는 앱">
        <span class="quick-label">자주 쓰는 ✎</span>
        <div id="quickApps" class="quick-apps"></div>
      </section>

      <section id="draftPreviewSection" class="draft-preview-section hidden" aria-live="polite"></section>
      <section id="lessonSetsSection" class="lesson-sets-section hidden" aria-label="수업 준비 세트">
        <div class="section-heading"><div><h3>수업 준비 세트</h3><p>준비한 순서대로 앱을 실행하며 수업을 진행하세요.</p></div></div>
        <div id="lessonSetCards" class="lesson-set-cards"></div>
      </section>

      <p id="searchStatus" class="search-status hidden" aria-live="polite"></p>

      <div id="appArrangeToolbar" class="reorder-toolbar" aria-label="이 기기의 앱 배치">
        <p class="app-arrange-hint">앱을 눌러 설명을 확인하고, 길게 눌러 배치를 바꿔보세요.</p>
        <div class="reorder-actions">
          <button type="button" data-reorder-action="edit">앱 배치</button>
          <button type="button" data-reorder-action="reset" hidden>기본 순서</button>
          <button type="button" data-reorder-action="done" hidden>완료</button>
        </div>
        <p id="arrangeStatus" class="reorder-status" role="status" aria-live="polite"></p>
      </div>

      <section id="categorySections" class="category-sections" aria-live="polite">
        <div class="category-section category-section-skeleton"><div class="skeleton"></div></div>
        <div class="category-section category-section-skeleton"><div class="skeleton"></div></div>
      </section>
    </main>

    <footer class="portal-footer">
      <span id="footerText">MATHEMATICS LAB · Easy NO</span>
      <a href="admin.html">관리자</a>
    </footer>
  </div>

  <aside id="appPreview" class="app-preview" aria-label="앱 미리보기" hidden></aside>
  <dialog id="launchChoiceDialog" class="launch-choice app-details" aria-labelledby="appDetailsTitle" aria-describedby="appDetailsDescription"></dialog>

  <dialog id="lessonRunnerDialog" class="lesson-runner-dialog">
    <form method="dialog"><button class="lesson-runner-close" aria-label="닫기">×</button></form>
    <div id="lessonRunnerContent"></div>
  </dialog>

  <script type="module" src="js/portal.js?v=20261022-app-details1"></script>
  <script type="module" src="js/portal-enhancements.js?v=20261015-launcher1"></script>
</body>
</html>
