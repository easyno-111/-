<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비밀 요원 훈련 - Stage 01</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #92fe9d;
            --dark-bg: #050505;
            --glass-bg: rgba(20, 20, 30, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        /* 터치 시 스크롤 방지 및 화면 꽉 차게 설정 */
        body { background-color: var(--dark-bg); color: white; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column;}

        /* 🚪 초기 접속 버튼 */
        #launch-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        .access-btn {
            padding: clamp(15px, 3vw, 25px) clamp(30px, 5vw, 60px); 
            font-size: clamp(20px, 4vw, 30px); font-family: 'Orbitron'; background: none;
            border: 3px solid var(--neon-blue); color: var(--neon-blue); cursor: pointer;
            border-radius: 10px; box-shadow: 0 0 30px rgba(0,210,255,0.4); transition: 0.3s;
        }
        .access-btn:hover { background: var(--neon-blue); color: #000; }

        /* 🎆 폭죽 캔버스 */
        #firework-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }

        /* 🚀 폭죽 컨트롤 버튼 */
        .controls {
            position: fixed; bottom: clamp(20px, 5vh, 40px); left: 50%; transform: translateX(-50%);
            display: flex; gap: clamp(10px, 2vw, 30px); z-index: 1500;
            opacity: 0; visibility: hidden; transition: 1s; width: 100%; justify-content: center; padding: 0 10px;
        }
        .controls.visible { opacity: 1; visibility: visible; }
        
        .nav-btn {
            background: rgba(255,255,255,0.1); border: 2px solid var(--neon-blue); color: white;
            padding: clamp(10px, 2vh, 20px) clamp(20px, 4vw, 50px); 
            border-radius: 50px; cursor: pointer; font-size: clamp(16px, 3vw, 24px); font-weight: bold;
            display: flex; align-items: center; gap: 10px; transition: 0.3s; white-space: nowrap;
        }
        .nav-btn:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 20px rgba(0,210,255,0.5); }

        /* 📄 인터랙티브 학습 콘텐츠 (아이패드 맞춤형 반응형 레이아웃) */
        #main-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center; padding: clamp(10px, 3vw, 40px);
            opacity: 0; visibility: hidden; transition: all 1s ease-out; z-index: 1800;
        }
        #main-content.visible { opacity: 1; visibility: visible; }

        .activity-card {
            background: var(--glass-bg); backdrop-filter: blur(15px);
            border: 2px solid var(--neon-blue); border-radius: 20px;
            width: 100%; max-width: 1200px; max-height: 100%; overflow-y: auto;
            display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,210,255,0.2);
        }

        /* 내부 상단 헤더 */
        .card-header { padding: clamp(15px, 3vw, 25px); border-bottom: 1px solid rgba(0,210,255,0.3); text-align: center; }
        .step-tag { font-family: 'Orbitron'; color: var(--neon-blue); font-size: clamp(18px, 2.5vw, 24px); font-weight: bold; }
        .card-title { font-size: clamp(24px, 4vw, 36px); font-weight: 900; margin-top: 10px; }

        /* 내부 그리드 (문제 영역 / 그래프 영역) */
        .card-body {
            display: flex; flex-direction: row; flex-wrap: wrap; flex: 1;
            padding: clamp(15px, 3vw, 30px); gap: 20px;
        }
        .left-panel, .right-panel { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px; }

        /* 퀴즈 박스 스타일 */
        .quiz-box { background: rgba(0,0,0,0.5); border: 1px solid #444; border-radius: 15px; padding: 20px; }
        .quiz-box h3 { font-size: clamp(18px, 2.5vw, 22px); color: var(--neon-purple); margin-bottom: 15px; line-height: 1.4; }
        
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; font-size: clamp(16px, 2vw, 20px); }
        .input-row input {
            width: 80px; padding: 8px; font-size: clamp(16px, 2vw, 20px); text-align: center;
            background: #111; color: white; border: 1px solid var(--neon-blue); border-radius: 8px; outline: none;
        }
        .check-btn {
            background: rgba(0, 210, 255, 0.2); border: 1px solid var(--neon-blue); color: white;
            padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .check-btn:hover { background: var(--neon-blue); color: black; }
        .feedback { font-size: 14px; font-weight: bold; margin-top: 5px; min-height: 20px; }

        /* 우측 그래프 캔버스 구역 */
        .graph-container {
            background: #fff; border-radius: 15px; overflow: hidden; position: relative;
            flex: 1; min-height: 300px; border: 2px solid #555; display: flex; justify-content: center; align-items: center;
        }
        #math-canvas { width: 100%; height: 100%; touch-action: none; }

        .draw-line-btn {
            width: 100%; padding: 15px; margin-top: 10px; font-size: 18px; font-weight: bold;
            background: var(--neon-purple); color: black; border: none; border-radius: 10px; cursor: pointer;
            box-shadow: 0 0 15px rgba(146, 254, 157, 0.4); transition: 0.3s;
        }
        .draw-line-btn:hover { transform: scale(0.98); }

        /* 스크롤바 커스텀 (아이패드 고려) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="launch-overlay">
        <button class="access-btn" onclick="initMission()">MISSION START</button>
    </div>

    <canvas id="firework-canvas"></canvas>

    <div class="controls visible" id="controls">
        <button class="nav-btn" onclick="launchRocket()"><i class="fa-solid fa-rocket"></i> 폭죽 발사</button>
        <button class="nav-btn" id="next-step-btn" style="border-color: var(--neon-purple); color: var(--neon-purple); visibility: hidden; opacity: 0; transition: all 1s ease-out;" onclick="showInteractiveLab()">NEXT STEP <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <div id="main-content">
        <div class="activity-card">
            <div class="card-header">
                <div class="step-tag">STAGE 01. 생각 열기</div>
                <div class="card-title">이차함수 y = x² - 6x + 10 탐구</div>
            </div>
            
            <div class="card-body">
                <div class="left-panel">
                    <div class="quiz-box">
                        <h3>1️⃣ 그래프를 보고 이차함수의 최댓값과 최솟값을 찾아보세요.</h3>
                        <div class="input-row">
                            최댓값: <input type="text" id="q1-max" placeholder="없음?"> 
                            최솟값: <input type="number" id="q1-min">
                            <button class="check-btn" onclick="checkQ1()">확인</button>
                        </div>
                        <div class="feedback" id="fb-q1"></div>
                    </div>

                    <div class="quiz-box">
                        <h3>2️⃣ x=1과 x=4 직선을 긋고, 1 ≤ x ≤ 4 일 때 y의 값의 범위를 구해보세요.</h3>
                        <div style="font-size: 14px; color: #aaa; margin-bottom: 10px;">(먼저 우측의 '직선 긋기' 버튼을 눌러보세요!)</div>
                        <div class="input-row">
                            <input type="number" id="q2-min"> ≤ y ≤ <input type="number" id="q2-max">
                            <button class="check-btn" onclick="checkQ2()">확인</button>
                        </div>
                        <div class="feedback" id="fb-q2"></div>
                    </div>
                </div>

                <div class="right-panel">
                    <div class="graph-container">
                        <canvas id="math-canvas" width="400" height="300"></canvas>
                    </div>
                    <button class="draw-line-btn" onclick="drawLimitLines()"><i class="fa-solid fa-pen-ruler"></i> x=1, x=4 직선 긋기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 폭죽 시스템 (Web Audio & Canvas)
        // ==========================================
        const fwCanvas = document.getElementById('firework-canvas');
        const fwCtx = fwCanvas.getContext('2d');
        fwCanvas.width = window.innerWidth;
        fwCanvas.height = window.innerHeight;

        let audioCtx;
        function playWhiz() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.2);
        }
        function playBoom() {
            if (!audioCtx) return;
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start(); noise.stop(audioCtx.currentTime + 1.5);
        }

        let particles = [];
        let rocket = { active: false };
        let shotsFired = 0;

        function initMission() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('launch-overlay').style.display = 'none';
            animateFw();
        }

        function launchRocket() {
            if (rocket.active) return;
            rocket.x = fwCanvas.width / 2;
            rocket.y = fwCanvas.height;
            rocket.vy = -(12 + Math.random() * 3);
            rocket.vx = (Math.random() - 0.5) * 5;
            rocket.active = true;
            playWhiz();
        }

        function createExplosion(x, y) {
            playBoom();
            for (let i = 0; i < 100; i++) {
                particles.push({ x: x, y: y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, color: `hsl(${Math.random()*360}, 100%, 60%)`, life: 1 });
            }
            shotsFired++;
            if (shotsFired >= 3) {
                const nextBtn = document.getElementById('next-step-btn');
                nextBtn.style.visibility = 'visible'; nextBtn.style.opacity = '1';
            }
        }

        function animateFw() {
            fwCtx.fillStyle = 'rgba(5, 5, 16, 0.2)'; fwCtx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
            if (rocket.active) {
                rocket.vy += 0.2; rocket.x += rocket.vx; rocket.y += rocket.vy;
                fwCtx.beginPath(); fwCtx.arc(rocket.x, rocket.y, 4, 0, Math.PI*2); fwCtx.fillStyle = '#00d2ff'; fwCtx.fill();
                if (rocket.vy >= 0) { createExplosion(rocket.x, rocket.y); rocket.active = false; }
            }
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.015;
                fwCtx.globalAlpha = p.life; fwCtx.beginPath(); fwCtx.arc(p.x, p.y, 3, 0, Math.PI*2); fwCtx.fillStyle = p.color; fwCtx.fill();
                if (p.life <= 0) particles.splice(index, 1);
            });
            fwCtx.globalAlpha = 1;
            requestAnimationFrame(animateFw);
        }

        window.addEventListener('resize', () => { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; drawGraph(); });

        // ==========================================
        // 2. 인터랙티브 학습 모듈 시스템
        // ==========================================
        function showInteractiveLab() {
            document.getElementById('controls').classList.remove('visible');
            setTimeout(() => { document.getElementById('main-content').classList.add('visible'); drawGraph(); }, 500);
        }

        // 정답 체크 로직
        function checkQ1() {
            const maxVal = document.getElementById('q1-max').value.replace(/\s/g, ''); // 공백제거
            const minVal = document.getElementById('q1-min').value;
            const fb = document.getElementById('fb-q1');
            
            if ((maxVal === "없다" || maxVal === "없음" || maxVal === "X" || maxVal === "x") && minVal == "1") {
                fb.style.color = "var(--neon-purple)"; fb.innerText = "정답입니다! 아래로 볼록한 그래프는 최댓값이 없죠.";
            } else {
                fb.style.color = "#ff4757"; fb.innerText = "다시 생각해보세요. 그래프의 가장 낮은 곳은 어디일까요?";
            }
        }

        function checkQ2() {
            const minVal = document.getElementById('q2-min').value;
            const maxVal = document.getElementById('q2-max').value;
            const fb = document.getElementById('fb-q2');
            
            if (minVal == "1" && maxVal == "5") {
                fb.style.color = "var(--neon-purple)"; fb.innerText = "완벽합니다! 제한된 범위 안에서 가장 높고 낮은 값을 잘 찾았네요.";
            } else {
                fb.style.color = "#ff4757"; fb.innerText = "x가 1부터 4까지일 때, y값(높이)이 어디부터 어디까지 변하는지 그래프를 다시 확인해보세요!";
            }
        }

        // ==========================================
        // 3. 그래프 그리기 (HTML5 Canvas)
        // ==========================================
        const mathCanvas = document.getElementById('math-canvas');
        const mCtx = mathCanvas.getContext('2d');
        let linesDrawn = false;

        function drawGraph() {
            // 반응형 캔버스 크기 조정
            const container = mathCanvas.parentElement;
            mathCanvas.width = container.clientWidth;
            mathCanvas.height = container.clientHeight;
            
            const w = mathCanvas.width;
            const h = mathCanvas.height;
            const scale = w > 500 ? 40 : 30; // 모바일에선 스케일 축소
            const ox = w / 2 - 3*scale; // y축을 살짝 왼쪽으로 이동
            const oy = h - 2*scale; // x축을 바닥 쪽에

            mCtx.clearRect(0, 0, w, h);

            // 격자 그리기
            mCtx.strokeStyle = "#eee"; mCtx.lineWidth = 1;
            for(let i = -10; i <= 10; i++) {
                mCtx.beginPath(); mCtx.moveTo(ox + i*scale, 0); mCtx.lineTo(ox + i*scale, h); mCtx.stroke();
                mCtx.beginPath(); mCtx.moveTo(0, oy - i*scale); mCtx.lineTo(w, oy - i*scale); mCtx.stroke();
            }

            // 축 그리기
            mCtx.strokeStyle = "#333"; mCtx.lineWidth = 2;
            mCtx.beginPath(); mCtx.moveTo(ox, 0); mCtx.lineTo(ox, h); mCtx.stroke(); // y축
            mCtx.beginPath(); mCtx.moveTo(0, oy); mCtx.lineTo(w, oy); mCtx.stroke(); // x축

            // 숫자 표시
            mCtx.fillStyle = "#333"; mCtx.font = "14px Arial";
            mCtx.fillText("O", ox - 15, oy + 15);
            mCtx.fillText("2", ox + 2*scale - 5, oy + 15);
            mCtx.fillText("4", ox + 4*scale - 5, oy + 15);
            mCtx.fillText("6", ox + 6*scale - 5, oy + 15);
            mCtx.fillText("x", w - 15, oy + 15);
            mCtx.fillText("2", ox - 15, oy - 2*scale + 5);
            mCtx.fillText("4", ox - 15, oy - 4*scale + 5);
            mCtx.fillText("6", ox - 15, oy - 6*scale + 5);
            mCtx.fillText("y", ox + 5, 15);

            // 포물선 그리기 y = x^2 - 6x + 10
            mCtx.strokeStyle = "#e84393"; mCtx.lineWidth = 3;
            mCtx.beginPath();
            for(let px = 0; px <= w; px++) {
                let x = (px - ox) / scale;
                let y = (x*x) - 6*x + 10;
                let py = oy - y*scale;
                if(px === 0) mCtx.moveTo(px, py); else mCtx.lineTo(px, py);
            }
            mCtx.stroke();

            // x=1, x=4 제한선 및 영역 표시 (버튼 눌렀을 때만)
            if (linesDrawn) {
                const px1 = ox + 1*scale;
                const px4 = ox + 4*scale;

                // 영역 색칠
                mCtx.fillStyle = "rgba(0, 210, 255, 0.2)";
                mCtx.fillRect(px1, 0, px4 - px1, h);

                // 파란 점선 긋기
                mCtx.strokeStyle = "#0984e3"; mCtx.lineWidth = 2; mCtx.setLineDash([5, 5]);
                mCtx.beginPath(); mCtx.moveTo(px1, 0); mCtx.lineTo(px1, h); mCtx.stroke();
                mCtx.beginPath(); mCtx.moveTo(px4, 0); mCtx.lineTo(px4, h); mCtx.stroke();
                mCtx.setLineDash([]); // 점선 초기화

                // 포물선 굵게 표시 (구간 내)
                mCtx.strokeStyle = "#00d2ff"; mCtx.lineWidth = 5;
                mCtx.beginPath();
                for(let px = px1; px <= px4; px++) {
                    let x = (px - ox) / scale;
                    let y = (x*x) - 6*x + 10;
                    let py = oy - y*scale;
                    if(px === px1) mCtx.moveTo(px, py); else mCtx.lineTo(px, py);
                }
                mCtx.stroke();

                // 최댓값, 최솟값 점 찍기
                const pMinX = ox + 3*scale; const pMinY = oy - 1*scale; // (3, 1)
                const pMaxX = ox + 1*scale; const pMaxY = oy - 5*scale; // (1, 5)

                mCtx.fillStyle = "#00d2ff"; mCtx.beginPath(); mCtx.arc(pMinX, pMinY, 6, 0, Math.PI*2); mCtx.fill();
                mCtx.fillStyle = "#ff7675"; mCtx.beginPath(); mCtx.arc(pMaxX, pMaxY, 6, 0, Math.PI*2); mCtx.fill();
            }
        }

        function drawLimitLines() {
            linesDrawn = true;
            drawGraph(); // 캔버스 다시 그리기
        }
    </script>
</body>
</html>
