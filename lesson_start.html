<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀 요원 훈련 - Stage 01</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Noto+Sans+KR:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-purple: #92fe9d;
            --dark-bg: #050505;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--dark-bg); color: white; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }

        /* 🚪 초기 접속 버튼 */
        #launch-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 2000; display: flex; align-items: center; justify-content: center;
        }
        .access-btn {
            padding: 25px 60px; font-size: 30px; font-family: 'Orbitron'; background: none;
            border: 3px solid var(--neon-blue); color: var(--neon-blue); cursor: pointer;
            border-radius: 10px; box-shadow: 0 0 30px rgba(0,210,255,0.4); transition: 0.3s;
        }
        .access-btn:hover { background: var(--neon-blue); color: #000; }

        /* 🎆 애니메이션 캔버스 */
        #firework-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; }

        /* 📄 수업 콘텐츠 (처음엔 숨김) */
        #main-content {
            width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: translateY(50px); transition: all 1.5s ease-out;
        }

        .mission-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            border: 2px solid var(--neon-blue); border-radius: 30px;
            padding: 80px; width: 85%; max-width: 1300px; text-align: center;
        }

        .step-tag { font-family: 'Orbitron'; color: var(--neon-blue); font-size: 28px; margin-bottom: 20px; display: block; }
        
        /* 글자 크기 대폭 조절 */
        h1 { font-size: 5rem; font-weight: 900; margin-bottom: 40px; word-break: keep-all; }
        .description { font-size: 2.8rem; line-height: 1.4; color: #ccc; margin-bottom: 50px; }
        .highlight { color: var(--neon-purple); text-shadow: 0 0 10px rgba(146, 254, 157, 0.5); }

        .function-box {
            display: inline-block; background: rgba(0, 210, 255, 0.1);
            padding: 30px 60px; border-radius: 20px; border: 1px solid var(--neon-blue);
            font-size: 3.5rem; font-family: 'Orbitron', serif; margin-top: 30px;
        }

        /* 컨트롤 버튼 */
        .controls {
            position: fixed; bottom: 40px; right: 40px; display: flex; gap: 20px; z-index: 1500;
            opacity: 0; transition: 1s;
        }
        .nav-btn {
            background: rgba(255,255,255,0.1); border: 2px solid var(--neon-blue); color: white;
            width: 80px; height: 80px; border-radius: 50%; cursor: pointer; font-size: 30px;
        }
        .nav-btn:hover { background: var(--neon-blue); color: black; }

    </style>
</head>
<body>

    <div id="launch-overlay">
        <button class="access-btn" onclick="initMission()">INITIALIZE MISSION</button>
    </div>

    <canvas id="firework-canvas"></canvas>

    <div id="main-content">
        <div class="mission-card">
            <span class="step-tag">STAGE 01. 생각 열기</span>
            <h1>이차함수의 <span class="highlight">최대와 최소</span></h1>
            <p class="description">
                방금 쏘아 올린 불꽃이 <span class="highlight">최고 높이</span>에 도달하는 순간!<br>
                우리는 이차함수를 통해 그 비밀을 풀 수 있습니다.
            </p>
            <div class="function-box">
                y = -x² + 12x
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="nav-btn" onclick="location.href='quadratic.html'"><i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <script>
        const canvas = document.getElementById('firework-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // --- 사운드 엔진 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playWhiz() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 1.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.2);
        }

        function playBoom() {
            const noise = audioCtx.createBufferSource();
            const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 1.5);
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
            noise.start(); noise.stop(audioCtx.currentTime + 1.5);
        }

        // --- 불꽃 애니메이션 엔진 ---
        let particles = [];
        let rocket = { x: canvas.width / 2, y: canvas.height, vy: -15, vx: 2, alpha: 1, active: false };

        function initMission() {
            document.getElementById('launch-overlay').style.display = 'none';
            rocket.active = true;
            playWhiz();
            animate();
        }

        function createExplosion(x, y) {
            playBoom();
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    life: 1.0
                });
            }
            
            // 폭발 후 글자 나타남
            setTimeout(() => {
                document.getElementById('main-content').style.opacity = '1';
                document.getElementById('main-content').style.transform = 'translateY(0)';
                document.getElementById('controls').style.opacity = '1';
            }, 500);
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 16, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (rocket.active) {
                // 포물선 궤적 운동 (중력 가속도 시뮬레이션)
                rocket.vy += 0.15; 
                rocket.x += rocket.vx;
                rocket.y += rocket.vy;

                ctx.beginPath();
                ctx.arc(rocket.x, rocket.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = varColor('--neon-blue');
                ctx.fill();

                // 정점에 도달했을 때 (속도가 0에 가까워질 때) 터뜨림
                if (rocket.vy >= 0) {
                    createExplosion(rocket.x, rocket.y);
                    rocket.active = false;
                }
            }

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                p.life -= 0.015;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                if (p.life <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
    </script>
</body>
</html>
