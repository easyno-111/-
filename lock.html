<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>이차함수 자물쇠 방탈출 GOLD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --bg: #f5f5f7;
            --card: #ffffff;
            --gold: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
        
        /* 화면 잘림 현상 해결: min-height 및 overflow-y 적용 */
        body { 
            background-color: var(--bg); 
            color: #1d1d1f; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow-x: hidden; 
            overflow-y: auto; 
            padding: 20px 0;
        }

        /* 🚪 도입부 문 애니메이션 스타일 */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; perspective: 1200px; display: flex;
            background: #050505;
        }
        .door {
            width: 50%; height: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            border: 2px solid #333;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
            position: relative;
        }
        .door.left { transform-origin: left; border-right: 5px solid #111; }
        .door.right { transform-origin: right; border-left: 5px solid #111; }
        
        /* 문 열림 상태 */
        .door.open.left { transform: rotateY(-105deg); }
        .door.open.right { transform: rotateY(105deg); }

        .intro-content {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10000; text-align: center; color: white;
            transition: opacity 0.5s ease;
            width: 90%; max-width: 400px;
        }
        .intro-content i { font-size: 80px; color: var(--gold); margin-bottom: 20px; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
        .intro-title { font-size: 32px; font-weight: 900; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); line-height: 1.3; }
        .start-btn {
            padding: 16px 45px; font-size: 20px; font-weight: 800;
            background: var(--gold); color: #111;
            border: none; border-radius: 40px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
            transition: all 0.3s; outline: none;
        }
        .start-btn:hover { transform: scale(1.05); box-shadow: 0 15px 25px rgba(255, 215, 0, 0.5); }

        /* 메인 게임 컨테이너 */
        .game-container {
            width: 90%; max-width: 900px; 
            min-height: 90vh; /* 고정 height 대신 min-height 사용 */
            background: var(--card); border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* 헤더 섹션 */
        .header { background: var(--primary); color: white; padding: 25px; text-align: center; position: relative; }
        .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .header p { font-size: 16px; opacity: 0.9; margin-top: 5px; }

        /* 문제 제시 카드 */
        .mission-panel { padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .target-box { 
            background: #f2f2f7; padding: 25px; border-radius: 20px; border: 2px solid #e5e5ea; 
            width: 100%; text-align: center; position: relative;
        }
        .target-box i { font-size: 40px; color: var(--primary); margin-bottom: 15px; }
        .mission-text { font-size: 22px; font-weight: 700; line-height: 1.5; color: #333; }
        .mission-text b { color: var(--primary); font-size: 26px; }

        /* 입력 및 그래프 영역 */
        .work-area { display: flex; flex: 1; padding: 0 30px 30px; gap: 30px; }
        
        .input-side { flex: 1; display: flex; flex-direction: column; gap: 15px; justify-content: center; }
        .eq-row { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: #444; flex-wrap: wrap; }
        input[type="number"] {
            width: 85px; padding: 12px; border-radius: 12px; border: 2px solid #d1d1d6;
            text-align: center; font-size: 20px; outline: none; transition: border 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .graph-side { flex: 1.2; position: relative; display: flex; flex-direction: column; min-height: 300px; }
        canvas { background: #fafafa; border-radius: 20px; border: 1px solid #eee; width: 100%; flex: 1; }

        /* 하단 상태바 */
        .status-bar { background: #1d1d1f; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .live-stats { font-size: 16px; font-weight: 500; font-family: monospace; }

        /* 👑 성공 화면 애니메이션 */
        #success-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 122, 255, 0.95); z-index: 100;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .success-icon { font-size: 100px; margin-bottom: 20px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        
        .success-title { font-size: 40px; font-weight: 900; margin-bottom: 10px; }
        .success-btn {
            margin-top: 30px; padding: 15px 40px; background: white; color: var(--primary);
            border: none; border-radius: 50px; font-size: 20px; font-weight: 800; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .success-btn:hover { transform: scale(1.05); }

        /* ⚙️ 교사용 설정 모드 */
        .teacher-btn { position: fixed; bottom: 20px; right: 20px; background: #8e8e93; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 50; }
        #teacher-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content { background: white; padding: 30px; border-radius: 30px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content h2 { margin-bottom: 10px; text-align: center; }
        .modal-row { display: flex; justify-content: space-between; align-items: center; }
        .apply-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: bold; margin-top: 10px; cursor: pointer;}
        .random-btn { background: #f2f2f7; color: #333; border: none; padding: 15px; border-radius: 15px; font-weight: bold; margin-top: 15px; cursor: pointer;}

        /* 모바일 대응 반응형 처리 */
        @media (max-width: 800px) {
            body { padding: 10px; }
            .work-area { flex-direction: column; }
            .graph-side { min-height: 350px; }
            .eq-row { justify-content: center; }
            .header h1 { font-size: 20px; }
            .mission-text { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- 🚪 도입부 (문 방탈출 애니메이션) -->
    <div id="intro-screen">
        <div class="door left" id="door-left"></div>
        <div class="door right" id="door-right"></div>
        <div class="intro-content" id="intro-content">
            <i class="fa-solid fa-lock"></i>
            <div class="intro-title">이차함수 자물쇠<br>방탈출 GOLD</div>
            <button class="start-btn" onclick="startGame()">도전 시작하기</button>
        </div>
    </div>

    <!-- 메인 게임 UI -->
    <div class="game-container">
        <div class="header">
            <h1>이차함수 자물쇠 탈출 <i class="fa-solid fa-key"></i></h1>
            <p>조건을 만족하는 계수를 찾아 잠금을 해제하세요.</p>
        </div>

        <div class="mission-panel">
            <div class="target-box">
                <i class="fa-solid fa-lock" id="lock-icon"></i>
                <div class="mission-text" id="mission-desc">
                    로딩 중...
                </div>
            </div>
        </div>

        <div class="work-area">
            <div class="input-side">
                <div class="eq-row">f(x) = <input type="number" id="a" value="1" step="0.5" oninput="check()"> x²</div>
                <div class="eq-row">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ <input type="number" id="b" value="0" step="0.5" oninput="check()"> x</div>
                <div class="eq-row">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;+ <input type="number" id="c" value="0" step="0.5" oninput="check()"></div>
                <button class="random-btn" onclick="randomMission()"><i class="fa-solid fa-rotate-right"></i> 다른 문제 생성</button>
            </div>
            <div class="graph-side">
                <canvas id="graphCanvas"></canvas>
            </div>
        </div>

        <div class="status-bar">
            <div class="live-stats" id="live-stats">현재 최댓값: - | 최솟값: -</div>
            <div style="font-size: 14px; opacity: 0.7;">Easy NO 수학</div>
        </div>

        <div id="success-overlay">
            <div class="success-icon">🔓</div>
            <div class="success-title">축하합니다!</div>
            <div style="font-size: 20px; font-weight: bold;">자물쇠를 열고 탈출에 성공했습니다!</div>
            <button class="success-btn" onclick="resetGame()">다음 문제 도전</button>
        </div>
    </div>

    <!-- 교사용 수동 설정 모달 -->
    <div class="teacher-btn" onclick="toggleTeacherModal()"><i class="fa-solid fa-gear"></i></div>
    <div id="teacher-modal">
        <div class="modal-content">
            <h2>문제 수동 설정</h2>
            <div class="modal-row">구간 시작 (x1): <input type="number" id="t-x1" value="0" style="width: 80px; padding: 5px; text-align: center;"></div>
            <div class="modal-row">구간 끝 (x2): <input type="number" id="t-x2" value="4" style="width: 80px; padding: 5px; text-align: center;"></div>
            <div class="modal-row">목표 최댓값: <input type="number" id="t-max" value="5" style="width: 80px; padding: 5px; text-align: center;"></div>
            <div class="modal-row">목표 최솟값: <input type="number" id="t-min" value="1" style="width: 80px; padding: 5px; text-align: center;"></div>
            <button class="apply-btn" onclick="applyTeacherMission()">이 문제로 시작하기</button>
            <button class="apply-btn" onclick="toggleTeacherModal()" style="background:#8e8e93;">닫기</button>
        </div>
    </div>

    <script>
        let targetX1, targetX2, targetMax, targetMin;
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');

        // 🚪 도입부 시작 애니메이션 트리거
        function startGame() {
            // 내용 숨기기
            document.getElementById('intro-content').style.opacity = '0';
            // 양쪽 문 열기
            document.getElementById('door-left').classList.add('open');
            document.getElementById('door-right').classList.add('open');
            
            // 애니메이션 종료 후 요소 감추기 (그래프 초기 렌더링 최적화)
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                check(); // 화면 사이즈에 맞게 캔버스 초기 조정
            }, 1500);
        }

        // 1. 랜덤 문제 생성
        function randomMission() {
            targetX1 = Math.floor(Math.random() * 2);
            targetX2 = targetX1 + Math.floor(Math.random() * 3) + 2;
            targetMax = Math.floor(Math.random() * 6) + 4;
            targetMin = Math.floor(Math.random() * 4) - 2;
            updateMissionText();
            check();
        }

        // 2. 교사 수동 설정 적용
        function applyTeacherMission() {
            targetX1 = parseFloat(document.getElementById('t-x1').value);
            targetX2 = parseFloat(document.getElementById('t-x2').value);
            targetMax = parseFloat(document.getElementById('t-max').value);
            targetMin = parseFloat(document.getElementById('t-min').value);
            updateMissionText();
            toggleTeacherModal();
            check();
        }

        function updateMissionText() {
            document.getElementById('mission-desc').innerHTML = 
                `구간 [<b>${targetX1}</b>, <b>${targetX2}</b>]에서<br>최댓값 <b>${targetMax}</b>, 최솟값 <b>${targetMin}</b>이 되는<br>계수를 찾으세요!`;
        }

        function check() {
            // 캔버스가 표시되지 않은 상태에서의 오류 방지
            if(canvas.offsetWidth === 0) return;

            const a = parseFloat(document.getElementById('a').value) || 0;
            const b = parseFloat(document.getElementById('b').value) || 0;
            const c = parseFloat(document.getElementById('c').value) || 0;

            function f(x) { return a*x*x + b*x + c; }
            
            let curMax = -Infinity;
            let curMin = Infinity;
            const vertexX = -b / (2 * a);

            let checkPoints = [targetX1, targetX2];
            if (a !== 0 && vertexX > targetX1 && vertexX < targetX2) checkPoints.push(vertexX);

            checkPoints.forEach(x => {
                let y = f(x);
                if (y > curMax) curMax = y;
                if (y < curMin) curMin = y;
            });

            // a가 0이 되어 상수/일차 함수가 된 경우의 예외처리
            if(a === 0) {
                curMax = Math.max(f(targetX1), f(targetX2));
                curMin = Math.min(f(targetX1), f(targetX2));
            }

            document.getElementById('live-stats').innerText = `현재 최댓값: ${curMax.toFixed(2)} | 최솟값: ${curMin.toFixed(2)}`;

            draw(a, b, c);

            // 정답 판정 (오차범위 0.1)
            if (a !== 0 && Math.abs(curMax - targetMax) < 0.11 && Math.abs(curMin - targetMin) < 0.11) {
                showSuccess();
            }
        }

        function draw(a, b, c) {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const scale = canvas.width > 500 ? 30 : 25; // 모바일 등 작은 화면에서는 스케일 조정
            const ox = canvas.width / 2;
            const oy = canvas.height - (canvas.height * 0.3); // 바닥 기준 위치 조정

            // 격자 및 축
            ctx.strokeStyle = "#e5e5ea";
            ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(canvas.width, oy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, canvas.height); ctx.stroke();

            // 구간 강조
            ctx.fillStyle = "rgba(0, 122, 255, 0.1)";
            ctx.fillRect(ox + targetX1*scale, 0, (targetX2-targetX1)*scale, canvas.height);

            // 축 숫자 표시 (선택사항)
            ctx.fillStyle = "#999";
            ctx.font = "12px Arial";
            ctx.fillText(targetX1, ox + targetX1*scale - 5, oy + 15);
            ctx.fillText(targetX2, ox + targetX2*scale - 5, oy + 15);

            // 그래프 그리기
            ctx.strokeStyle = "#007aff"; ctx.lineWidth = 4;
            ctx.beginPath();
            for(let px=0; px<canvas.width; px++) {
                let mx = (px - ox) / scale;
                let my = a*mx*mx + b*mx + c;
                let py = oy - my*scale;
                if(px===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();
        }

        function showSuccess() {
            document.getElementById('success-overlay').style.display = 'flex';
        }

        function resetGame() {
            document.getElementById('success-overlay').style.display = 'none';
            document.getElementById('a').value = 1;
            document.getElementById('b').value = 0;
            document.getElementById('c').value = 0;
            randomMission();
        }

        function toggleTeacherModal() {
            const modal = document.getElementById('teacher-modal');
            modal.style.display = (modal.style.display === 'flex') ? 'none' : 'flex';
        }

        // 창 크기 변경 시 그래프 다시 그리기
        window.addEventListener('resize', check);

        // 초기 로드 시 문제 생성 대기 (문 뒤에서 렌더링 됨)
        window.onload = () => {
            randomMission();
        };
    </script>
</body>
</html>
