<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f2eb">
  <title>수학 실험실 · 오프라인</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:light}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#23332d;background:#f5f2eb}main{width:min(1080px,calc(100% - 28px));margin:auto;padding:34px 0 60px}.top{position:relative;overflow:hidden;padding:28px 30px;border-radius:22px;color:#fbfaf2;background:linear-gradient(125deg,#12372e,#18493b 55%,#205747);box-shadow:0 20px 45px rgba(28,45,37,.13)}.top:after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-150px;border:1px solid rgba(255,255,255,.12);border-radius:50%}.top small{color:#dbc96f;font-weight:900;letter-spacing:.12em}.top h1{margin:6px 0 7px;font-size:clamp(2rem,6vw,3.2rem);font-weight:800}.top p{margin:0;color:rgba(245,246,235,.75)}.status{margin:16px 0;padding:12px 15px;border:1px solid #e4d39b;border-radius:12px;background:#fff8dc;color:#665826;font-weight:750}.group{margin-top:16px;padding:16px;border:1px solid #ddd9cf;border-radius:16px;background:#fff;box-shadow:0 7px 20px rgba(39,51,45,.06)}.group h2{margin:0 0 11px;font-size:1.1rem;color:#173f34}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.app{padding:14px;border:1px solid #e2ded5;border-left:3px solid #76a9ca;border-radius:12px;background:#faf8f3}.app strong{display:block;margin-bottom:5px;color:#23332d}.app p{min-height:38px;margin:0 0 10px;color:#728079;font-size:.82rem;line-height:1.55}.app a{display:inline-block;padding:8px 11px;border:0;border-radius:9px;background:#173f34;color:#fff;text-decoration:none;font-weight:800}.empty{padding:34px 20px;border:1px dashed #d7d1c7;border-radius:14px;text-align:center;color:#728079;background:#fff}button{margin-top:16px;border:1px solid rgba(255,255,255,.26);border-radius:10px;padding:10px 14px;background:rgba(255,255,255,.08);color:#fff;font-weight:800;cursor:pointer}button:hover{background:rgba(255,255,255,.14)}.app a:hover{background:#205547}@media(max-width:650px){main{padding-top:18px}.top{padding:23px 20px}}
  </style>
</head>
<body>
  <main>
    <section class="top">
      <small>OFFLINE MODE</small>
      <h1 id="title">수학 실험실</h1>
      <p>인터넷 연결 없이 마지막으로 저장된 앱 목록을 보여드립니다.</p>
      <button type="button" id="retryButton">연결 다시 확인</button>
    </section>
    <div class="status">실시간 기능이 필요한 앱은 인터넷 연결 후 사용할 수 있습니다.</div>
    <div id="content"></div>
  </main>
<script>
  const content = document.getElementById('content');
  const cleanText = (value, fallback = '') => typeof value === 'string' ? value.trim() : fallback;
  const safeUrl = value => {
    const raw = cleanText(value);
    if (!raw || /^(javascript|data|vbscript):/i.test(raw)) return '';
    try {
      const parsed = new URL(raw, location.href);
      return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
    } catch { return ''; }
  };
  const showEmpty = message => {
    const box = document.createElement('div');
    box.className = 'empty';
    box.textContent = message;
    content.replaceChildren(box);
  };

  document.getElementById('retryButton').addEventListener('click', () => location.reload());

  try {
    const cache = JSON.parse(localStorage.getItem('teacherPortalCacheV1') || 'null');
    if (!cache || typeof cache !== 'object') throw new Error('no-cache');
    document.getElementById('title').textContent = cleanText(cache.settings?.title, '수학 실험실');

    const categories = Object.entries(cache.categories || {})
      .sort((a, b) => (Number(a[1]?.order) || 0) - (Number(b[1]?.order) || 0));
    const apps = Object.entries(cache.apps || {})
      .map(([id, app]) => ({ id, ...(app || {}) }))
      .filter(app => app.visible !== false)
      .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

    categories.forEach(([id, category]) => {
      const list = apps.filter(app => app.category === id);
      if (!list.length) return;

      const section = document.createElement('section');
      section.className = 'group';
      const heading = document.createElement('h2');
      heading.textContent = cleanText(category?.name, '기타');
      const grid = document.createElement('div');
      grid.className = 'apps';

      list.forEach(app => {
        const card = document.createElement('article');
        card.className = 'app';
        const title = document.createElement('strong');
        title.textContent = `${cleanText(app.icon, '🔗')} ${cleanText(app.title, '앱')}`;
        const description = document.createElement('p');
        description.textContent = cleanText(app.description);
        card.append(title, description);

        const url = safeUrl(app.primaryUrl);
        if (url) {
          const link = document.createElement('a');
          link.href = url;
          link.textContent = cleanText(app.primaryLabel, '실행');
          if (app.openMode !== 'same') { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
          card.appendChild(link);
        }
        grid.appendChild(card);
      });

      section.append(heading, grid);
      content.appendChild(section);
    });

    if (!content.children.length) showEmpty('저장된 공개 앱이 없습니다.');
  } catch {
    showEmpty('아직 저장된 앱 목록이 없습니다. 인터넷에 연결된 상태에서 포털을 한 번 열어주세요.');
  }
</script>
</body>
</html>
