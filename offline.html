<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b3f31">
  <title>수학 실험실 · 오프라인</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#f4f1dc;background:#0b4636 linear-gradient(#063d30b8,#063d30b8) url("assets/chalkboard-bg.webp") center/cover fixed no-repeat}main{width:min(1080px,calc(100% - 28px));margin:auto;padding:34px 0 60px}.top{padding:26px 28px;border:1px solid #f4f1dc4d;border-radius:18px;background:#062f27bf;box-shadow:0 18px 45px #001b142e}.top small{color:#f0d77a;font-weight:900;letter-spacing:.12em}.top h1{margin:5px 0 7px;font-size:clamp(2rem,6vw,3.4rem);font-family:cursive}.top p{margin:0;color:#c9cfba}.status{margin:16px 0;padding:12px 15px;border:1px dashed #f0d77a80;border-radius:12px;background:#61501538;color:#f5e7ad;font-weight:750}.group{margin-top:16px;padding:16px;border:1px solid #f4f1dc38;border-radius:15px;background:#062f27b8}.group h2{margin:0 0 11px;font-size:1.2rem;color:#f0d77a}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.app{padding:14px;border:1px solid #f4f1dc2e;border-left:3px solid #8ec7df;border-radius:11px;background:#ffffff08}.app strong{display:block;margin-bottom:5px;color:#f4f1dc}.app p{min-height:38px;margin:0 0 10px;color:#c9cfba;font-size:.82rem;line-height:1.55}.app a{display:inline-block;padding:8px 11px;border:1px solid #f4f1dc3d;border-radius:9px;background:#ffffff0a;color:#f4f1dc;text-decoration:none;font-weight:800}.empty{padding:34px 20px;border:1px dashed #f4f1dc33;border-radius:14px;text-align:center;color:#c9cfba;background:#062f278f}button{margin-top:16px;border:1px solid #f4f1dc4d;border-radius:10px;padding:10px 14px;background:#ffffff0d;color:#f4f1dc;font-weight:800;cursor:pointer}button:hover,.app a:hover{background:#ffffff17}@media(max-width:650px){main{padding-top:18px}.top{padding:22px 19px}body{background-attachment:scroll}}
  </style>
</head>
<body>
  <main>
    <section class="top">
      <small>OFFLINE CHALKBOARD</small>
      <h1 id="title">수학 실험실</h1>
      <p>인터넷 연결 없이 마지막으로 저장된 앱 목록을 보여드립니다.</p>
      <button type="button" id="retryButton">연결 다시 확인</button>
    </section>
    <div class="status">실시간 기능이 필요한 앱은 인터넷 연결 후 사용할 수 있습니다.</div>
    <div id="content"></div>
  </main>
<script>
  const content = document.getElementById('content');
  const cleanText = (value, fallback = '') => typeof value === 'string' ? value.trim() : fallback;
  const safeUrl = value => {
    const raw = cleanText(value);
    if (!raw || /^(javascript|data|vbscript):/i.test(raw)) return '';
    try {
      const parsed = new URL(raw, location.href);
      return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
    } catch { return ''; }
  };
  const showEmpty = message => {
    const box = document.createElement('div');
    box.className = 'empty';
    box.textContent = message;
    content.replaceChildren(box);
  };

  document.getElementById('retryButton').addEventListener('click', () => location.reload());

  try {
    const cache = JSON.parse(localStorage.getItem('teacherPortalCacheV1') || 'null');
    if (!cache || typeof cache !== 'object') throw new Error('no-cache');
    document.getElementById('title').textContent = cleanText(cache.settings?.title, '수학 실험실');

    const categories = Object.entries(cache.categories || {})
      .sort((a, b) => (Number(a[1]?.order) || 0) - (Number(b[1]?.order) || 0));
    const apps = Object.entries(cache.apps || {})
      .map(([id, app]) => ({ id, ...(app || {}) }))
      .filter(app => app.visible !== false)
      .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

    categories.forEach(([id, category]) => {
      const list = apps.filter(app => app.category === id);
      if (!list.length) return;

      const section = document.createElement('section');
      section.className = 'group';
      const heading = document.createElement('h2');
      heading.textContent = cleanText(category?.name, '기타');
      const grid = document.createElement('div');
      grid.className = 'apps';

      list.forEach(app => {
        const card = document.createElement('article');
        card.className = 'app';
        const title = document.createElement('strong');
        title.textContent = `${cleanText(app.icon, '🔗')} ${cleanText(app.title, '앱')}`;
        const description = document.createElement('p');
        description.textContent = cleanText(app.description);
        card.append(title, description);

        const url = safeUrl(app.primaryUrl);
        if (url) {
          const link = document.createElement('a');
          link.href = url;
          link.textContent = cleanText(app.primaryLabel, '실행');
          if (app.openMode !== 'same') { link.target = '_blank'; link.rel = 'noopener noreferrer'; }
          card.appendChild(link);
        }
        grid.appendChild(card);
      });

      section.append(heading, grid);
      content.appendChild(section);
    });

    if (!content.children.length) showEmpty('저장된 공개 앱이 없습니다.');
  } catch {
    showEmpty('아직 저장된 앱 목록이 없습니다. 인터넷에 연결된 상태에서 포털을 한 번 열어주세요.');
  }
</script>
</body>
</html>
