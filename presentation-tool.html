<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슬라이드 공방</title>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  /* Layout: 편집 작업대 — 상단 도구줄, 좌측 슬라이드 띠, 가운데 무대, 우측 속성. 발표 모드는 전체 덮는 오버레이 */
  :root {
    --bg: #eef1f5; --panel: #ffffff; --panel2: #f6f8fb; --fg: #1b2430; --muted: #5d6b7c; --line: #d3dae4;
    --accent: #0e8a8f; --accent-ink: #ffffff; --sel: #f0b429; --danger: #c0392b; --hilite: rgba(14,138,143,.12);
    --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f141a; --panel: #19202a; --panel2: #141a22; --fg: #e6ebf2; --muted: #92a0b3; --line: #2b3542;
    --accent: #3cc3c8; --accent-ink: #061213; --sel: #f5c451; --danger: #e5705f; --hilite: rgba(60,195,200,.16); color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #0f141a; --panel: #19202a; --panel2: #141a22; --fg: #e6ebf2; --muted: #92a0b3; --line: #2b3542;
    --accent: #3cc3c8; --accent-ink: #061213; --sel: #f5c451; --danger: #e5705f; --hilite: rgba(60,195,200,.16); color-scheme: dark }

  html, body { height: 100%; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.45; display: flex; flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.sm { padding: 3px 8px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .thumb:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=text], input[type=number], select { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 7px; min-width: 0; }
  input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
  input[type=range] { width: 100%; }

  .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .menu { position: relative; }
  .menu .dd { position: absolute; top: calc(100% + 4px); left: 0; z-index: 90; display: none; min-width: 190px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.18); padding: 5px; gap: 2px; }
  .menu.open .dd { display: grid; } .menu.open > .btn { border-color: var(--accent); }
  .dd .btn { border: 0; text-align: left; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .dd .btn kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .dd-h { font-size: 11px; color: var(--muted); padding: 6px 8px 2px; text-transform: uppercase; letter-spacing: .06em; }
  .shapes { display: grid; grid-template-columns: repeat(4, 42px); gap: 4px; padding: 2px 4px 4px; }
  .shapes button { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .shapes button:hover { border-color: var(--accent); background: var(--hilite); }
  .shapes svg { width: 28px; height: 28px; }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 3; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); padding: 7px 4px; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 600; font-size: 12.5px; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button .n { font-weight: 400; color: var(--muted); font-size: 11px; }
  .grp { display: grid; gap: 3px; } .grp .gl { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips .btn { padding: 3px 9px; font-size: 12px; border-radius: 999px; }
  .chips .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .kbdtable { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
  .kbdtable kbd { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: var(--panel2); }
  .top h1 { margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .top h1 input { font-size: 14px; font-weight: 500; width: 180px; }
  .group { display: flex; gap: 4px; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel2); }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; }

  .work { flex: 1; display: grid; grid-template-columns: 150px minmax(0, 1fr) 270px; gap: 10px; min-height: 0; }
  @media (max-width: 900px) { .work { grid-template-columns: 1fr; grid-template-rows: auto minmax(240px, 1fr) auto; } .strip { flex-direction: row !important; } .thumb { flex: 0 0 130px; } .props { max-height: 36vh; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; min-height: 0; }
  .strip { padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  .thumb { border: 2px solid var(--line); border-radius: 6px; overflow: hidden; cursor: pointer; background: #fff; position: relative; aspect-ratio: 16/9; flex-shrink: 0; }
  .thumb.active { border-color: var(--accent); }
  .thumb .n { position: absolute; left: 4px; top: 2px; font-size: 11px; font-family: var(--font-mono); color: #1b2430; background: rgba(255,255,255,.85); padding: 0 5px; border-radius: 4px; z-index: 2; }
  .thumb .slide { transform-origin: 0 0; position: absolute; left: 0; top: 0; pointer-events: none; }
  .stripbtns { display: flex; gap: 4px; flex-wrap: wrap; }

  .stage { display: flex; flex-direction: column; padding: 8px; gap: 6px; }
  .stagehead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 6px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; }
  .slide { position: absolute; transform-origin: 0 0; overflow: hidden; background: #fff; }
  .obj { position: absolute; transform-origin: center; }
  .obj > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .obj .box { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 4.8px 9.6px; overflow: visible; }
  .obj .para { white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.2; margin: 0; min-height: 1em; flex-shrink: 0; }
  .obj.autow .para { white-space: pre; overflow-wrap: normal; }
  .obj .para.bul::before { content: "•"; margin-right: .4em; }
  .obj img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  .obj.unsup { border: 2px dashed #b7791f; color: #b7791f; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 14px; }
  .obj.unsup table { border-collapse: collapse; font-size: 14px; color: #1b2430; } .obj td { border: 1px solid #999; padding: 2px 6px; }
  .fxcanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .pathlayer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 49; overflow: visible; }
  .pathlayer polyline { fill: none; stroke: var(--sel); stroke-width: 4; stroke-dasharray: 10 8; stroke-linecap: round; stroke-linejoin: round; }
  .pathlayer circle { fill: var(--sel); }
  .pathlayer .em { stroke: #b7791f; } .pathlayer circle.em { fill: #b7791f; stroke: none; }
  .pathlayer .phandle { pointer-events: all; fill: #fff; stroke: var(--sel); stroke-width: 3; cursor: grab; } .pathlayer .phandle.em { stroke: #b7791f; }
  .pathlayer .vec { stroke: #e05a3a; stroke-width: 4; stroke-dasharray: none; marker-end: none; }
  .edit.drawmode .obj { cursor: crosshair; pointer-events: none; }
  .edit.drawmode .viewport { cursor: crosshair; }
  .drawtip { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--sel); color: #1b2430; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; z-index: 60; pointer-events: none; }
  details.ph { border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; }
  details.ph summary { cursor: pointer; padding: 6px 0; font-weight: 600; display: flex; gap: 6px; align-items: center; list-style: none; }
  details.ph summary::-webkit-details-marker { display: none; }
  details.ph summary .cur { font-weight: 400; color: var(--accent); }
  details.ph summary::before { content: "▸"; color: var(--muted); font-size: 11px; } details.ph[open] summary::before { content: "▾"; }
  details.ph .body { display: grid; gap: 6px; padding: 2px 0 10px; }
  .steps { display: grid; gap: 3px; }
  .step { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center; font-size: 12.5px; padding: 3px 6px; border-radius: 6px; background: var(--panel2); }
  .step .ph-in { color: var(--accent); } .step .ph-em { color: #b7791f; } .step .ph-out { color: var(--danger); }
  .step .trg { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .step .mv { display: flex; gap: 2px; } .step .mv .btn { padding: 0 5px; font-size: 11px; }
  .edit .obj { cursor: move; }
  .edit .obj.sel { outline: 2px solid var(--sel); outline-offset: 1px; z-index: 5; }
  .edit .obj.hover:not(.sel) { outline: 1.5px dashed var(--accent); }
  .edit .obj .box[contenteditable="true"] { cursor: text; outline: none; user-select: text; }
  .fxbadge { position: absolute; left: 0; top: -20px; font-size: 11px; font-family: var(--font-mono); background: var(--sel); color: #1b2430; padding: 0 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .handles { position: absolute; pointer-events: none; z-index: 6; }
  .h { position: absolute; width: 10px; height: 10px; background: #fff; border: 2px solid var(--sel); border-radius: 2px; pointer-events: all; transform: translate(-50%, -50%); }
  .h.nw { cursor: nwse-resize } .h.se { cursor: nwse-resize } .h.ne { cursor: nesw-resize } .h.sw { cursor: nesw-resize }
  .h.n, .h.s { cursor: ns-resize } .h.e, .h.w { cursor: ew-resize }
  .h.rot { border-radius: 50%; cursor: grab; background: var(--sel); }
  .rotline { position: absolute; width: 0; border-left: 1.5px dashed var(--sel); pointer-events: none; }

  .props { display: flex; flex-direction: column; overflow: auto; }
  .props h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 10px 12px 4px; font-weight: 600; }
  .sec { padding: 6px 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 64px 1fr; gap: 6px; align-items: center; }
  .row label { color: var(--muted); font-size: 12px; }
  .row .in { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .row input[type=number] { width: 62px; font-variant-numeric: tabular-nums; }
  .fxlist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .fxlist .btn { font-size: 12px; padding: 4px 6px; }
  .fxlist .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tog .btn.on { background: var(--hilite); border-color: var(--accent); }
  .empty { color: var(--muted); font-size: 12.5px; padding: 12px; }

  /* 발표 모드 */
  .present { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .present .slide { position: absolute; }
  .present .obj { pointer-events: none; }
  .present .pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.15); }
  .present .pbar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .present .pnum { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 12px; color: rgba(255,255,255,.55); font-family: var(--font-mono); font-size: 13px; }
  .present .pexit { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .present .laser { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #ff2d2d; box-shadow: 0 0 12px 4px rgba(255,45,45,.7); pointer-events: none; transform: translate(-50%, -50%); display: none; }
  .present .ink { position: absolute; inset: 0; pointer-events: none; }
  .char { display: inline-block; white-space: pre; }
  .present .ptools { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 14px; display: flex; gap: 6px; align-items: center; z-index: 120; }
  .present .ptools .btn { background: rgba(20,24,30,.78); color: #fff; border-color: rgba(255,255,255,.25); backdrop-filter: blur(6px); }
  .present .ptools .btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .present .ptools .hint { color: rgba(255,255,255,.75); font-size: 12px; background: rgba(0,0,0,.45); padding: 3px 8px; border-radius: 6px; }
  .present.phys .obj { pointer-events: all; cursor: pointer; }
  /* 물리 무대에서는 브라우저의 글자 선택·이미지 드래그 대신 포인터 조작을 사용한다. */
  .present.phys, .present.phys .slide, .present.phys .slide * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
  .present.phys .slide, .present.phys .slide * { touch-action: none; }
  .present .obj.pick { outline: 3px solid var(--sel); outline-offset: 2px; }
  .present .obj.dyn { will-change: transform; }
  .pobj { position: absolute; transform-origin: center; pointer-events: none; will-change: transform; }
  .pobj.piece-text { white-space: pre; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .present .flingline { position: absolute; inset: 0; pointer-events: none; z-index: 110; }
  .present .flingline line { stroke: #ff5b5b; stroke-width: 4; stroke-linecap: round; }

  /* 타임라인 (고급 모드) */
  .tl { border-top: 1px solid var(--line); padding-top: 6px; display: grid; gap: 6px; font-size: 12.5px; }
  .tl .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tl .time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; min-width: 86px; }
  .tl input[type=range] { flex: 1; min-width: 120px; }
  .tl input[type=number] { width: 56px; }
  .tracks { display: grid; gap: 3px; max-height: 140px; overflow: auto; position: relative; }
  .track { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; }
  .track .nm { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  .track.sel .nm { color: var(--accent); font-weight: 600; }
  .track .lane { position: relative; height: 20px; background: var(--panel2); border-radius: 4px; }
  .track .lane .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); transform: translateX(-1px); pointer-events: none; }
  .track .lane .key { position: absolute; top: 50%; width: 12px; height: 12px; background: var(--sel); border: 1.5px solid #8a6508; transform: translate(-50%, -50%) rotate(45deg); cursor: pointer; }
  .track .lane .key.cur { background: var(--accent); border-color: var(--accent); }
  .track .lane .key.base { background: var(--muted); border-color: var(--muted); width: 8px; height: 8px; }
  .ghost { opacity: .3; pointer-events: none !important; outline: 1.5px dashed var(--muted); }
  /* 레이어 패널 · 우클릭 메뉴 */
  .layers { display: grid; gap: 2px; }
  .layer { display: grid; grid-template-columns: 22px 22px 1fr auto; gap: 4px; align-items: center; padding: 2px 4px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .layer:hover { background: var(--hilite); } .layer.sel { background: var(--hilite); box-shadow: inset 3px 0 0 var(--sel); }
  .layer .ic { border: 0; background: none; cursor: pointer; padding: 0; font-size: 13px; opacity: .45; } .layer .ic.on { opacity: 1; }
  .layer .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .layer.hidden .nm { opacity: .45; text-decoration: line-through; }
  .layer .mv { display: flex; gap: 1px; } .layer .mv .btn { padding: 0 4px; font-size: 10px; }
  .ctx { position: fixed; z-index: 180; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.2); padding: 4px; min-width: 230px; max-width: 300px; font-size: 13px; }
  .ctx .hd { padding: 4px 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .ctx button { display: flex; gap: 8px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 5px 10px; border-radius: 5px; cursor: pointer; color: inherit; }
  .ctx button .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx button kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .ctx button:hover:not(:disabled) { background: var(--hilite); } .ctx button.sel { font-weight: 600; color: var(--accent); }
  .ctx button:disabled { opacity: .4; cursor: default; } .ctx button.danger .lb { color: var(--danger); }
  .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .obj.locked { cursor: default !important; }
  .card code { font-family: var(--font-mono); font-size: 11.5px; background: var(--panel2); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
  .card .status { font-size: 12.5px; color: var(--muted); } .card .bad { color: var(--danger); } .card .ok { color: #2e7d32; }
  .card input[type=password], .card input[type=text].wide { width: 100%; padding: 7px 9px; }
  .ocrbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; padding: 6px 10px; border: 1px solid var(--line); border-left: 4px solid var(--sel); border-radius: 8px; background: var(--panel2); }
  .ocrbadge { position: absolute; right: 0; top: -20px; font-size: 10.5px; font-family: var(--font-mono); background: #7c4dbd; color: #fff; padding: 0 5px; border-radius: 4px; pointer-events: none; }
  .obj.ocrcand { box-shadow: 0 0 0 2px rgba(124,77,189,.55) inset; }
  .progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .fontpick { display: grid; gap: 4px; padding: 6px; } .fontpick input { width: 100%; }
  .fontlist { overflow: auto; max-height: 360px; display: grid; gap: 1px; }
  .fontlist button { font-size: 15px; } .fontlist .sample { color: var(--muted); font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 150; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal .card { background: var(--panel); border-radius: 12px; padding: 16px; width: min(720px, 100%); max-height: 90vh; display: flex; flex-direction: column; gap: 10px; }
  .modal textarea { width: 100%; height: 50vh; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); color: var(--fg); padding: 8px; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* Studio design system — local SVG, quiet surfaces, generous spacing. */
:root {--bg:#f2f4f4;--panel:#fff;--panel2:#f6f8f8;--fg:#243c3a;--muted:#71837f;--line:#e2e9e7;--accent:#167b68;--accent-ink:#fff;--hilite:#e8f4ee;--sel:#167b68;--danger:#ba4c45;color-scheme:light}
:root[data-theme="dark"]{--bg:#151d1c;--panel:#1c2826;--panel2:#22302d;--fg:#e0ece7;--muted:#9cafaa;--line:#33453f;--accent:#75c5a7;--accent-ink:#11261e;--hilite:#2a4037;--sel:#75c5a7;color-scheme:dark}

            const item = { id: attr(cNvPr, "id"), name: attr(cNvPr, "name"), type: "unsupported", kind, ...box };
            if (kind === "table") { // 표는 셀 텍스트만이라도 뽑아두기
              item.rows = findAll(gd, "a", "tr").map((tr) => findAll(tr, "a", "tc").map((tc) => findAll(tc, "a", "t").map((t) => t.textContent).join("")));
            }
            out.push(item);
          }
        }
      }

      // ---- 슬라이드 배경 ----
      function parseBackground(slideXml, ctx) {
        const bg = find(slideXml, "p", "bg");
        const bgPr = bg ? child(bg, "p", "bgPr") : null;
        if (bgPr) return parseFill(bgPr, null, ctx);
        const bgRef = bg ? child(bg, "p", "bgRef") : null;
        if (bgRef) return { type: "solid", color: resolveColor(bgRef, ctx)?.hex, inherited: "bgRef" };
        return { type: "solid", color: "#" + (ctx.theme.scheme[ctx.clrMap.bg1 || "lt1"] || "FFFFFF"), inherited: "theme" };
      }

      const media = {};
      const slides = [];
      for (let i = 0; i < slidePaths.length; i++) {
        const path = slidePaths[i];
        const slideXml = await readXml(path);
        const ctx = await buildContext(path);
        const objects = [];
        await parseShapeTree(find(slideXml, "p", "spTree"), ctx, null, objects, media);
        // 발표자 노트
        const notesRel = Object.values(ctx.slideRels).find((r) => r.type === "notesSlide");
        let notes = null;
        if (notesRel) { const nx = await readXml(notesRel.target); if (nx) notes = findAll(nx, "a", "t").map((t) => t.textContent).join(" ").trim() || null; }
        slides.push({ index: i + 1, path, layout: ctx.layoutPath, background: parseBackground(slideXml, ctx), objects, notes });
      }
      return { width, height, slides, media, meta: { slideCount: slides.length, theme: Object.keys(themeCache)[0] || null } };
    };
  };
});
