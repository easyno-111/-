<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차함수 데이터 시뮬레이터</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #0056b3; /* 더 진한 파란색 */
            --accent: #d63031; /* 더 진한 빨간색 */
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --border-color: #d1d1d6;
        }
        * { box-sizing: border-box; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
        body { margin: 20px; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; }
        h1 { color: var(--text-main); margin-bottom: 20px; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        
        .controls {
            background: var(--card-bg); padding: 25px; border-radius: 15px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px;
            align-items: center; justify-content: center; width: 100%; max-width: 850px;
        }
        .input-group { display: flex; align-items: center; gap: 5px; font-size: 18px; font-weight: bold; color: var(--text-main); }
        .input-group i { font-family: "Times New Roman", Times, serif; font-style: italic; }
        
        input[type="number"] {
            width: 65px; padding: 8px; font-size: 16px; font-weight: bold; background: #f9f9f9; color: var(--primary);
            border: 2px solid var(--border-color); border-radius: 8px; text-align: center; outline: none; transition: 0.3s;
        }
        input[type="number"]:focus { border-color: var(--primary); }
        .interval-inputs input { width: 80px; }
        
        .random-btn {
            background: #e5f1ff; color: #007aff; border: 2px solid #007aff;
            padding: 10px 15px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .random-btn:hover { background: #007aff; color: white; transform: scale(1.05); }

        .info { font-size: 14px; color: #888; margin-top: 5px; margin-bottom: 15px; font-weight: bold; }
        
        #result-panel {
            font-size: 20px; padding: 15px 30px; border-radius: 10px; background-color: #fafafa;
            border: 2px solid var(--border-color); min-width: 250px; text-align: center; line-height: 1.6; font-weight: 900;
        }
        /* 최댓값, 최솟값 가독성 대폭 향상 */
        .max-text { color: var(--accent); }
        .min-text { color: var(--primary); }
        
        canvas {
            background: var(--card-bg); border-radius: 15px; border: 2px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); cursor: default; touch-action: none; max-width: 100%;
        }
    </style>
</head>
<body>

    <h1><i class="fa-solid fa-chart-line" style="color: #007aff;"></i> 이차함수 시뮬레이터</h1>

    <div class="controls">
        <div class="input-group">
            <i>f(x)</i> = 
            <input type="number" id="val-a" value="1" step="0.5"> <i>x</i><sup>2</sup> + 
            <input type="number" id="val-b" value="-4" step="0.5"> <i>x</i> + 
            <input type="number" id="val-c" value="3" step="0.5">
        </div>

        <button type="button" class="random-btn" onclick="randomizeFunction()"><i class="fa-solid fa-dice"></i> 함수 랜덤 변경</button>
        
        <div class="input-group interval-inputs">
            구간: 
            <input type="number" id="val-xmin" value="0" step="0.5" placeholder="없음"> 
            &le; <i>x</i> &le; 
            <input type="number" id="val-xmax" value="5" step="0.5" placeholder="없음">
        </div>
        
        <div id="result-panel">
            <span class="max-text">최댓값: <span id="max-display">-</span></span><br>
            <span class="min-text">최솟값: <span id="min-display">-</span></span>
        </div>
    </div>
    <div class="info">※ 파란색 구간의 경계선을 드래그해보세요. (0.5 단위로 부드럽게 스냅됩니다)</div>

    <canvas id="mathCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');

        const inputA = document.getElementById('val-a');
        const inputB = document.getElementById('val-b');
        const inputC = document.getElementById('val-c');
        const inputXMin = document.getElementById('val-xmin');
        const inputXMax = document.getElementById('val-xmax');
        const maxDisplay = document.getElementById('max-display');
        const minDisplay = document.getElementById('min-display');

        const scale = 40; 
        const originX = canvas.width / 2;
        const originY = canvas.height / 2 + 100; 

        let isDraggingLeft = false; let isDraggingRight = false; let isDraggingBody = false;
        let dragOffsetX = 0; 
        // 터치 인식 범위 대폭 넓힘 (기존 20 -> 40)
        const dragThreshold = 40;

        function getA() { return parseFloat(inputA.value) || 0; }
        function getB() { return parseFloat(inputB.value) || 0; }
        function getC() { return parseFloat(inputC.value) || 0; }
        function getXMin() { return inputXMin.value === "" ? -Infinity : parseFloat(inputXMin.value); }
        function getXMax() { return inputXMax.value === "" ? Infinity : parseFloat(inputXMax.value); }

        function f(x) { return getA() * x * x + getB() * x + getC(); }

        // 0.5 단위로 딱딱 맞춰주는 스냅 함수 추가
        function snap(val) {
            return (Math.round(val * 2) / 2).toFixed(1);
        }

        function randomizeFunction() {
            let a = 0;
            while(a === 0) {
                a = (Math.floor(Math.random() * 5) - 2); 
                if(Math.random() > 0.5) a += 0.5; 
            }
            if (a === 0) a = 1; 
            const b = Math.floor(Math.random() * 13) - 6; 
            const c = Math.floor(Math.random() * 13) - 6; 

            inputA.value = a; inputB.value = b; inputC.value = c; draw();
        }

        function toMathX(px) { return (px - originX) / scale; }
        function toMathY(py) { return -(py - originY) / scale; }
        function toPixelX(mx) { return originX + mx * scale; }
        function toPixelY(my) { return originY - my * scale; }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            const xmin = getXMin(), xmax = getXMax();
            const isRestricted = xmin !== -Infinity && xmax !== Infinity;

            if (isRestricted) drawIntervalHighlight(xmin, xmax);
            drawParabola(isRestricted, xmin, xmax);
            calculateAndDrawExtremes(xmin, xmax, isRestricted);
        }

        function drawGrid() {
            ctx.font = "14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            for (let i = -20; i <= 20; i++) {
                ctx.beginPath();
                ctx.strokeStyle = i === 0 ? "#1d1d1f" : "#e5e5ea";
                ctx.lineWidth = i === 0 ? 2 : 1;
                ctx.moveTo(toPixelX(i), 0); ctx.lineTo(toPixelX(i), canvas.height); ctx.stroke();
                if (i !== 0 && i % 2 === 0) { ctx.fillStyle = "#888"; ctx.fillText(i, toPixelX(i), originY + 15); }

                ctx.beginPath();
                ctx.strokeStyle = i === 0 ? "#1d1d1f" : "#e5e5ea";
                ctx.lineWidth = i === 0 ? 2 : 1;
                ctx.moveTo(0, toPixelY(i)); ctx.lineTo(canvas.width, toPixelY(i)); ctx.stroke();
                if (i !== 0 && i % 2 === 0) { ctx.fillStyle = "#888"; ctx.fillText(i, originX - 15, toPixelY(i)); }
            }
            ctx.fillStyle = "#1d1d1f"; ctx.fillText("0", originX - 10, originY + 15);
        }

        function drawIntervalHighlight(xmin, xmax) {
            const pxMin = toPixelX(xmin), pxMax = toPixelX(xmax);
            ctx.fillStyle = "rgba(0, 122, 255, 0.1)"; 
            ctx.fillRect(pxMin, 0, pxMax - pxMin, canvas.height);

            ctx.strokeStyle = "#007aff"; ctx.setLineDash([5, 5]); ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(pxMin, 0); ctx.lineTo(pxMin, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pxMax, 0); ctx.lineTo(pxMax, canvas.height); ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawParabola(isRestricted, xmin, xmax) {
            ctx.beginPath(); ctx.strokeStyle = "#c1c1c1"; ctx.lineWidth = 2;
            for (let px = 0; px <= canvas.width; px += 2) {
                let py = toPixelY(f(toMathX(px)));
                if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();

            if (isRestricted) {
                ctx.beginPath();
                ctx.strokeStyle = "#007aff"; ctx.lineWidth = 5;
                const startPx = Math.max(0, toPixelX(xmin));
                const endPx = Math.min(canvas.width, toPixelX(xmax));
                
                for (let px = startPx; px <= endPx; px += 1) {
                    let py = toPixelY(f(toMathX(px)));
                    if (px === startPx) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }
        }

        function calculateAndDrawExtremes(xmin, xmax, isRestricted) {
            const a = getA(), b = getB();
            if (a === 0) { maxDisplay.textContent = "없음"; minDisplay.textContent = "없음"; return; }

            const vertexX = -b / (2 * a);
            const candidates = [];

            if (isRestricted) {
                candidates.push({ x: xmin, y: f(xmin) });
                candidates.push({ x: xmax, y: f(xmax) });
                if (vertexX >= xmin && vertexX <= xmax) candidates.push({ x: vertexX, y: f(vertexX) });
            } else {
                candidates.push({ x: vertexX, y: f(vertexX) });
            }

            let maxPoint = candidates.reduce((p, c) => (p.y > c.y) ? p : c);
            let minPoint = candidates.reduce((p, c) => (p.y < c.y) ? p : c);

            if (!isRestricted) {
                if (a > 0) maxPoint = null; else minPoint = null; 
            }

            maxDisplay.textContent = maxPoint ? maxPoint.y.toFixed(2) : "없음";
            minDisplay.textContent = minPoint ? minPoint.y.toFixed(2) : "없음";

            ctx.font = "bold 16px Arial";
            if (maxPoint) drawPoint(maxPoint.x, maxPoint.y, "var(--accent)", "최댓값");
            if (minPoint) drawPoint(minPoint.x, minPoint.y, "var(--primary)", "최솟값");
        }

        function drawPoint(mx, my, color, label) {
            const px = toPixelX(mx), py = toPixelY(my);
            
            ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2);
            ctx.fillStyle = color; ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();

            const text = `${label}(${mx.toFixed(1)}, ${my.toFixed(1)})`;
            ctx.fillStyle = color;
            ctx.fillText(text, px + 20, py - 15);
        }

        function getPointerX(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            return clientX - rect.left;
        }

        function handlePointerDown(e) {
            const mouseX = getPointerX(e), mx = toMathX(mouseX);
            const xmin = getXMin(), xmax = getXMax();
            if (xmin === -Infinity || xmax === Infinity) return;
            const pxMin = toPixelX(xmin), pxMax = toPixelX(xmax);

            if (Math.abs(mouseX - pxMin) <= dragThreshold) isDraggingLeft = true;
            else if (Math.abs(mouseX - pxMax) <= dragThreshold) isDraggingRight = true;
            else if (mouseX > pxMin && mouseX < pxMax) { isDraggingBody = true; dragOffsetX = mx - xmin; }
        }

        function handlePointerMove(e) {
            if (isDraggingLeft || isDraggingRight || isDraggingBody) e.preventDefault();
            const mouseX = getPointerX(e), mx = toMathX(mouseX);
            const xmin = getXMin(), xmax = getXMax();

            if (xmin !== -Infinity && xmax !== Infinity) {
                const pxMin = toPixelX(xmin), pxMax = toPixelX(xmax);
                if (Math.abs(mouseX - pxMin) <= dragThreshold || Math.abs(mouseX - pxMax) <= dragThreshold) canvas.style.cursor = 'ew-resize';
                else if (mouseX > pxMin && mouseX < pxMax) canvas.style.cursor = 'grab';
                else canvas.style.cursor = 'default';
            }

            if (isDraggingLeft) { 
                inputXMin.value = snap(Math.min(mx, xmax - 0.5)); draw(); 
            }
            else if (isDraggingRight) { 
                inputXMax.value = snap(Math.max(mx, xmin + 0.5)); draw(); 
            }
            else if (isDraggingBody) {
                const intervalWidth = xmax - xmin;
                const newMin = Math.round((mx - dragOffsetX) * 2) / 2; // 스냅
                inputXMin.value = newMin.toFixed(1);
                inputXMax.value = (newMin + intervalWidth).toFixed(1);
                canvas.style.cursor = 'grabbing'; draw();
            }
        }

        function handlePointerUp() {
            isDraggingLeft = false; isDraggingRight = false; isDraggingBody = false;
            canvas.style.cursor = 'default';
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('mouseleave', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        canvas.addEventListener('touchend', handlePointerUp);
        canvas.addEventListener('touchcancel', handlePointerUp);

        [inputA, inputB, inputC, inputXMin, inputXMax].forEach(input => {
            input.addEventListener('input', draw);
        });

        draw();
    </script>
</body>
</html>
