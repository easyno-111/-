<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 시뮬레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --neon-pink: #ff0055;
            --neon-cyan: #00ffcc;
            --dark-bg: #050505;
            --panel: rgba(20, 20, 25, 0.8);
        }
        body {
            font-family: 'Noto Sans KR', sans-serif; margin: 20px;
            background-color: var(--dark-bg); color: white;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { color: var(--neon-blue); font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px rgba(0,210,255,0.5); margin-bottom: 20px; font-size: 24px; }
        
        .controls {
            background: var(--panel); padding: 20px; border-radius: 15px;
            border: 1px solid rgba(0, 210, 255, 0.3); box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 20px;
            align-items: center; justify-content: center; width: 100%; max-width: 800px;
            backdrop-filter: blur(10px);
        }
        .input-group { display: flex; align-items: center; gap: 5px; font-size: 18px; font-family: 'Orbitron', sans-serif; }
        
        input[type="number"] {
            width: 60px; padding: 8px; font-size: 16px; font-family: 'Orbitron', sans-serif;
            background: #111; color: var(--neon-blue); border: 1px solid #444;
            border-radius: 5px; text-align: center; outline: none; transition: 0.3s;
        }
        input[type="number"]:focus { border-color: var(--neon-blue); box-shadow: 0 0 8px rgba(0,210,255,0.5); }
        .interval-inputs input { width: 70px; }
        
        .info { font-size: 13px; color: #888; margin-top: 5px; margin-bottom: 15px; }
        
        #result-panel {
            font-size: 18px; font-family: 'Noto Sans KR', sans-serif; padding: 15px 25px;
            border-radius: 8px; background-color: rgba(0,0,0,0.5); border: 1px solid #333;
            min-width: 250px; text-align: center; line-height: 1.5;
        }
        .max-text { color: var(--neon-pink); font-weight: bold; text-shadow: 0 0 5px rgba(255,0,85,0.5); }
        .min-text { color: var(--neon-cyan); font-weight: bold; text-shadow: 0 0 5px rgba(0,255,204,0.5); }
        
        canvas {
            background: #0a0b10; border-radius: 10px; border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); cursor: default; touch-action: none;
        }
    </style>
</head>
<body>

    <h1>DATA SIMULATOR</h1>

    <div class="controls">
        <div class="input-group">
            <i>f(x)</i> = 
            <input type="number" id="val-a" value="1" step="0.1"> <i>x</i><sup>2</sup> + 
            <input type="number" id="val-b" value="-4" step="0.1"> <i>x</i> + 
            <input type="number" id="val-c" value="3" step="0.1">
        </div>
        
        <div class="input-group interval-inputs">
            RANGE: 
            <input type="number" id="val-xmin" value="0" step="0.5" placeholder="INF"> 
            &le; <i>x</i> &le; 
            <input type="number" id="val-xmax" value="5" step="0.5" placeholder="INF">
        </div>
        
        <div id="result-panel">
            <span class="max-text">MAX VAL: <span id="max-display">-</span></span><br>
            <span class="min-text">MIN VAL: <span id="min-display">-</span></span>
        </div>
    </div>
    <div class="info">※ 구간을 비우면 전체 구간으로 스캔합니다. 화면의 스캔 영역(구간)을 터치하여 드래그해보세요.</div>

    <canvas id="mathCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');

        const inputA = document.getElementById('val-a');
        const inputB = document.getElementById('val-b');
        const inputC = document.getElementById('val-c');
        const inputXMin = document.getElementById('val-xmin');
        const inputXMax = document.getElementById('val-xmax');
        const maxDisplay = document.getElementById('max-display');
        const minDisplay = document.getElementById('min-display');

        const scale = 40; 
        const originX = canvas.width / 2;
        const originY = canvas.height / 2 + 100; 

        let isDraggingLeft = false; let isDraggingRight = false; let isDraggingBody = false;
        let dragOffsetX = 0; const dragThreshold = 15;

        function getA() { return parseFloat(inputA.value) || 0; }
        function getB() { return parseFloat(inputB.value) || 0; }
        function getC() { return parseFloat(inputC.value) || 0; }
        function getXMin() { return inputXMin.value === "" ? -Infinity : parseFloat(inputXMin.value); }
        function getXMax() { return inputXMax.value === "" ? Infinity : parseFloat(inputXMax.value); }

        function f(x) { return getA() * x * x + getB() * x + getC(); }

        function toMathX(px) { return (px - originX) / scale; }
        function toMathY(py) { return -(py - originY) / scale; }
        function toPixelX(mx) { return originX + mx * scale; }
        function toPixelY(my) { return originY - my * scale; }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            
            const xmin = getXMin(), xmax = getXMax();
            const isRestricted = xmin !== -Infinity && xmax !== Infinity;

            if (isRestricted) drawIntervalHighlight(xmin, xmax);
            drawParabola(isRestricted, xmin, xmax);
            calculateAndDrawExtremes(xmin, xmax, isRestricted);
        }

        function drawGrid() {
            ctx.font = "12px Orbitron"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            for (let i = -20; i <= 20; i++) {
                ctx.beginPath();
                ctx.strokeStyle = i === 0 ? "rgba(0, 210, 255, 0.5)" : "rgba(255, 255, 255, 0.05)";
                ctx.lineWidth = i === 0 ? 2 : 1;
                ctx.moveTo(toPixelX(i), 0); ctx.lineTo(toPixelX(i), canvas.height); ctx.stroke();
                
                if (i !== 0 && i % 2 === 0) { ctx.fillStyle = "#555"; ctx.fillText(i, toPixelX(i), originY + 15); }

                ctx.beginPath();
                ctx.strokeStyle = i === 0 ? "rgba(0, 210, 255, 0.5)" : "rgba(255, 255, 255, 0.05)";
                ctx.lineWidth = i === 0 ? 2 : 1;
                ctx.moveTo(0, toPixelY(i)); ctx.lineTo(canvas.width, toPixelY(i)); ctx.stroke();

                if (i !== 0 && i % 2 === 0) { ctx.fillStyle = "#555"; ctx.fillText(i, originX - 15, toPixelY(i)); }
            }
            ctx.fillStyle = "rgba(0, 210, 255, 0.8)"; ctx.fillText("0", originX - 10, originY + 15);
        }

        function drawIntervalHighlight(xmin, xmax) {
            const pxMin = toPixelX(xmin), pxMax = toPixelX(xmax);
            ctx.fillStyle = "rgba(0, 210, 255, 0.1)"; 
            ctx.fillRect(pxMin, 0, pxMax - pxMin, canvas.height);

            ctx.strokeStyle = "#00d2ff"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pxMin, 0); ctx.lineTo(pxMin, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pxMax, 0); ctx.lineTo(pxMax, canvas.height); ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawParabola(isRestricted, xmin, xmax) {
            // 배경 실선 (제한 범위 밖)
            ctx.beginPath(); ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.lineWidth = 2;
            for (let px = 0; px <= canvas.width; px += 2) {
                let py = toPixelY(f(toMathX(px)));
                if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.stroke();

            // 강조된 실선 (제한 범위 내)
            if (isRestricted) {
                ctx.beginPath();
                ctx.strokeStyle = "#00d2ff"; ctx.lineWidth = 4;
                ctx.shadowBlur = 15; ctx.shadowColor = "#00d2ff"; // 네온 효과
                const startPx = Math.max(0, toPixelX(xmin));
                const endPx = Math.min(canvas.width, toPixelX(xmax));
                
                for (let px = startPx; px <= endPx; px += 1) {
                    let py = toPixelY(f(toMathX(px)));
                    if (px === startPx) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.shadowBlur = 0; // 초기화
            }
        }

        function calculateAndDrawExtremes(xmin, xmax, isRestricted) {
            const a = getA(), b = getB();
            if (a === 0) { maxDisplay.textContent = "-"; minDisplay.textContent = "-"; return; }

            const vertexX = -b / (2 * a);
            const candidates = [];

            if (isRestricted) {
                candidates.push({ x: xmin, y: f(xmin) });
                candidates.push({ x: xmax, y: f(xmax) });
                if (vertexX >= xmin && vertexX <= xmax) candidates.push({ x: vertexX, y: f(vertexX) });
            } else {
                candidates.push({ x: vertexX, y: f(vertexX) });
            }

            let maxPoint = candidates.reduce((p, c) => (p.y > c.y) ? p : c);
            let minPoint = candidates.reduce((p, c) => (p.y < c.y) ? p : c);

            if (!isRestricted) {
                if (a > 0) maxPoint = null; else minPoint = null; 
            }

            maxDisplay.textContent = maxPoint ? maxPoint.y.toFixed(2) : "NONE";
            minDisplay.textContent = minPoint ? minPoint.y.toFixed(2) : "NONE";

            ctx.font = "bold 14px Orbitron";
            if (maxPoint) drawPoint(maxPoint.x, maxPoint.y, "#ff0055", "MAX");
            if (minPoint) drawPoint(minPoint.x, minPoint.y, "#00ffcc", "MIN");
        }

        function drawPoint(mx, my, color, label) {
            const px = toPixelX(mx), py = toPixelY(my);
            
            ctx.shadowBlur = 10; ctx.shadowColor = color;
            ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2);
            ctx.fillStyle = color; ctx.fill();
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
            ctx.shadowBlur = 0;

            const text = `${label}(${mx.toFixed(1)}, ${my.toFixed(1)})`;
            ctx.fillStyle = color;
            ctx.fillText(text, px + 15, py - 15);
        }

        // 마우스/터치 이벤트 (기존과 동일)
        function getPointerX(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
            return clientX - rect.left;
        }

        function handlePointerDown(e) {
            const mouseX = getPointerX(e), mx = toMathX(mouseX);
            const xmin = getXMin(), xmax = getXMax();
            if (xmin === -Infinity || xmax === Infinity) return;
            const pxMin = toPixelX(xmin), pxMax = toPixelX(xmax);

            if (Math.abs(mouseX - pxMin) <= dragThreshold) isDraggingLeft = true;
            else if (Math.abs(mouseX - pxMax) <= dragThreshold) isDraggingRight = true;
            else if (mouseX > pxMin && mouseX < pxMax) { isDraggingBody = true; dragOffsetX = mx - xmin; }
        }

        function handlePointerMove(e) {
            if (isDraggingLeft || isDraggingRight || isDraggingBody) e.preventDefault();
            const mouseX = getPointerX(e), mx = toMathX(mouseX);
            const xmin = getXMin(), xmax = getXMax();

            if (xmin !== -Infinity && xmax !== Infinity) {
                const pxMin = toPixelX(xmin), pxMax = toPixelX(xmax);
                if (Math.abs(mouseX - pxMin) <= dragThreshold || Math.abs(mouseX - pxMax) <= dragThreshold) canvas.style.cursor = 'ew-resize';
                else if (mouseX > pxMin && mouseX < pxMax) canvas.style.cursor = 'grab';
                else canvas.style.cursor = 'default';
            }

            if (isDraggingLeft) { inputXMin.value = Math.min(mx, xmax - 0.5).toFixed(1); draw(); }
            else if (isDraggingRight) { inputXMax.value = Math.max(mx, xmin + 0.5).toFixed(1); draw(); }
            else if (isDraggingBody) {
                const intervalWidth = xmax - xmin;
                inputXMin.value = (mx - dragOffsetX).toFixed(1);
                inputXMax.value = (mx - dragOffsetX + intervalWidth).toFixed(1);
                canvas.style.cursor = 'grabbing'; draw();
            }
        }

        function handlePointerUp() {
            isDraggingLeft = false; isDraggingRight = false; isDraggingBody = false;
            canvas.style.cursor = 'default';
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('mouseleave', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        canvas.addEventListener('touchend', handlePointerUp);
        canvas.addEventListener('touchcancel', handlePointerUp);

        [inputA, inputB, inputC, inputXMin, inputXMax].forEach(input => {
            input.addEventListener('input', draw);
        });

        draw();
    </script>
</body>
</html>
