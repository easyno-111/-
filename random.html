const menu=document.getElementById('mode-menu'),frame=document.getElementById('game-frame'),loading=document.getElementById('loading');
function decodeUtf8Base64(data){const bin=atob(data);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
function openMode(mode){if(!GAME_DATA[mode])return;loading.style.display='grid';menu.style.display='none';frame.style.display='block';frame.onload=()=>{loading.style.display='none'};frame.srcdoc=decodeUtf8Base64(GAME_DATA[mode]);history.replaceState({mode},'',location.pathname+location.search+'#'+mode)}
function returnToModeMenu(){frame.srcdoc='<!doctype html><html><body></body></html>';frame.style.display='none';loading.style.display='none';menu.style.display='grid';history.replaceState({},'',location.pathname+location.search);scrollTo(0,0)}
window.returnToModeMenu=returnToModeMenu;
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&frame.style.display==='block')returnToModeMenu()});
window.addEventListener('load',()=>{const m=location.hash.slice(1);if(GAME_DATA[m])openMode(m)});
</script>
</body></html>
