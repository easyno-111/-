<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 뽑기 기계</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f7f9fc;
            --accent: #5c6bc0;
            --machine-glass: rgba(255, 255, 255, 0.4);
            --machine-border: rgba(255, 255, 255, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
        
        body { 
            background-color: var(--bg-color); color: #333; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; overflow: hidden; padding: 20px; 
            perspective: 1000px; /* 3D 원근감을 위한 부모 설정 */
        }

        /* 💥 강렬한 화면 흔들림 */
        @keyframes violentShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-10px, -15px) rotate(-2deg); }
            20% { transform: translate(15px, 10px) rotate(3deg); }
            30% { transform: translate(-15px, 15px) rotate(-3deg); }
            40% { transform: translate(10px, -10px) rotate(2deg); }
            50% { transform: translate(-5px, -5px) rotate(-1deg); }
            60% { transform: translate(5px, 5px) rotate(1deg); }
        }
        .shake-active { animation: violentShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }

        .container {
            background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center; max-width: 550px; width: 100%; position: relative; z-index: 10;
        }

        h1 { font-size: 24px; color: var(--accent); margin-bottom: 20px; }

        #setup-screen { display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; align-items: center; justify-content: center; gap: 10px; }
        input[type="number"] { width: 80px; padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; text-align: center; outline: none; transition: 0.3s; }
        input[type="number"]:focus { border-color: var(--accent); }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        .btn { 
            background: var(--accent); color: white; border: none; padding: 12px 24px; 
            font-size: 16px; border-radius: 12px; cursor: pointer; font-weight: bold; 
            transition: all 0.2s; box-shadow: 0 4px 10px rgba(92, 107, 192, 0.3); 
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(92, 107, 192, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-screenshot { background: #94a3b8; box-shadow: 0 4px 10px rgba(148, 163, 184, 0.3); }
        .btn-screenshot:hover { box-shadow: 0 6px 15px rgba(148, 163, 184, 0.4); }

        #machine-screen { display: none; flex-direction: column; align-items: center; }
        .machine-wrapper { position: relative; margin: 20px 0 40px 0; width: 300px; height: 380px; }
        
        .cylinder {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 70px; height: 90px;
            background: linear-gradient(to right, rgba(255,255,255,0.6), rgba(255,255,255,0.9), rgba(255,255,255,0.6));
            border: 3px solid var(--machine-border); border-bottom: none; border-radius: 10px 10px 0 0; z-index: 15; backdrop-filter: blur(5px);
        }
        .sphere {
            position: absolute; bottom: 0; left: 0; width: 300px; height: 300px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2) 70%);
            border: 5px solid var(--machine-border); border-radius: 50%;
            box-shadow: inset -10px -10px 30px rgba(0,0,0,0.05), 0 15px 25px rgba(0,0,0,0.1);
            backdrop-filter: blur(2px); z-index: 10;
        }
        .balls-container {
            position: absolute; bottom: 0; left: 0; width: 300px; height: 300px; border-radius: 50%; z-index: 8; overflow: visible; 
        }
        .ball {
            position: absolute; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 16px; color: #333;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.15), 0 3px 5px rgba(0,0,0,0.2);
            transform-origin: center; will-change: transform;
        }

        .result-area { margin-top: 30px; width: 100%; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        .result-title { font-size: 14px; color: #64748b; margin-bottom: 15px; font-weight: bold; }
        .result-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 50px; }
        .result-ball {
            width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 18px; color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* =========================================
           🎬 다이나믹 액션 연출 (오버레이)
           ========================================= */
        #action-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
            overflow: hidden; opacity: 0; transition: opacity 0.3s ease-out;
            perspective: 1200px;
        }

        /* 섬광 효과 */
        .flash-bang {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 200;
        }
        .flash-active { animation: flashAnim 0.8s ease-out forwards; }
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 혼돈의 페이크 공들 (원근감 비행) */
        .fake-ball {
            position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: 'Poppins', sans-serif; font-weight: 800; color: rgba(0,0,0,0.3);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.3);
            transform: translate3d(0, 100vh, -1000px); opacity: 0; will-change: transform, opacity;
        }

        /* 🎯 진짜 타겟 공 */
        .target-wrapper {
            position: absolute; z-index: 50; width: 150px; height: 150px;
            transform: translate3d(0, 100vh, -500px); /* 화면 아래쪽 멀리서 대기 */
            transition: transform 3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .target-ball {
            width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: 'Poppins', sans-serif; font-size: 60px; font-weight: 800; color: #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset -15px -15px 30px rgba(0,0,0,0.1);
        }

        /* 🗡️ 던져지는 나이프 */
        .flying-knife {
            position: absolute; z-index: 60; width: 60px; height: 180px;
            /* 정면에서 날아가는 느낌: 크고 가까운 곳(translateZ)에서 시작 */
            transform: translate3d(0, 50vh, 1000px) rotate(15deg) scale(3); 
            opacity: 0; will-change: transform;
        }
        .flying-knife svg { width: 100%; height: 100%; filter: drop-shadow(0 15px 10px rgba(0,0,0,0.6)); }

        /* 상태 애니메이션 클래스 */
        .target-hang { transform: translate3d(0, 0, 0) !important; }
        .target-zoom { transform: translate3d(0, 0, 300px) !important; }
        
        .knife-strike {
            animation: strikeAnim 0.15s cubic-bezier(0.5, 0, 1, 1) forwards;
        }
        @keyframes strikeAnim {
            0% { transform: translate3d(0, 50vh, 800px) rotate(5deg) scale(3); opacity: 1; }
            100% { transform: translate3d(0, -50px, 10px) rotate(0deg) scale(1.2); opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="container" id="setup-screen">
        <h1>🎲 랜덤 뽑기 범위 설정</h1>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 10px;">시작 번호와 끝 번호를 입력하세요.</p>
        <div class="input-group">
            <input type="number" id="min-num" value="1" min="1">
            <span>~</span>
            <input type="number" id="max-num" value="30" min="2">
        </div>
        <button class="btn" style="margin-top: 20px;" onclick="startMachine()">다음 단계로 <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <div class="container" id="machine-screen">
        <h1 style="margin-bottom: 5px;">🚀 추첨기 가동</h1>
        <div class="machine-wrapper">
            <div class="cylinder"></div>
            <div class="balls-container" id="balls-container"></div>
            <div class="sphere" id="sphere-bg"></div>
        </div>
        
        <div class="btn-group">
            <button class="btn" id="draw-btn" onclick="drawBall()">번호 뽑기</button>
            <button class="btn btn-screenshot" id="capture-btn" onclick="takeScreenshot()"><i class="fa-solid fa-camera"></i> 캡처</button>
        </div>
        
        <div class="result-area">
            <div class="result-title">당첨 번호 기록</div>
            <div class="result-list" id="result-list"></div>
        </div>
    </div>

    <div id="action-overlay">
        </div>

    <script>
        const sphereRadius = 150; 
        const ballRadius = 20;    
        const boundary = sphereRadius - ballRadius - 5; 
        const center = { x: sphereRadius, y: sphereRadius };
        
        let balls = [];
        let animationFrameId;
        let isDrawing = false; 

        const pastelColors = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#e2cbff', '#f3e8ff', '#c7ceea'];

        function startMachine() {
            const min = parseInt(document.getElementById('min-num').value);
            const max = parseInt(document.getElementById('max-num').value);

            if (min >= max || isNaN(min) || isNaN(max)) {
                alert("올바른 숫자 범위를 입력해주세요!");
                return;
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('machine-screen').style.display = 'flex';

            initBalls(min, max);
            animate();
        }

        function initBalls(min, max) {
            const container = document.getElementById('balls-container');
            container.innerHTML = '';
            balls = [];

            for (let i = min; i <= max; i++) {
                const ballEl = document.createElement('div');
                ballEl.className = 'ball';
                ballEl.innerText = i;
                
                const color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                ballEl.style.background = `radial-gradient(circle at 30% 30%, #fff, ${color})`;
                
                container.appendChild(ballEl);

                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * (boundary - 20);
                
                balls.push({
                    el: ballEl,
                    num: i,
                    color: color,
                    x: center.x + Math.cos(angle) * r,
                    y: center.y + Math.sin(angle) * r,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    state: 'bouncing' 
                });
            }
        }

        function animate() {
            balls.forEach(ball => {
                if (ball.state === 'bouncing') {
                    ball.vx += (Math.random() - 0.5) * 1.5;
                    ball.vy += (Math.random() - 0.5) * 1.5 - 0.1; 

                    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                    if (speed > 12) {
                        ball.vx = (ball.vx / speed) * 12;
                        ball.vy = (ball.vy / speed) * 12;
                    }

                    ball.x += ball.vx;
                    ball.y += ball.vy;

                    const dx = ball.x - center.x;
                    const dy = ball.y - center.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > boundary) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const dot = ball.vx * nx + ball.vy * ny;
                        
                        ball.vx = ball.vx - 2 * dot * nx;
                        ball.vy = ball.vy - 2 * dot * ny;
                        ball.x = center.x + nx * boundary;
                        ball.y = center.y + ny * boundary;
                        ball.vx *= 0.95; 
                        ball.vy *= 0.95;
                    }

                    ball.el.style.transform = `translate(${ball.x - ballRadius}px, ${ball.y - ballRadius}px)`;
                } 
                else if (ball.state === 'drawing') {
                    const targetX = center.x;
                    const targetY = -40; 
                    
                    ball.x += (targetX - ball.x) * 0.15;
                    ball.y += (targetY - ball.y) * 0.15;
                    ball.el.style.transform = `translate(${ball.x - ballRadius}px, ${ball.y - ballRadius}px)`;
                }
            });

            animationFrameId = requestAnimationFrame(animate);
        }

        function drawBall() {
            const bouncingBalls = balls.filter(b => b.state === 'bouncing');
            
            if (bouncingBalls.length === 0) {
                alert("모든 번호를 뽑았습니다!");
                return;
            }
            if (isDrawing) return;

            isDrawing = true;
            const drawBtn = document.getElementById('draw-btn');
            const captureBtn = document.getElementById('capture-btn');
            drawBtn.disabled = true;
            captureBtn.disabled = true;
            drawBtn.innerText = "추출 중...";

            const randomIndex = Math.floor(Math.random() * bouncingBalls.length);
            const selectedBall = bouncingBalls[randomIndex];
            
            selectedBall.state = 'drawing';
            selectedBall.el.style.zIndex = "25";

            setTimeout(() => {
                balls = balls.filter(b => b !== selectedBall);
                selectedBall.el.remove(); 
                executeDynamicAction(selectedBall, drawBtn, captureBtn);
            }, 800); 
        }

        function executeDynamicAction(ball, drawBtn, captureBtn) {
            const overlay = document.getElementById('action-overlay');
            overlay.innerHTML = ''; // 이전 연출 요소 초기화
            
            overlay.style.display = 'flex';
            
            // 1. 혼돈의 페이크 공들 생성 (배경)
            for(let i = 0; i < 25; i++) {
                let fake = document.createElement('div');
                fake.className = 'fake-ball';
                let size = Math.random() * 80 + 40; // 40~120px
                fake.style.width = size + 'px';
                fake.style.height = size + 'px';
                fake.style.fontSize = (size * 0.4) + 'px';
                fake.innerText = Math.floor(Math.random() * 30) + 1;
                fake.style.background = `radial-gradient(circle at 30% 30%, #fff, ${pastelColors[Math.floor(Math.random()*pastelColors.length)]})`;
                
                overlay.appendChild(fake);
                
                // 개별 랜덤 비행 애니메이션 (JS로 위치 이동)
                let startX = (Math.random() - 0.5) * window.innerWidth;
                let endX = startX + (Math.random() - 0.5) * 500;
                let delay = Math.random() * 600;
                
                fake.animate([
                    { transform: `translate3d(${startX}px, 100vh, -1000px)`, opacity: 0 },
                    { opacity: 1, offset: 0.1 },
                    { transform: `translate3d(${(startX+endX)/2}px, -30vh, 200px)`, opacity: 1, offset: 0.5 },
                    { transform: `translate3d(${endX}px, 100vh, 800px)`, opacity: 0 }
                ], {
                    duration: 1500 + Math.random() * 1000,
                    delay: delay,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                    fill: 'forwards'
                });
            }

            // 2. 🎯 타겟 공 (진짜) 생성
            let targetWrapper = document.createElement('div');
            targetWrapper.className = 'target-wrapper';
            
            let targetBall = document.createElement('div');
            targetBall.className = 'target-ball';
            targetBall.innerText = ball.num;
            targetBall.style.background = `radial-gradient(circle at 30% 30%, #fff, ${ball.color})`;
            
            targetWrapper.appendChild(targetBall);
            overlay.appendChild(targetWrapper);

            // 3. 🗡️ 던질 나이프 (SVG 형태의 멋진 단검)
            let knife = document.createElement('div');
            knife.className = 'flying-knife';
            knife.innerHTML = `
                <svg viewBox="0 0 100 200">
                    <path d="M50,10 L65,80 L50,120 L35,80 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
                    <path d="M50,10 L65,80 L50,120 Z" fill="#f8fafc"/> <rect x="25" y="120" width="50" height="15" rx="5" fill="#334155"/>
                    <rect x="40" y="135" width="20" height="50" rx="3" fill="#8b5a2b"/>
                    <circle cx="50" cy="190" r="10" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
                </svg>
            `;
            
            // 4. 섬광 이펙트용 div
            let flash = document.createElement('div');
            flash.className = 'flash-bang';
            overlay.appendChild(flash);
            overlay.appendChild(knife);

            // 🎬 애니메이션 타임라인 시작
            requestAnimationFrame(() => {
                overlay.style.opacity = '1';

                // T+0.5s : 타겟 공이 중앙으로 솟아올라 정지 (매트릭스 연출)
                setTimeout(() => {
                    targetWrapper.classList.add('target-hang');
                }, 500);

                // T+1.2s : 정면에서 칼 투척!
                setTimeout(() => {
                    knife.classList.add('knife-strike');
                }, 1200);

                // T+1.35s : 💥 칼이 꽂히는 순간 (화면 흔들림 + 섬광 + 줌인)
                setTimeout(() => {
                    document.body.classList.add('shake-active'); // 화면 쾅!
                    flash.classList.add('flash-active');         // 섬광 팍!
                    
                    // 칼이 꽂힌 채로 카메라 앞(유저)으로 서서히 확대
                    targetWrapper.classList.add('target-zoom');
                    knife.style.transform = "translate3d(0, -50px, 310px) rotate(0deg) scale(1.2)";
                    knife.style.transition = "transform 3s cubic-bezier(0.1, 0.9, 0.2, 1)";
                    
                }, 1350); 

                // T+3.8s : 연출 종료 및 결과창 반영
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    document.body.classList.remove('shake-active');
                    
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        addToResultList(ball);
                        
                        isDrawing = false;
                        drawBtn.disabled = false;
                        captureBtn.disabled = false;
                        drawBtn.innerText = "번호 뽑기";
                    }, 300); 

                }, 3800); 
            });
        }

        function addToResultList(ball) {
            const resultList = document.getElementById('result-list');
            const resultEl = document.createElement('div');
            resultEl.className = 'result-ball';
            resultEl.innerText = ball.num;
            resultEl.style.background = `radial-gradient(circle at 30% 30%, #fff, ${ball.color})`;
            resultList.appendChild(resultEl);
        }

        // 📸 스크린샷 캡처
        function takeScreenshot() {
            const captureArea = document.getElementById('machine-screen');
            const captureBtn = document.getElementById('capture-btn');
            
            const originalText = captureBtn.innerHTML;
            captureBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 캡처 중...';
            captureBtn.disabled = true;

            html2canvas(captureArea, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = '당첨결과_스크린샷.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                captureBtn.innerHTML = originalText;
                captureBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
