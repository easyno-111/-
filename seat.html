<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>교실 올인원 배정기</title>

  <meta
    name="description"
    content="학생 명단, 청소구역 배정, 자리 랜덤 배치 및 기록 관리를 위한 교실 올인원 배정기"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family:
        Pretendard,
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    .launcher {
      width: min(100%, 460px);
      padding: 36px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dde3ea;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(20, 31, 50, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    p {
      margin: 0 0 24px;
      color: #667085;
      line-height: 1.65;
    }

    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 24px;
      border: 4px solid #e5e9ef;
      border-top-color: #254b87;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      background: #254b87;
      border-radius: 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="launcher">
    <div class="spinner" aria-hidden="true"></div>

    <h1>교실 올인원 배정기</h1>

    <p>
      학생 명단과 저장된 프리셋을 불러오고 있습니다.<br>
      자동으로 이동하지 않으면 아래 버튼을 눌러주세요.
    </p>

    <a id="openApp" href="#">배정기 열기</a>
  </main>

  <script>
    const APP_URL =
      "https://script.google.com/macros/s/AKfycby-GyyuYVdeA3NRQwxlBRFUGTWQss64EZlOIlL-_RYy3spNNt8QxRcVA50GDRJ0KzP4Gw/exec";

    const button = document.getElementById("openApp");
    button.href = APP_URL;

    window.setTimeout(() => {
      window.location.replace(APP_URL);
    }, 700);
  </script>
</body>
</html>
