<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그라이트 화력 슈팅 (V47 하드코어 경험치 밸런스)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Apple SD Gothic Neo', sans-serif; user-select: none; }
        body { background-color: #050510; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100vh; background: #0b0b1a; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-left: 2px solid #2f3640; border-right: 2px solid #2f3640; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; pointer-events: none; z-index: 10; }
        .bar-bg { width: 100%; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-bottom: 8px; border: 2px solid #2f3640; overflow: hidden; position: relative; }
        #hp-bar { height: 100%; background: #ff4757; width: 100%; transition: width 0.2s; }
        #exp-bar { height: 100%; background: #1e90ff; width: 0%; transition: width 0.2s; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 14px; font-weight: bold; color: white; line-height: 16px; text-shadow: 1px 1px 2px black; }
        .top-stats { display: flex; flex-direction: column; gap: 5px; color: white; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px black; margin-top: 5px; pointer-events: auto; max-width: 70%; }

        #boss-timer-display { display: none; color: #ff4757; font-size: 22px; font-weight: 900; text-align: center; margin-top: 25px; text-shadow: 0 0 15px #ff4757; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        #sound-btn { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.8); border: 2px solid #57606f; border-radius: 50%; width: 50px; height: 50px; font-size: 22px; cursor: pointer; color: white; pointer-events: auto; display: flex; justify-content: center; align-items: center; z-index: 999; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #skill-btn { position: fixed; bottom: 20px; right: 20px; width: 85px; height: 85px; border-radius: 50%; background: rgba(0, 210, 211, 0.85); color: white; font-size: 18px; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0, 210, 211, 0.6); pointer-events: auto; border: 4px solid #fff; z-index: 999; cursor: pointer; transition: 0.1s; }
        #skill-btn.cooldown { background: rgba(100, 100, 100, 0.7); border-color: #888; color: #ccc; pointer-events: none; }

        @media (min-width: 700px) {
            #sound-btn { top: 40px; left: calc(50% - 240px - 80px); }
            #skill-btn { bottom: 60px; right: calc(50% - 240px - 110px); width: 100px; height: 100px; }
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        .title-text { font-size: 40px; font-weight: 900; color: #00a8ff; text-shadow: 0 0 20px rgba(0, 168, 255, 0.5); margin-bottom: 20px; text-align: center; }
        .start-btn { padding: 15px 40px; background: #00a8ff; color: white; border: none; border-radius: 30px; font-size: 22px; font-weight: bold; cursor: pointer; pointer-events: auto; transition: 0.2s; }
        .start-btn:hover { background: #0082c8; transform: scale(1.05); }

        #levelup-screen { display: none; pointer-events: auto; }
        .ability-card { background: #2f3542; width: 90%; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 2px solid #57606f; cursor: pointer; color: white; transition: 0.2s; }
        .ability-card.rare { border-color: #00a8ff; background: #0b1a2b; box-shadow: 0 0 10px rgba(0, 168, 255, 0.3); }
        .ability-card.legendary { border-color: #00ffff; background: #002233; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .ability-card:hover { transform: scale(1.03); background: #3a4151; }
        
        .ab-name { font-size: 16px; font-weight: 900; margin-bottom: 6px; }
        .ab-desc { font-size: 13px; color: #dfe6e9; line-height: 1.4; word-break: keep-all; opacity: 0.9;}

        .type-basic { color: #74b9ff; } 
        .type-skill { color: #55efc4; } 
        .type-util { color: #ffeaa7; }  

        .chest-box { font-size: 80px; cursor: pointer; transition: transform 0.2s; z-index: 2; position: relative; }
        #beam-container { position: absolute; bottom: 40px; left: 50%; width: 0; height: 0; z-index: 1; }
        .beam { position: absolute; bottom: 0; left: -30px; width: 60px; height: 800px; transform-origin: bottom center; opacity: 0; transition: opacity 0.3s, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.5s; mix-blend-mode: screen; filter: blur(2px); }
        
        #flash-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: white; opacity: 0; pointer-events: none; z-index: 9999; transition: opacity 0.1s; }

        @keyframes shake-small {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-8px) rotate(-8deg); }
            75% { transform: translateX(8px) rotate(8deg); }
        }
        @keyframes shake-crazy {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            10% { transform: translate(-12px, -8px) rotate(-15deg) scale(1.1); }
            30% { transform: translate(12px, 8px) rotate(15deg) scale(1.15); }
            50% { transform: translate(-12px, 8px) rotate(-15deg) scale(1.1); }
            70% { transform: translate(12px, -8px) rotate(15deg) scale(1.2); }
            90% { transform: translate(0px, 0px) rotate(0deg) scale(1.25); filter: brightness(1.5); }
        }

        #dev-panel { display: none; position: fixed; top: 5%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(10, 15, 25, 0.95); border: 2px solid #00a8ff; border-radius: 15px; padding: 20px; color: white; z-index: 1000; max-height: 90vh; overflow-y: auto; pointer-events: auto; box-shadow: 0 0 30px rgba(0, 168, 255, 0.4); }
        .dev-skill-row { display: flex; justify-content: space-between; align-items: center; background: #2f3542; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
        .dev-btn-small { background: #00a8ff; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .dev-btn-small:hover { background: #0082c8; }
        .dev-btn { background: #57606f; color: white; border: none; padding: 10px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .max-tag { color: #f1c40f; font-weight: 900; font-size: 14px; }
        .dev-input { width: 60px; text-align: center; border-radius: 5px; border: 1px solid #00a8ff; outline: none; background: #111; color: white; font-weight: bold; padding: 4px; }
    </style>
</head>
<body>
    
    <div id="flash-overlay"></div>

    <button id="sound-btn" onclick="toggleSound()">🔊</button>
    <div id="skill-btn" onmousedown="fireSkill(event)" ontouchstart="fireSkill(event)">
        <div id="skill-name">스킬(A)</div>
        <div id="skill-cool" style="font-size:32px; font-weight:900;"></div>
    </div>

    <div id="game-container">
        <div id="ui-layer" style="display: none;">
            <div class="bar-bg"><div id="hp-bar"></div><div class="bar-text" id="hp-text">HP: 100 / 100</div></div>
            <div class="bar-bg"><div id="exp-bar"></div><div class="bar-text" id="exp-text">LV.1</div></div>
            <div class="top-stats">
                <div id="score-display" onclick="checkDevMode()" style="cursor: pointer;">SCORE: 0</div>
                <div id="boss-kill-display">처치한 보스: 0 / 20</div>
            </div>
            <div id="boss-timer-display">⚠️ 보스 출현! 남은 시간: 30s ⚠️</div>
        </div>

        <div class="overlay" id="start-screen">
            <div class="title-text">SURVIVOR<br>SHOOTER</div>

            <!-- 🎒 초기 스타팅 및 난이도 로드아웃 UI -->
            <div style="background: rgba(47, 53, 66, 0.9); padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #00a8ff; text-align: left; width: 85%; max-width: 320px; box-shadow: 0 0 20px rgba(0, 168, 255, 0.3);">
                
                <label style="color: #ff7675; font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block;">🔥 난이도 선택</label>
                <select id="start-difficulty" style="width: 100%; padding: 8px; background: #111; color: white; border: 1px solid #ff7675; border-radius: 5px; font-weight: bold; margin-bottom: 12px; outline: none;">
                    <option value="easy">🟢 Easy (현재 밸런스)</option>
                    <option value="normal">🟡 Normal (체력 스케일링 증가)</option>
                    <option value="hard">🔴 Hard (지옥의 스케일링)</option>
                </select>

                <label style="color: #f1c40f; font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block;">🎯 기본 액티브 스킬</label>
                <select id="start-active" style="width: 100%; padding: 8px; background: #111; color: white; border: 1px solid #f1c40f; border-radius: 5px; font-weight: bold; margin-bottom: 12px; outline: none;">
                    <option value="boomerang">🪃 부메랑</option>
                    <option value="laser">🔱 레이저</option>
                    <option value="punch">🐾 냥냥펀치</option>
                </select>

                <label style="color: #00ffff; font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block;">✨ 초기 특성 지원 (1Lv 지급)</label>
                <select id="start-passive" style="width: 100%; padding: 8px; background: #111; color: white; border: 1px solid #00ffff; border-radius: 5px; font-weight: bold; outline: none;">
                    <option value="lvl_atk">⚔️ 공격력 UP</option>
                    <option value="lvl_firespeed">🔫 연사 속도 UP</option>
                    <option value="lvl_pierce">🏹 평타 관통</option>
                    <option value="lvl_bullet">💥 탄환 확산</option>
                    <option value="lvl_skill_dmg">🪄 스킬 파괴력 UP</option>
                    <option value="lvl_skill_cd">⏳ 스킬 쿨타임 감소</option>
                    <option value="lvl_regen">💖 자연 회복</option>
                    <option value="lvl_vampire">🧛 흡혈</option>
                </select>
            </div>

            <div class="skin-btn-group" style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="skin-btn" style="padding:10px; border-radius:8px; cursor:pointer; background:#2f3542; color:white; border:none; border: 1px solid #57606f;" onclick="document.getElementById('p-img-upload').click()">내 캐릭터</button>
                <button class="skin-btn" style="padding:10px; border-radius:8px; cursor:pointer; background:#2f3542; color:white; border:none; border: 1px solid #57606f;" onclick="document.getElementById('e-img-upload').click()">적 캐릭터</button>
            </div>
            <input type="file" id="p-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'player')">
            <input type="file" id="e-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'enemy')">
            
            <button class="start-btn" onclick="startGame()">전투 시작</button>
        </div>

        <div class="overlay" id="levelup-screen">
            <div id="lvl-title-text" style="font-size:32px; color:white; font-weight:900; margin-bottom:20px; text-shadow: 0 0 10px rgba(255,255,255,0.5);">미지의 상자 발견!</div>
            
            <div id="chest-container" style="display:flex; flex-direction:column; align-items:center; position:relative;">
                <div id="beam-container"></div>
                <div id="chest-emoji" class="chest-box" onpointerdown="autoOpenChest()">🎁</div>
                <p id="chest-desc" style="color:#dfe6e9; margin-top:20px; font-weight:bold;">터치하여 개방하기</p>
            </div>
            
            <div id="ability-container" style="width: 100%; display: none; flex-direction: column; align-items: center; overflow-y: auto; max-height: 70vh;"></div>
            <button id="reroll-btn">🔄 능력 새로고침 (1회)</button>
        </div>

        <div class="overlay" id="end-screen" style="display: none;">
            <div id="end-title" class="title-text"></div>
            <p id="final-score" style="color: white; font-size: 22px; margin-bottom: 30px; text-align: center;"></p>
            <button class="start-btn" onclick="location.reload()">다시 시작</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 🛠️ 개발자 패널 -->
    <div id="dev-panel">
        <h3 style="text-align:center; color:#00a8ff; margin-bottom:15px;">🛠️ 개발자 시스템 툴</h3>
        
        <div style="display:flex; gap:10px; margin-bottom: 15px; align-items: center; background:#2f3542; padding:10px; border-radius:8px; justify-content: space-between;">
            <label style="font-weight:bold;">테스트 소환</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="dev-boss-lvl" value="1" min="1" max="20" class="dev-input" style="color:white; width:45px;">
                <button class="dev-btn-small" onclick="spawnDevBoss()" style="width:auto; padding:0 8px; background:#8e44ad;">보스</button>
                <button class="dev-btn-small" onclick="spawnSwarmTest()" style="width:auto; padding:0 8px; background:#e67e22;">물량</button>
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom: 15px;">
            <button class="dev-btn" onclick="toggleSpawn()" style="margin:0; background:#eb4d4b;">소환/타이머 정지</button>
            <button class="dev-btn" onclick="clearAllEnemies()" style="margin:0; background:#f0932b;">몹 싹쓸이</button>
        </div>
        <div id="dev-skills-list"></div>
        <button class="dev-btn" onclick="closeDevMode()" style="margin-top:15px;">닫기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        function resize() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
        window.addEventListener('resize', resize); resize();

        let gameState = 'START';
        let frameCount = 0; let score = 0; let bossKills = 0;
        const WIN_CONDITION = 20;
        let isBossStage = false; let isBossWarning = false; let bossWarningTimer = 0;
        let bossTimer = 30; 
        const BOSS_SPAWN_INTERVAL = 1800; 
        let bossSpawnTimer = BOSS_SPAWN_INTERVAL; 
        let globalShakeTimer = 0; 
        
        let isSwarm = false;
        let swarmWarningTimer = 0;

        let stars = [];
        for(let i=0; i<80; i++) stars.push({x: Math.random()*1000, y: Math.random()*1000, s: Math.random()*2+1, v: Math.random()*2+2});

        let p = {}; let bullets = []; let enemies = []; let particles = []; let activeSkills = []; 
        let shurikens = []; let orbitals = []; let lightnings = []; let bossBullets = []; let homingBullets = [];
        let swords = []; let blackholes = []; 

        const colorLevels = {
            atk: ['#f1c40f', '#f39c12', '#e67e22', '#d35400', '#e74c3c', '#c0392b', '#fd79a8', '#e84393', '#a29bfe', '#6c5ce7', '#00cec9'], 
            homing: ['#00ffff', '#00d2d3', '#48dbfb', '#0abde3', '#54a0ff', '#2e86de'], 
            lightning: ['0,255,255', '32,224,255', '64,192,255', '96,160,255', '128,128,255', '160,96,255', '192,64,255', '224,32,255', '255,0,255', '255,0,200', '255,0,150'],
            sword: ['#f39c12', '#e74c3c', '#8e44ad', '#2980b9', '#2ecc71', '#1abc9c'],
            storm: ['#00a8ff', '#0097e6', '#9c88ff', '#8c7ae6', '#fbc531', '#e1b12c'],
            boomerang: ['#00d2d3', '#00b894', '#00cec9', '#0984e3', '#6c5ce7', '#fd79a8'],
            laser: ['#ffffff', '#ffeaa7', '#fab1a0', '#ff7675', '#fd79a8', '#e84393'],
            punch: ['#ff9ff3', '#f368e0', '#ff6b6b', '#ee5253', '#0abde3', '#2e86de'],
            meteor: ['#e17055', '#d63031', '#c0392b', '#b33939', '#ff3f34', '#ff9f43'],
            shuriken: ['#f1c40f', '#e67e22', '#e74c3c', '#fd79a8', '#9c88ff', '#00cec9'] 
        };

        const spriteCache = {};
        function getSprite(type, color, param) {
            let key = type + '_' + color + '_' + param;
            if(!spriteCache[key]) {
                let c = document.createElement('canvas');
                let cx = c.getContext('2d');
                if (type === 'enemy') {
                    let size = param || 30; c.width = size; c.height = size;
                    let half = size / 2; cx.translate(half, half);
                    cx.fillStyle = color;
                    cx.beginPath(); cx.arc(0, 0, half - 2, 0, Math.PI*2); cx.fill();
                    cx.fillStyle = 'rgba(0,0,0,0.6)';
                    cx.beginPath(); cx.arc(-4, -2, 3, 0, Math.PI*2); cx.fill();
                    cx.beginPath(); cx.arc(4, -2, 3, 0, Math.PI*2); cx.fill();
                } else if (type === 'paw') {
                    let w = param; c.width = w*2; c.height = w*2; cx.translate(w, w);
                    cx.fillStyle='#fff'; cx.beginPath(); cx.ellipse(0,0,w*0.4,w*0.35,0,0,Math.PI*2); cx.fill(); 
                    cx.fillStyle= color; 
                    cx.beginPath(); cx.arc(0,5,w*0.15,0,Math.PI*2); cx.fill(); 
                    cx.beginPath(); cx.arc(-14,-10,w*0.08,0,Math.PI*2); cx.fill(); 
                    cx.beginPath(); cx.arc(0,-18,w*0.08,0,Math.PI*2); cx.fill(); 
                    cx.beginPath(); cx.arc(14,-10,w*0.08,0,Math.PI*2); cx.fill(); 
                } else if (type === 'sword') {
                    c.width = 40; c.height = 80; cx.translate(20, 40);
                    cx.shadowColor = color; cx.shadowBlur = 10;
                    cx.fillStyle = color; cx.globalAlpha = 0.4; cx.beginPath(); cx.moveTo(0, -35); cx.lineTo(10, 15); cx.lineTo(-10, 15); cx.closePath(); cx.fill();
                    cx.globalAlpha = 1; cx.fillStyle = '#fff'; cx.beginPath(); cx.moveTo(0, -25); cx.lineTo(4, 10); cx.lineTo(-4, 10); cx.closePath(); cx.fill();
                    cx.fillStyle = color; cx.fillRect(-8, 10, 16, 3); cx.fillRect(-2, 13, 4, 8);
                } else if (type === 'shuriken') {
                    c.width = 40; c.height = 40; cx.translate(20, 20);
                    cx.fillStyle = color; cx.beginPath();
                    for(let j=0; j<4; j++) { cx.lineTo(16,0); cx.lineTo(4,4); cx.rotate(Math.PI/2); } cx.fill();
                }
                spriteCache[key] = c;
            }
            return spriteCache[key];
        }

        let customPlayerImg = new Image(); customPlayerImg.src = "player.png"; customPlayerImg.onerror = () => { customPlayerImg = null; };
        let customEnemyImg = null; 

        function handleImage(event, type) {
            const file = event.target.files[0]; if (!file) return;
            const img = new Image(); img.src = URL.createObjectURL(file);
            img.onload = () => { if (type === 'player') customPlayerImg = img; else customEnemyImg = img; };
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx; let isSoundOn = true; let bgmInterval = null; let bgmStep = 0;
        let lastSoundTime = {};

        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            startBGM(); 
        }
        
        function toggleSound() { 
            isSoundOn = !isSoundOn; 
            document.getElementById('sound-btn').innerText = isSoundOn ? '🔊' : '🔇'; 
            if(!isSoundOn && bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            else if(isSoundOn) startBGM();
        }
        
        function startBGM() {
            if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            bgmStep = 0;
            bgmInterval = setInterval(() => {
                if(!isSoundOn || gameState !== 'PLAYING') return;
                const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                let notes = [130, 130, 155, 174, 130, 196, 155, 130];
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(notes[bgmStep%8] * (isBossStage || isBossWarning || isSwarm ? 1.5 : 1), t);
                gain.gain.setValueAtTime(0.012, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
                osc.start(t); osc.stop(t+0.15); bgmStep++;
            }, 200);
        }
        
        function playSound(type) {
            if(!isSoundOn || !audioCtx) return; 
            const t = audioCtx.currentTime; 
            if(type === 'hit' && t - (lastSoundTime.hit || 0) < 0.05) return;
            if(type === 'shoot' && t - (lastSoundTime.shoot || 0) < 0.05) return;
            if(type === 'zap' && t - (lastSoundTime.zap || 0) < 0.05) return;
            if(type === 'pop' && t - (lastSoundTime.pop || 0) < 0.05) return;
            lastSoundTime[type] = t;

            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(600, t); gain.gain.setValueAtTime(0.005, t); osc.start(t); osc.stop(t+0.1); }
            else if(type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, t); gain.gain.setValueAtTime(0.015, t); osc.start(t); osc.stop(t+0.05); }
            else if(type === 'kill') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); gain.gain.setValueAtTime(0.02, t); osc.start(t); osc.stop(t+0.2); }
            else if(type === 'levelup') { osc.type = 'sine'; osc.frequency.setValueAtTime(500, t); gain.gain.setValueAtTime(0.05, t); osc.start(t); osc.stop(t+0.4); }
            else if(type === 'zap') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t); gain.gain.setValueAtTime(0.01, t); osc.start(t); osc.stop(t+0.1); }
            else if(type === 'boss_shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(150, t); gain.gain.setValueAtTime(0.01, t); osc.start(t); osc.stop(t+0.15); }
            else if(type === 'heal') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.linearRampToValueAtTime(1000, t+0.2); gain.gain.setValueAtTime(0.02, t); osc.start(t); osc.stop(t+0.2); }
            else if(type === 'bh_spawn') { osc.type = 'sine'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(10, t+1.0); gain.gain.setValueAtTime(0.05, t); osc.start(t); osc.stop(t+1.0); }
            else if(type === 'pop') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(1200, t+0.1); gain.gain.setValueAtTime(0.015, t); osc.start(t); osc.stop(t+0.1); }
        }

        function recalculateStats() {
            p.base_dmg = 1; for(let i=0; i<(p.lvl_atk||0); i++) p.base_dmg = (p.base_dmg + 2) * 1.02; 
            p.base_dmg *= p.cheat_dmg_mult; 
            
            p.skill_mult = 1; for(let i=0; i<(p.lvl_skill_dmg||0); i++) p.skill_mult *= 1.09; 
            p.skill_mult *= p.cheat_skill_mult; 

            p.fireDelay = 15; for(let i=0; i<(p.lvl_firespeed||0); i++) p.fireDelay = Math.max(4, p.fireDelay - 2);
            p.skillCooldownMax = 600; for(let i=0; i<(p.lvl_skill_cd||0); i++) p.skillCooldownMax = Math.max(60, p.skillCooldownMax - 120);
            p.bulletMultiplier = Math.pow(2, p.lvl_shotgun || 0);
            p.bulletSpread = 1 + (p.lvl_bullet || 0);
            
            p.lightning_chance = (p.lvl_lightning || 0) * 0.1;
            
            p.homing_split = 3 + (p.lvl_homing||0);
            p.shurikenLimit = Math.min(10, 5 + (p.lvl_shuriken||0));
            p.lvl_shuriken_active = (p.lvl_shuriken||0) > 0;
            p.vampire_chance = (p.lvl_vampire||0) * 0.05;
            p.bh_chance = (p.lvl_blackhole > 0) ? Math.min(0.1, 0.01 + (p.lvl_blackhole - 1) * 0.01) : 0; 
            updateUI();
        }

        let isChestOpening = false;
        let currentChestReroll = 1; 
        let chestRarity = 'NORMAL';

        function showOptions(optionCount) {
            playSound('levelup');
            document.getElementById('chest-container').style.display = 'none';
            document.getElementById('ability-container').style.display = 'flex';
            
            const rerollBtn = document.getElementById('reroll-btn');
            rerollBtn.style.display = currentChestReroll > 0 ? 'inline-block' : 'none';
            rerollBtn.onclick = () => {
                if(currentChestReroll > 0) { currentChestReroll--; playSound('shoot'); showOptions(optionCount); }
            };

            let pool = getAvailableAbilities();
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            
            let choices = pool.slice(0, optionCount || 3);
            const cont = document.getElementById('ability-container'); cont.innerHTML = '';
            choices.forEach(ab => {
                let card = document.createElement('div'); card.className = ab.isLegendary ? 'ability-card legendary' : (ab.isRare ? 'ability-card rare' : 'ability-card');
                card.innerHTML = `<div class="ab-name">${ab.name}</div><div class="ab-desc">${ab.desc}</div>`;
                card.onclick = () => { 
                    ab.apply(); p.level++; p.maxExp = Math.floor(p.maxExp * 1.35); p.exp = 0; 
                    document.getElementById('levelup-screen').style.display = 'none'; gameState = 'PLAYING'; updateUI(); 
                };
                cont.appendChild(card);
            });
        }

        function fireSkill(e) {
            if(e) e.preventDefault(); 
            if(p.skillTimer > 0 || gameState !== 'PLAYING') return;
            p.skillTimer = p.skillCooldownMax; playSound('skill');
            
            if(p.activeSkillType === 'boomerang') {
                let sd = 30 * p.skill_mult;
                activeSkills.push({ type: 'boomerang', level: 1, x: p.x, y: p.y - 40, w: 120, vx: p.vx*0.3, vy: -15, state: 'flying_out', baseDmg: sd, dmg: sd, hitLog: [] });
            }
            else if(p.activeSkillType === 'laser') { 
                let sd = 2 * p.skill_mult; 
                let splits = (1 + p.lvl_laser_split * 2) + p.cheat_extra_proj;
                let maxSpreadAngle = Math.min(Math.PI * 0.8, splits * 0.15); 
                for(let i=0; i<splits; i++) {
                    let angleOffset = splits > 1 ? (i - (splits-1)/2) * (maxSpreadAngle / splits) : 0;
                    activeSkills.push({ type: 'laser', angleOffset: angleOffset, x: p.x, y: p.y - 20, life: 90, w: 25, dmg: sd }); 
                }
            }
            else if(p.activeSkillType === 'punch') { 
                let sd = 25 * p.skill_mult;
                let count = (1 + p.lvl_punch_count) + p.cheat_extra_proj;
                for(let i=0; i<count; i++) {
                    let angleCalc = count > 1 ? (i - (count-1)/2) * 0.4 : 0;
                    activeSkills.push({ 
                        type: 'punch', splitLevel: 0, x: p.x, y: p.y - 30, w: 90, 
                        vx: Math.cos(-Math.PI/2 + angleCalc)*18 + p.vx*0.3, 
                        vy: Math.sin(-Math.PI/2 + angleCalc)*18, 
                        state: 'flying', hitTimer: 0, dmg: sd 
                    }); 
                }
            }
            updateUI();
        }

        function gameEnd(win) {
            gameState = 'END'; document.getElementById('ui-layer').style.display = 'none'; document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-title').innerText = win ? "VICTORY!" : "GAME OVER";
            document.getElementById('end-title').style.color = win ? "#00a8ff" : "#ff4757";
            document.getElementById('final-score').innerText = `최종 점수: ${score}\n처치한 보스: ${bossKills}`;
            if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
        }

        function spawnParticles(x, y, color, count, speedMult = 1) {
            if (particles.length > 150) return; 
            for(let i=0; i<count; i++) { particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8 * speedMult, vy: (Math.random() - 0.5) * 8 * speedMult, life: 25, maxLife: 25, size: 3 + Math.random()*3, color: color, isAoE: false }); }
        }

        let lastTime = 0; const frameDelay = 1000/60;
        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if(!lastTime) lastTime = timestamp; let dt = timestamp - lastTime;
            if(dt < frameDelay) return; lastTime = timestamp - (dt % frameDelay);
            if(gameState !== 'PLAYING') return; frameCount++; ctx.clearRect(0,0,canvas.width,canvas.height);

            if (p.lvl_regen > 0 && frameCount % 60 === 0 && p.hp < p.maxHp) { p.hp = Math.min(p.maxHp, p.hp + p.lvl_regen * 0.2); spawnParticles(p.x, p.y, '#2ecc71', 2); updateUI(); }

            ctx.fillStyle = isBossWarning ? '#300000' : 'white';
            stars.forEach(s => { s.y += isBossStage || isBossWarning || isSwarm ? s.v*3 : s.v; if(s.y > canvas.height) { s.y = -10; s.x = Math.random()*canvas.width; } ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1;

            ctx.save();
            if(globalShakeTimer > 0) { ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15); globalShakeTimer--; }
            if(p.skillTimer > 0) { p.skillTimer--; if(p.skillTimer <= 0) { p.skillTimer=0; updateUI(); } else if(p.skillTimer%60===0) updateUI(); }
            if(p.iframe > 0) { p.iframe--; }

            if (!isBossStage && !isBossWarning && !devStopSpawn) {
                bossSpawnTimer--;
                
                if (bossSpawnTimer === 420) { isSwarm = true; swarmWarningTimer = 90; playSound('levelup'); }
                if (bossSpawnTimer === 120) { isSwarm = false; }

                if (bossSpawnTimer <= 0) { 
                    isBossWarning = true; bossWarningTimer = 120; isSwarm = false; 
                } 
                else {
                    if (isSwarm && swarmWarningTimer <= 0 && enemies.length < 300) {
                        let swarmSpawnRate = bossKills === 0 ? 15 : Math.max(2, Math.floor(12 * Math.pow(0.85, bossKills)));
                        if (frameCount % swarmSpawnRate === 0) {
                            let swarmCount = Math.floor(2 * Math.pow(1.15, bossKills));
                            for(let k=0; k<swarmCount; k++) {
                                let spd = 3.0 + Math.random()*2.0 + (bossKills * 0.2);
                                enemies.push({ x: Math.random()*canvas.width, y: -30, w: 25, h: 25, hp: Math.max(1, (1+Math.floor(bossKills/2.5)) * p.diffMult * Math.pow(1 + p.diffExpAdd, bossKills)), speed: spd, isBoss: false, color: '#e67e22' });
                            }
                        }
                    } else if (!isSwarm) {
                        let spawnRate = 45; let hordeCount = 1;
                        if (bossKills === 1) { spawnRate = 35; hordeCount = 2; } 
                        else if (bossKills >= 2) {
                            spawnRate = Math.max(5, Math.floor(30 * Math.pow(0.85, bossKills - 2)));
                            hordeCount = Math.min(25, Math.floor(2 * Math.pow(1.15, bossKills - 2)));
                        }
                        if (frameCount % spawnRate === 0 && enemies.length < 250) { 
                            for(let k=0; k<hordeCount; k++) {
                                let spd = 1.5 + Math.random()*1.5 + (bossKills * 0.15);
                                enemies.push({ x: Math.random()*canvas.width, y: -30 - Math.random()*50, w: 30, h: 30, hp: Math.max(1, (1+Math.floor(bossKills/1.5)) * p.diffMult * Math.pow(1 + p.diffExpAdd, bossKills)), speed: spd, isBoss: false });
                            }
                        }
                    }
                }
            }

            if (swarmWarningTimer > 0 && !devStopSpawn) {
                swarmWarningTimer--;
                ctx.fillStyle = `rgba(230, 126, 34, ${Math.abs(Math.sin(frameCount*0.2))})`; ctx.font = "900 30px Arial"; ctx.textAlign = "center";
                ctx.fillText("적의 대규모 무리 접근 중!", canvas.width/2, canvas.height/4);
            }

            if(isBossWarning) {
                bossWarningTimer--;
                ctx.fillStyle = `rgba(255, 0, 0, ${0.1 + Math.sin(frameCount*0.2)*0.1})`; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = 'red'; ctx.font = "900 60px Arial"; ctx.textAlign = "center"; ctx.globalAlpha = Math.abs(Math.sin(frameCount*0.15));
                ctx.fillText("WARNING", canvas.width/2, canvas.height/2); ctx.globalAlpha = 1;
                let portalAlpha = Math.max(0, (120 - bossWarningTimer) / 120);
                
                ctx.fillStyle = `rgba(150, 0, 0, ${portalAlpha})`;
                ctx.beginPath(); ctx.arc(canvas.width/2, 160, 80 * portalAlpha, 0, Math.PI*2); ctx.fill();

                if(bossWarningTimer <= 0) {
                    isBossWarning = false; isBossStage = true; bossTimer = 30;
                    enemies = []; bossBullets = [];
                    let bh = 150 * p.diffMult * Math.pow(p.cheat_boss_hp + p.diffExpAdd, bossKills);
                    enemies.push({ x: canvas.width/2, y: 160, w: 90, h: 90, hp: bh, maxHp: bh, speed: 0, isBoss: true, iframe: 0 });
                    document.getElementById('boss-timer-display').innerText = `⚠️ 보스 출현! 남은 시간: ${bossTimer}s ⚠️`;
                    document.getElementById('boss-timer-display').style.display = 'block';
                    globalShakeTimer = 40; playSound('kill');
                }
            }

            if (isBossStage && frameCount % 60 === 0 && !devStopSpawn) {
                bossTimer--;
                document.getElementById('boss-timer-display').innerText = `⚠️ 보스 출현! 남은 시간: ${bossTimer}s ⚠️`;
                if (bossTimer <= 0) { gameEnd(false); return; }
            }

            for (let i = blackholes.length - 1; i >= 0; i--) {
                let bh = blackholes[i]; 
                bh.life--; bh.y += bh.vy; 
                
                ctx.save(); ctx.translate(bh.x, bh.y); ctx.rotate(frameCount * 0.1);
                let grad = ctx.createRadialGradient(0,0, bh.r*0.2, 0,0, bh.r);
                grad.addColorStop(0, 'rgba(0,0,0,1)'); grad.addColorStop(0.5, 'rgba(100,0,200,0.5)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(0, 0, bh.r, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(0, 0, bh.r*0.6, bh.r*0.2, frameCount*0.05, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255, 200, 100, 0.8)'; ctx.lineWidth = 4; ctx.stroke();
                ctx.beginPath(); ctx.arc(0, 0, bh.r * 0.3, 0, Math.PI * 2); ctx.fillStyle = 'black'; ctx.fill(); ctx.restore();
                
                let rSq = (bh.r * 2.5) * (bh.r * 2.5);
                enemies.forEach(e => {
                    let dx = bh.x - e.x; let dy = bh.y - e.y; 
                    if (dx*dx + dy*dy < rSq && !e.isBoss) {
                        let dist = Math.hypot(dx, dy) || 1;
                        e.x += (dx / dist) * 7; e.y += (dy / dist) * 7;
                        if (dist < bh.r * 0.5) { e.x += Math.cos(frameCount*0.2)*5; e.y += Math.sin(frameCount*0.2)*5; }
                    }
                });
                if (bh.life <= 0 || bh.y < -300) blackholes.splice(i, 1);
            }

            let c_boom = colorLevels.boomerang[Math.min(5, p.lvl_boom_split||0)];
            let c_laser = colorLevels.laser[Math.min(5, p.lvl_laser_split||0)];
            let c_punch = colorLevels.punch[Math.min(5, p.lvl_punch_count||0)];

            for(let i=activeSkills.length-1; i>=0; i--) {
                let sk = activeSkills[i];
                if(sk.type==='boomerang') {
                    if(sk.state==='flying_out') { 
                        sk.x+=sk.vx; sk.y+=sk.vy; 
                        
                        let hitEnemy = null;
                        for(let j=0; j<enemies.length; j++) {
                            let e = enemies[j];
                            if(!sk.hitLog.includes(e) && Math.abs(e.x-sk.x)<sk.w/2 && Math.abs(e.y-sk.y)<sk.w/2) {
                                e.hp -= sk.dmg; sk.hitLog.push(e);
                                if(e.isBoss && !e.isDevTest) e.iframe = 2;
                                playSound('hit');
                                hitEnemy = e; break; 
                            }
                        }
                        
                        if (hitEnemy && sk.level === 1 && p.lvl_boom_split > 0) {
                            let splits = 5; 
                            for(let j=0; j<splits; j++) {
                                let angle = (Math.PI * 2 / splits) * j;
                                activeSkills.push({
                                    type: 'boomerang', level: 2, 
                                    x: hitEnemy.x, y: hitEnemy.y,
                                    originX: hitEnemy.x, originY: hitEnemy.y,
                                    w: sk.w * 0.6,
                                    vx: Math.cos(angle) * 15, vy: Math.sin(angle) * 15,
                                    state: 'sub_flying_out', timer: 20,
                                    baseDmg: sk.baseDmg * 0.5, dmg: sk.baseDmg * 0.5, hitLog: []
                                });
                            }
                            activeSkills.splice(i, 1); continue;
                        } else if (sk.x < -100 || sk.x > canvas.width+100 || sk.y < -100 || sk.y > canvas.height+100) {
                            activeSkills.splice(i, 1); continue;
                        }
                    }
                    else if (sk.state === 'sub_flying_out') {
                        sk.x += sk.vx; sk.y += sk.vy;
                        sk.timer--;
                        if (sk.timer <= 0) {
                            sk.state = 'sub_returning'; sk.timer = 40; 
                            sk.hitLog = []; sk.dmg = sk.baseDmg * 2.5; 
                        }
                    }
                    else if (sk.state === 'sub_returning') {
                        let dx = sk.originX - sk.x; let dy = sk.originY - sk.y;
                        let dist = Math.hypot(dx, dy);
                        sk.x += (dx / (dist || 1)) * 18; sk.y += (dy / (dist || 1)) * 18;
                        sk.timer--;
                        if (dist < 20 || sk.timer <= 0) { activeSkills.splice(i, 1); continue; }
                    }

                    ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(frameCount*0.4); ctx.fillStyle=c_boom; ctx.fillRect(-sk.w/2, -8, sk.w, 16); ctx.fillRect(-8, -sk.w/2, 16, sk.w); ctx.restore();
                    
                    if (sk.state !== 'flying_out') { 
                        let hitAny = false;
                        enemies.forEach(e => {
                            if(!sk.hitLog.includes(e) && Math.abs(e.x-sk.x)<sk.w/2 && Math.abs(e.y-sk.y)<sk.w/2) {
                                e.hp -= sk.dmg; hitAny = true; sk.hitLog.push(e);
                                if(e.isBoss && !e.isDevTest) e.iframe = 2;
                            }
                        });
                        if (hitAny) playSound('hit');
                    }

                } else if(sk.type==='laser') {
                    sk.life--; sk.x = p.x; sk.y = p.y - 20;
                    ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(sk.angleOffset); 
                    ctx.globalAlpha=0.7; ctx.fillStyle=c_laser; 
                    ctx.fillRect(-sk.w/2, -canvas.height*1.5, sk.w, canvas.height*1.5); 
                    ctx.globalAlpha=1; ctx.restore();

                    let dirX = Math.sin(sk.angleOffset); let dirY = -Math.cos(sk.angleOffset);
                    enemies.forEach(e => { 
                        let dx = e.x - sk.x; let dy = e.y - sk.y;
                        let dot = dx * dirX + dy * dirY;
                        if (dot > 0) {
                            let px = dirX * dot; let py = dirY * dot;
                            let distSq = (dx - px)*(dx - px) + (dy - py)*(dy - py);
                            if (distSq < (sk.w/2 + e.w/2)*(sk.w/2 + e.w/2)) { e.hp -= sk.dmg; }
                        }
                    });
                    if(sk.life<=0) activeSkills.splice(i, 1);

                } else if(sk.type==='punch') {
                    if(sk.state==='flying') { 
                        sk.x+=sk.vx; sk.y+=sk.vy; 
                        if(Math.abs(sk.vx)>0) sk.angle=Math.atan2(sk.vy, sk.vx)+Math.PI/2; else sk.angle=0; 
                        
                        let hitEnemy = null;
                        for(let j=0; j<enemies.length; j++) {
                            let e = enemies[j];
                            if(Math.abs(e.x-sk.x)<sk.w/2 && Math.abs(e.y-sk.y)<sk.w/2) {
                                hitEnemy = e; break;
                            }
                        }
                        
                        if(sk.y<-100 || sk.x<-100 || sk.x>canvas.width+100 || sk.y>canvas.height+100) sk.state='done'; 
                        
                        if (hitEnemy) {
                            sk.state = 'combo';
                            sk.targetX = hitEnemy.x;
                            sk.targetY = hitEnemy.y;
                            sk.comboStep = 0;
                            sk.timer = 0; 
                        } else if(sk.state === 'flying') { 
                            ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(sk.angle || 0); 
                            ctx.drawImage(getSprite('paw', c_punch, sk.w * 0.8), -sk.w*0.8, -sk.w*0.8);
                            ctx.restore(); 
                        }
                    }
                    else if (sk.state==='combo') { 
                        sk.timer--; 
                        if(sk.timer <= 0){
                            sk.comboStep++;
                            if (sk.comboStep <= 4) {
                                playSound('pop');
                                let offsetX = (sk.comboStep % 2 === 1) ? -25 : 25;
                                let offsetY = (sk.comboStep <= 2) ? -15 : 15;
                                let aoe = sk.w * 1.2;
                                
                                particles.push({
                                    x: sk.targetX + offsetX, y: sk.targetY + offsetY, vx:0, vy:0, 
                                    life: 15, maxLife: 15, size: sk.w * 0.5, color: c_punch,

            let c_shuri = colorLevels.shuriken[Math.min(5, p.lvl_shuriken||0)];
            if(p.lvl_shuriken_active) {
                if(frameCount % 60 === 0 && shurikens.filter(s=>s.state==='orbit').length < p.shurikenLimit) {

            let targetX = Math.max(20, Math.min(canvas.width-20, window.mouseX_val));

            let c_homing = colorLevels.homing[Math.min(5, p.lvl_homing||0)];

                    let bColor = isBhSeed ? '#111' : (isLightningSeed ? `rgb(${c_light})` : (isEnhanced ? c_homing : c_atk));

                    bullets.push({

                    });

            }

            for(let i=bullets.length-1; i>=0; i--) {

                if(b.isBhSeed) {

                    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.5, 0, Math.PI*2); ctx.fill();

                } else {

                        ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.moveTo(b.r*3.5, 0); ctx.lineTo(-b.r*1.5, b.r*1.5); ctx.lineTo(-b.r*1.5, -b.r*1.5); ctx.fill();
                        ctx.globalAlpha = 1; ctx.beginPath(); ctx.moveTo(b.r * 2.5, 0); ctx.lineTo(-b.r, b.r * 0.8); ctx.lineTo(-b.r, -b.r * 0.8); ctx.closePath(); ctx.fill(); ctx.restore();

                            blackholes.push({x: b.x, y: b.y, r: bh_radius, life: bh_life, maxLife: bh_life, dmg: 0, vy: -1.5});

                        e.hp -= b.dmg; b.hitLog.push(e); playSound('hit');
                        
                        if (b.enhanced && homingBullets.length < 150) {

                            let homingDmg = p.base_dmg * (0.8 + p.lvl_homing * 0.5);
                            for(let k=0; k<p.homing_split; k++) {

                                homingBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle)*6, vy: Math.sin(angle)*6, dmg: homingDmg, target: null, life: 120, pierce: 2, ignore: e, hitLog: [] });

                        if (b.isLightningSeed && !b.lightningTriggered && lightnings.length < 50) {

                            let dSq = (enemies[j].x - hb.x)*(enemies[j].x - hb.x) + (enemies[j].y - hb.y)*(enemies[j].y - hb.y); 
                            if (dSq < closestDistSq) { closestDistSq = dSq; closestE = enemies[j]; }

                    ctx.restore(); 
                }
                ctx.fillStyle = c_storm; ctx.globalAlpha = 0.15; ctx.beginPath(); ctx.arc(0, 0, sk_r, 0, Math.PI * 2); ctx.fill(); 
                ctx.restore();
                
                if (frameCount % 15 === 0) {
                    let stormDmg = 8 * p.skill_mult * (1 + p.lvl_storm * 0.5);
                    enemies.forEach(e => {
                        if (Math.hypot(e.x - p.x, e.y - p.y) < sk_r + e.w/2) {
                            e.hp -= stormDmg; e.y -= 15; e.x += (e.x > p.x ? 10 : -10); 
                            if(e.isBoss && !e.isDevTest) e.iframe = 4;
                            spawnParticles(e.x, e.y, c_storm, 2);
                        }
                    });
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; 
                
                if(e.isBoss) {
                    if (!e.isDevTest && frameCount % Math.max(30, 90 - bossKills * 3) === 0) {
                        playSound('boss_shoot');
                        let dx = p.x - e.x; let dy = p.y - e.y; let angle = Math.atan2(dy, dx);
                        let bulletCount = 3 + Math.floor(bossKills/3); 
                        let spread = 0.2 + Math.min(0.3, bossKills*0.02);
                        for(let a = 0; a < bulletCount; a++) {
                            let currentAngle = angle - spread*(bulletCount-1)/2 + a*spread; 
                            let speed = 5 + bossKills * 0.2; 
                            bossBullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(currentAngle) * speed, vy: Math.sin(currentAngle) * speed, r: 7, color: '#ff4757', dmg: 10 + bossKills * 2 });
                        }
                    }
                } else { e.y += e.speed; }

                if(e.isBoss && e.iframe > 0) e.iframe--;
                
                let drawn = false;
                if(customEnemyImg && customEnemyImg.complete && !e.isBoss) { ctx.drawImage(customEnemyImg, e.x-e.w/2, e.y-e.h/2, e.w, e.h); drawn=true; }
                
                if(!drawn) {
                    if (e.isBoss) {
                        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(frameCount*0.05); ctx.fillStyle = '#8e44ad'; ctx.shadowColor = '#d980fa'; ctx.shadowBlur = 20;
                        ctx.beginPath(); ctx.roundRect(-e.w/2, -e.h/2, e.w, e.h, 15); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0,0, e.w/4, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(0,0, e.w/4 * (0.5 + Math.sin(frameCount*0.1)*0.5), 0, Math.PI*2); ctx.fill(); ctx.restore();
                        
                        if (e.isDevTest) {
                            ctx.fillStyle = '#ff4757'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center';
                            ctx.fillText(`체력: ${Math.ceil(Math.max(0, e.hp))} / ${e.maxHp}`, e.x, e.y + e.h/2 + 35);
                        }
                    } else {
                        let spr = getSprite('enemy', e.color || '#ff4757', e.w);
                        ctx.drawImage(spr, e.x - e.w/2, e.y - e.h/2);
                        
                        ctx.fillStyle = "white"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; 
                        ctx.fillText(Math.ceil(e.hp), e.x, e.y + 4);
                    }
                }

                if(e.isBoss) { ctx.fillStyle='#333'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w, 8); ctx.fillStyle='#ff4757'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w*Math.max(0, e.hp/e.maxHp), 8); }
                
                if(e.hp<=0) { 
                    playSound('kill'); score+=e.isBoss?1000:10; 
                    if (p.lvl_vampire > 0 && Math.random() < p.vampire_chance && p.hp < p.maxHp) { p.hp = Math.min(p.maxHp, p.hp + 1 + p.lvl_vampire); spawnParticles(p.x, p.y, '#2ecc71', 2); playSound('heal'); updateUI(); }
                    
                    spawnParticles(e.x,e.y,e.isBoss?'#8e44ad':(e.color || '#ff4757'), e.isBoss?40:10); 

                    if(e.isBoss && !e.isDevTest){
                        bossKills++; isBossStage=false; document.getElementById('boss-timer-display').style.display='none'; 
                        bossSpawnTimer = BOSS_SPAWN_INTERVAL;
                        if(bossKills>=WIN_CONDITION) {gameEnd(true); return;} else {p.exp+=p.maxExp; updateUI();}
                    } else if(!e.isDevTest) { 
                        // ⚖️ 하드코어 난이도 몹 EXP 버프 (하드 2.5배, 노말 1.5배)
                        p.exp += (2 + Math.floor(bossKills / 2)) * p.diffExpMult; 
                    }
                    enemies.splice(i,1); if(p.exp>=p.maxExp) triggerLevelUp(); updateUI(); 
                }
                else if(e.y > canvas.height+50) { p.hp-=e.isBoss?50:5; enemies.splice(i,1); updateUI(); if(p.hp<=0) {gameEnd(false); return;} }
            }

            for (let i = bossBullets.length - 1; i >= 0; i--) {
                let bb = bossBullets[i]; bb.x += bb.vx; bb.y += bb.vy;
                
                ctx.fillStyle = 'rgba(255, 71, 87, 0.4)'; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r + 4, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = bb.color; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r/2, 0, Math.PI*2); ctx.fill(); 

                if (p.iframe <= 0 && Math.abs(bb.x - p.x) < p.w/2 && Math.abs(bb.y - p.y) < p.h/2) {
                    p.hp -= bb.dmg; p.iframe = 30; spawnParticles(p.x, p.y, '#ff0000', 15, 2); globalShakeTimer = 10; playSound('hit'); updateUI(); bossBullets.splice(i, 1);
                    if (p.hp <= 0) { gameEnd(false); return; } continue;
                }
                if(bb.y > canvas.height + 50 || bb.x < -50 || bb.x > canvas.width + 50) bossBullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i]; pt.life--; pt.x += pt.vx; pt.y += pt.vy; 
                
                if (pt.type === 'paw_mark') {
                    ctx.save(); ctx.translate(pt.x, pt.y); ctx.rotate(pt.angle || 0);
                    let alpha = Math.min(1, pt.life / 10); 
                    ctx.globalAlpha = alpha;
                    let popScale = Math.min(1, (pt.maxLife - pt.life) / 3); 
                    let scale = pt.isMega ? 2.5 : 1;
                    let finalScale = popScale * scale;
                    ctx.scale(finalScale, finalScale);
                    ctx.drawImage(getSprite('paw', pt.color, pt.size), -pt.size, -pt.size);
                    ctx.restore();
                }
                else {
                    let lifeRatio = Math.max(0, pt.life / (pt.maxLife || 25)); ctx.globalAlpha = lifeRatio;
                    if (pt.isAoE) { ctx.strokeStyle = pt.color; ctx.lineWidth = 3; ctx.beginPath(); let r = Math.max(0.1, pt.size * (1 - lifeRatio)); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.stroke(); } 
                    else { ctx.fillStyle = pt.color; let r = Math.max(0.1, pt.size * lifeRatio); ctx.fillRect(pt.x - r, pt.y - r, r*2, r*2); }
                }
                
                ctx.globalAlpha = 1; if (pt.life <= 0) particles.splice(i, 1);
            }

            if (!(p.iframe > 0 && Math.floor(frameCount / 5) % 2 === 0)) {
                let dp = false;
                if(customPlayerImg && customPlayerImg.complete) { ctx.drawImage(customPlayerImg, p.x - p.w/2, p.y - p.h/2, p.w, p.h); dp=true; }
                if(!dp) {
                    ctx.save(); let grad = ctx.createLinearGradient(p.x, p.y-p.h/2, p.x, p.y+p.h/2); grad.addColorStop(0, '#00a8ff'); grad.addColorStop(1, '#111'); ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h, 6); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h*0.2, [6, 6, 0, 0]); ctx.fill(); ctx.restore();
                }
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
