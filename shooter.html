<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그라이트 화력 슈팅 (V7 관성 & BGM & 체인 라이트닝)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Apple SD Gothic Neo', sans-serif; user-select: none; }
        body { background-color: #0f0f1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100vh; background: #0b0b1a; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-left: 2px solid #2f3640; border-right: 2px solid #2f3640; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; pointer-events: none; z-index: 10; }
        
        .bar-bg { width: 100%; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-bottom: 8px; border: 2px solid #2f3640; overflow: hidden; position: relative; }
        #hp-bar { height: 100%; background: #ff4757; width: 100%; transition: width 0.2s; }
        #exp-bar { height: 100%; background: #1e90ff; width: 0%; transition: width 0.2s; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 14px; font-weight: bold; color: white; line-height: 16px; text-shadow: 1px 1px 2px black; }

        .top-stats { display: flex; flex-direction: column; gap: 5px; color: white; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px black; margin-top: 5px; pointer-events: auto; max-width: 70%; }

        #boss-timer-display { display: none; color: #ff4757; font-size: 22px; font-weight: 900; text-align: center; margin-top: 25px; text-shadow: 0 0 15px #ff4757; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        #sound-btn { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.8); border: 2px solid #57606f; border-radius: 50%; width: 50px; height: 50px; font-size: 22px; cursor: pointer; color: white; pointer-events: auto; display: flex; justify-content: center; align-items: center; z-index: 999; box-shadow: 0 0 15px rgba(0,0,0,0.5); }

        #skill-btn { position: fixed; bottom: 20px; right: 20px; width: 85px; height: 85px; border-radius: 50%; background: rgba(0, 210, 211, 0.85); color: white; font-size: 18px; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0, 210, 211, 0.6); pointer-events: auto; border: 4px solid #fff; z-index: 999; cursor: pointer; transition: 0.1s; }
        #skill-btn:active { transform: scale(0.9); }
        #skill-btn.cooldown { background: rgba(100, 100, 100, 0.7); box-shadow: none; border-color: #888; color: #ccc; pointer-events: none; }
        #skill-btn .cool-text { font-size: 32px; font-weight: 900; color: white; }

        @media (min-width: 700px) {
            #sound-btn { top: 40px; right: auto; left: calc(50% - 240px - 80px); }
            #skill-btn { bottom: 60px; right: calc(50% - 240px - 110px); width: 100px; height: 100px; font-size: 20px;}
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 26, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        .title-text { font-size: 40px; font-weight: 900; color: #00a8ff; text-shadow: 0 0 20px rgba(0, 168, 255, 0.5); margin-bottom: 20px; text-align: center; }
        .start-btn { padding: 15px 40px; background: #00a8ff; color: white; border: none; border-radius: 30px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: transform 0.1s; pointer-events: auto; margin-top: 10px; }
        .start-btn:active { transform: scale(0.95); }

        .skin-btn-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .skin-btn { padding: 10px 15px; background: #2f3542; color: white; border: 1px solid #57606f; border-radius: 10px; font-size: 13px; cursor: pointer; pointer-events: auto; }
        
        #levelup-screen { display: none; pointer-events: auto; }
        #lvl-title-text { font-size: 32px; color: #f1c40f; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 15px #f1c40f; text-align: center; }
        
        .ability-card { background: #2f3542; width: 90%; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 2px solid #57606f; cursor: pointer; transition: all 0.2s; color: white; text-align: left; position: relative;}
        .ability-card.rare { border-color: #e1b12c; background: #3a2b10; }
        .ability-card.legendary { border-color: #00ffff; background: #002233; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .ability-card:hover { transform: translateX(5px); background: #3a4151; }
        .ab-name { font-size: 18px; font-weight: bold; color: #f1c40f; margin-bottom: 5px; }
        .legendary .ab-name { color: #00ffff; text-shadow: 0 0 5px #00ffff; }

        .chest-box { font-size: 80px; cursor: pointer; transition: 0.2s; user-select: none; margin-top: 20px; display: inline-block; }
        .chest-box.anim-shake { animation: shake-normal 0.6s ease-in-out forwards; }
        .chest-box.anim-shake-rare { animation: shake-rare 1.4s ease-in-out forwards; }
        
        @keyframes shake-normal { 0%, 100% { transform: rotate(0deg); } 20%, 60% { transform: rotate(-15deg); } 40%, 80% { transform: rotate(15deg); } 100% { opacity: 0; } }
        @keyframes shake-rare { 0%, 100% { transform: rotate(0deg); } 10%, 30%, 50%, 70%, 90% { transform: rotate(-25deg) scale(1.4); } 20%, 40%, 60%, 80% { transform: rotate(25deg) scale(1.4); } 100% { opacity: 0; scale: 2.5; } }

        #dev-panel { display: none; position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(0, 0, 0, 0.95); border: 2px solid #ff4757; border-radius: 15px; padding: 20px; color: white; z-index: 1000; overflow-y: auto; pointer-events: auto; box-shadow: 0 0 30px rgba(255, 71, 87, 0.5); }
        .dev-btn { background: #2f3542; color: white; border: 1px solid #747d8c; padding: 12px; margin: 4px; border-radius: 8px; cursor: pointer; flex: 1 1 45%; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <button id="sound-btn" onclick="toggleSound()">🔊</button>
    <div id="skill-btn" onpointerdown="fireSkill()">
        <div id="skill-name">스킬(A)</div>
        <div id="skill-cool" class="cool-text"></div>
    </div>

    <div id="game-container">
        <div id="ui-layer" style="display: none;">
            <div class="bar-bg"><div id="hp-bar"></div><div class="bar-text" id="hp-text">HP: 100 / 100</div></div>
            <div class="bar-bg"><div id="exp-bar"></div><div class="bar-text" id="exp-text">LV.1 (0/30)</div></div>
            <div class="top-stats">
                <div id="score-display" onclick="checkDevMode()" style="cursor: pointer;">SCORE: 0</div>
                <div id="boss-kill-display">처치한 보스: 0 / 20</div>
            </div>
            <div id="boss-timer-display">⚠️ 보스 출현! 남은 시간: 20s ⚠️</div>
        </div>

        <div class="overlay" id="start-screen">
            <div class="title-text">SURVIVOR<br>SHOOTER</div>
            <p style="color: #ced6e0; margin-bottom: 20px; text-align: center;">20마리의 보스를 처치하여 행성을 구하세요!</p>
            
            <div class="skin-btn-group">
                <button class="skin-btn" onclick="document.getElementById('p-img-upload').click()">🧑 내 캐릭터</button>
                <button class="skin-btn" onclick="document.getElementById('e-img-upload').click()">👾 적 캐릭터</button>
            </div>
            <input type="file" id="p-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'player')">
            <input type="file" id="e-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'enemy')">

            <button class="start-btn" onclick="startGame()">게임 시작</button>
        </div>

        <div class="overlay" id="levelup-screen">
            <div id="lvl-title-text">보물상자 발견!</div>
            <div id="chest-container" style="display:flex; flex-direction:column; align-items:center;">
                <div id="chest-emoji" class="chest-box" onpointerdown="openChest()">🎁</div>
                <p id="chest-desc" style="color:#ced6e0; margin-top:25px; font-weight:bold;">터치해서 열기!</p>
            </div>
            <div id="ability-container" style="width: 100%; display: none; flex-direction: column; align-items: center; overflow-y: auto; max-height: 70vh;"></div>
        </div>

        <div class="overlay" id="gameover-screen" style="display: none;">
            <div id="end-title" class="title-text" style="color: #ff4757;">GAME OVER</div>
            <p id="final-score" style="color: white; font-size: 22px; margin-bottom: 30px; text-align: center; line-height: 1.5;"></p>
            <button class="start-btn" onclick="location.reload()">처음으로</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 개발자 패널 -->
    <div id="dev-panel">
        <h3>🛠️ 스킬 밸런스 테스트 룸</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="dev-btn" id="dev-spawn-btn" onclick="toggleSpawn()" style="background: #2ed573;">🟢 몹 소환 켜짐</button>
            <button class="dev-btn" onclick="clearAllEnemies()" style="background: #ff4757;">💣 몹 싹쓸이</button>
        </div>
        <button class="dev-btn" style="width:100%; background:#57606f;" onclick="closeDevMode()">창 닫기</button>
        <div id="dev-skills" style="display: flex; flex-wrap: wrap; gap: 5px; margin-top:15px;"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        function resize() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
        window.addEventListener('resize', resize); resize();

        let gameState = 'START';
        let frameCount = 0; let score = 0; let bossKills = 0;
        const WIN_CONDITION = 20;
        let isBossStage = false; let bossTimer = 20; const BOSS_SPAWN_INTERVAL = 1800; 
        let globalShakeTimer = 0; 

        // 🚀 스피드감을 위한 우주 배경 별 입자
        let backgroundStars = [];
        for(let i=0; i<100; i++) {
            backgroundStars.push({
                x: Math.random() * 1000, 
                y: Math.random() * 1000, 
                size: Math.random() * 2, 
                speed: 1 + Math.random() * 3
            });
        }

        let p = {}; let bullets = []; let enemies = []; let particles = []; let activeSkills = []; 
        let shurikens = []; let orbitals = []; let lightnings = []; // ⚡ 번개 이펙트 배열 추가

        // 이미지 로드
        let customPlayerImg = new Image(); customPlayerImg.src = "player.png"; customPlayerImg.onerror = () => { customPlayerImg = null; };
        let customEnemyImg = new Image(); customEnemyImg.src = "enemy.png"; customEnemyImg.onerror = () => { customEnemyImg = null; };
        
        function handleImage(event, type) {
            const file = event.target.files[0]; if (!file) return;
            const img = new Image(); img.src = URL.createObjectURL(file);
            img.onload = () => { 
                if (type === 'player') { customPlayerImg = img; alert("내 캐릭터가 적용되었습니다!"); }
                else { customEnemyImg = img; alert("적 캐릭터가 적용되었습니다!"); }
            };
        }

        // 🎵 사운드 및 BGM 설정 (볼륨 대폭 감소 및 BGM 루프)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx; let isSoundOn = true; let bgmInterval; let bgmStep = 0;

        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            startBGM();
        }

        function toggleSound() { 
            isSoundOn = !isSoundOn; 
            document.getElementById('sound-btn').innerText = isSoundOn ? '🔊' : '🔇'; 
            if(!isSoundOn && bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            else if(isSoundOn) startBGM();
        }

        // 🎵 긴박한 8비트 베이스라인 BGM
        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            let bgmNotes = [130.81, 130.81, 155.56, 174.61, 130.81, 196.00, 155.56, 130.81]; // 긴장감 있는 베이스라인
            bgmInterval = setInterval(() => {
                if (!isSoundOn || !audioCtx || gameState !== 'PLAYING') return;
                const t = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth'; // 거친 베이스 소리
                // 보스전에는 피치가 높아지고 속도가 빠르게 느껴짐
                osc.frequency.setValueAtTime(bgmNotes[bgmStep % bgmNotes.length] * (isBossStage ? 1.5 : 1), t);
                gain.gain.setValueAtTime(0.015, t); // 배경음이라 작게
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
                bgmStep++;
            }, 200); // 아주 빠른 템포
        }

        function playSound(type) {
            if (!isSoundOn || !audioCtx) return; const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            // 🎵 타격음 및 효과음 볼륨을 기존 대비 절반 수준으로 대폭 낮춤
            if (type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(600, t); gain.gain.setValueAtTime(0.004, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1); osc.start(t); osc.stop(t + 0.1); } 
            else if (type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, t); gain.gain.setValueAtTime(0.015, t); osc.start(t); osc.stop(t + 0.05); } 
            else if (type === 'kill') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); gain.gain.setValueAtTime(0.02, t); osc.start(t); osc.stop(t + 0.2); } 
            else if (type === 'skill') { osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(800, t + 0.3); gain.gain.setValueAtTime(0.025, t); osc.start(t); osc.stop(t + 0.3); } 
            else if (type === 'levelup') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t + 0.1); osc.frequency.setValueAtTime(800, t + 0.2); gain.gain.setValueAtTime(0.05, t); osc.start(t); osc.stop(t + 0.4); }
            else if (type === 'zap') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(1200, t + 0.1); gain.gain.setValueAtTime(0.015, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1); osc.start(t); osc.stop(t + 0.1); } // ⚡ 번개 소리
        }

        // 파티클 생성 헬퍼
        function spawnParticles(x, y, color, count, speedMult = 1) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y, vx: (Math.random() - 0.5) * 8 * speedMult, vy: (Math.random() - 0.5) * 8 * speedMult,
                    life: 25, maxLife: 25, size: 3 + Math.random()*3, color: color, isAoE: false
                });
            }
        }

        // 개발자 모드
        let keyBuffer = ""; let scoreTapCount = 0; let devStopSpawn = false;
        window.addEventListener('keydown', (e) => { 
            if ((e.key === 'a' || e.key === 'A') && gameState === 'PLAYING') fireSkill(); 
            keyBuffer += e.key; if (keyBuffer.length > 4) keyBuffer = keyBuffer.slice(-4); 
            if (keyBuffer === "1563") { openDevMode(); keyBuffer = ""; }
        });
        function checkDevMode() { scoreTapCount++; if (scoreTapCount >= 5) { scoreTapCount = 0; let pw = prompt("개발자 비밀번호 (1563) :"); if (pw === "1563") openDevMode(); } }
        function openDevMode() { document.getElementById('dev-panel').style.display = 'block'; renderDevSkills(); }
        function closeDevMode() { document.getElementById('dev-panel').style.display = 'none'; }
        function toggleSpawn() { devStopSpawn = !devStopSpawn; let btn = document.getElementById('dev-spawn-btn'); btn.innerText = devStopSpawn ? "🔴 몹 소환 정지" : "🟢 몹 소환 켜짐"; btn.style.background = devStopSpawn ? "#747d8c" : "#2ed573"; }
        function clearAllEnemies() { enemies.forEach(e => spawnParticles(e.x, e.y, '#ff4757', 10)); enemies = []; isBossStage = false; document.getElementById('boss-timer-display').style.display = 'none'; }

        function renderDevSkills() {
            const container = document.getElementById('dev-skills'); container.innerHTML = '';
            getAvailableAbilities().forEach(ab => { 
                let btn = document.createElement('button'); btn.className = 'dev-btn'; btn.innerHTML = ab.name; 
                btn.onclick = () => { ab.apply(); updateUI(); renderDevSkills(); }; 
                container.appendChild(btn); 
            });
        }

        // 입력 처리
        window.mouseX_val = canvas.width / 2;
        container.addEventListener('mousemove', e => { const rect = canvas.getBoundingClientRect(); window.mouseX_val = e.clientX - rect.left; });
        container.addEventListener('touchmove', e => { const rect = canvas.getBoundingClientRect(); window.mouseX_val = e.touches[0].clientX - rect.left; e.preventDefault(); }, {passive: false});

        // 🌟 스킬 및 빌드 (체인 라이트닝 추가)
        function getAvailableAbilities() {
            let pool = [
                { name: '⚔️ 공격력 UP', apply: () => { p.lvl_atk++; p.dmg += 1; } },
                { name: '🤖 캐릭터 추가', apply: () => { p.lvl_char++; p.charCount++; } },
                { name: '💥 탄환 확산', apply: () => { p.lvl_bullet++; p.bulletSpread++; } },
                { name: '❤️ 최대 체력 UP', apply: () => { p.lvl_maxhp++; p.maxHp += 50; p.hp += 50; } },
                { name: '🩹 체력 회복', apply: () => { p.lvl_heal++; p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.4); } },
                { name: '🪄 스킬 파괴력 UP', apply: () => { p.lvl_skill_dmg++; } },
                { name: '⏳ 스킬 쿨타임 감소', apply: () => { p.lvl_skill_cool++; p.skillCooldownMax = Math.max(60, 600 - p.lvl_skill_cool * 120); } }
            ];

            // ⚡ [레어] 체인 라이트닝 (신규 빌드)
            if (Math.random() < 0.25) {
                if (p.lvl_lightning === 0) pool.push({ isRare: true, name: '⚡ [레어] 연쇄 번개', apply: () => { p.lvl_lightning++; } });
                else pool.push({ isRare: true, name: '⚡ 번개 전이 수 및 데미지 UP', apply: () => { p.lvl_lightning++; } });
            }

            // 🌌 1.5% 극한의 초희귀 스킬 (등장확률 대폭 하향)
            if (Math.random() < 0.015) {
                if (p.lvl_orbital === 0) pool.push({ isLegendary: true, name: '🌌 [전설] 위성 폭격', apply: () => { p.lvl_orbital++; p.orbitalTimer = 0; } });
                else {
                    pool.push({ isLegendary: true, name: '🌌 위성 폭격 쿨타임 감소', apply: () => { p.lvl_orbital++; } });
                    pool.push({ isLegendary: true, name: '🌌 위성 폭격 파괴반경 증가', apply: () => { p.lvl_orbital_range++; } });
                }
            }

            if (Math.random() < 0.3) {
                pool.push({ isRare: true, name: '🌟 [레어] 수호 표창', apply: () => { p.lvl_shuriken_active = true; p.shurikenLimit = Math.min(10, p.shurikenLimit + 1); } });
            }

            if (p.activeSkillType === 'boomerang') {
                if (p.lvl_boom_split < 2) pool.push({ name: '🎇 부메랑 분열', apply: () => { p.lvl_boom_split++; } });
                pool.push({ name: '🟢 부메랑 크기 UP', apply: () => { p.lvl_boom_size++; } });
                // 레이저 등장 확률 15%로 너프
                if (Math.random() < 0.15) pool.push({ name: '🔄 스킬 교체: 레이저', apply: () => { p.activeSkillType = 'laser'; p.skillCooldownMax = 600; p.skillTimer = 0; } });
                pool.push({ name: '🔄 스킬 교체: 냥냥펀치', apply: () => { p.activeSkillType = 'punch'; p.skillCooldownMax = 600; p.skillTimer = 0; } });
            }
            if (p.activeSkillType === 'laser') { pool.push({ name: '🔱 레이저 갈래 UP', apply: () => { p.lvl_laser_split++; } }); }
            if (p.activeSkillType === 'punch') { 
                pool.push({ name: '🐾 냥냥펀치 개수 UP', apply: () => { p.lvl_punch_count++; } }); 
                pool.push({ name: '💥 냥냥펀치 분열 UP', apply: () => { p.lvl_punch_split++; } }); 
            }
            return pool;
        }

        function startGame() {
            initAudio();
            p = { 
                x: canvas.width / 2, y: canvas.height - 100, vx: 0, // 🚀 관성 변수 추가
                w: 60, h: 60, hp: 100, maxHp: 100, level: 1, exp: 0, maxExp: 30,

        function fireSkill() {

        // 🌟 60 FPS 고정 및 메인 루프 🌟
        let lastTime = 0;
        const frameDelay = 1000 / 60; 

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if (!lastTime) lastTime = timestamp;
            let deltaTime = timestamp - lastTime;
            if (deltaTime < frameDelay) return;
            lastTime = timestamp - (deltaTime % frameDelay);

            if (gameState !== 'PLAYING') return;
            frameCount++; 
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 🚀 우주 배경 스크롤 렌더링 (긴장감 조성)

            backgroundStars.forEach(star => {

                if(star.y > canvas.height) { star.y = -10; star.x = Math.random() * canvas.width; }
                ctx.globalAlpha = isBossStage ? 0.8 : 0.4;

                ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            ctx.save();
            if (globalShakeTimer > 0) {
                ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15);
                globalShakeTimer--;
            }
            
            if (p.skillTimer > 0) { p.skillTimer--; if (p.skillTimer <= 0) { p.skillTimer = 0; updateSkillUI(); } else if (p.skillTimer % 60 === 0) updateSkillUI(); }

            // 🌌 [초희귀] 위성 폭격 
            if (p.lvl_orbital > 0) {

                if (p.orbitalTimer <= 0) {
                    p.orbitalTimer = Math.max(120, 360 - p.lvl_orbital * 30);
                    let target = enemies.find(e => e.isBoss) || enemies[Math.floor(Math.random() * enemies.length)];
                    if (target) orbitals.push({ x: target.x, y: target.y, timer: 90, state: 'aim', radius: 60 + p.lvl_orbital_range * 20 });
                }
            }

            for(let i=orbitals.length-1; i>=0; i--) {

                if (o.state === 'aim') {
                    o.timer--;

            // 🚀 총알 발사 시 관성(vx)의 15%를 넘겨줌!

                        // 🚀 돌진형 적군 추가 (긴박함 극대화)

            // 🌟 냥냥펀치 및 액티브 스킬

                if (sk.type === 'boomerang') { 
                    if (sk.state === 'flying') { sk.x += sk.vx; sk.y += sk.vy; if (sk.y < -sk.w || sk.x < -sk.w || sk.x > canvas.width + sk.w) { activeSkills.splice(i, 1); continue; } } 
                    else { sk.hoverTimer--; if (sk.hoverTimer <= 0) { if (sk.level <= p.lvl_boom_split && sk.level < 3) for(let j=0; j<5; j++) activeSkills.push({ type: 'boomerang', level: sk.level+1, x: sk.x, y: sk.y, w: sk.w*0.6, vx: Math.cos((Math.PI*2/5)*j)*12, vy: Math.sin((Math.PI*2/5)*j)*12, state: 'flying', hoverTimer: 0, dmg: sk.dmg }); activeSkills.splice(i, 1); continue; } } 
                    ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(frameCount*0.4); ctx.fillStyle = sk.level === 1 ? '#00d2d3' : '#48dbfb'; ctx.fillRect(-sk.w/2, -8, sk.w, 16); ctx.fillRect(-8, -sk.w/2, 16, sk.w); ctx.restore();

                    let e = enemies[j];
                    if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2) { 
                        e.hp -= b.dmg; bullets.splice(i, 1); playSound('hit'); spawnParticles(e.x, e.y, '#f1c40f', 3); hitEnemy = true; 
                        
                        // ⚡ 체인 라이트닝 발동 (20% 확률)
                        if (p.lvl_lightning > 0 && Math.random() < 0.2) {
                            playSound('zap');
                            let chainCount = 2 + p.lvl_lightning; // 전이되는 적의 수
                            let chainDmg = p.dmg * (0.5 + p.lvl_lightning*0.5);
                            let targets = enemies.filter(en => en !== e).sort((a,b) => Math.hypot(a.x-e.x, a.y-e.y) - Math.hypot(b.x-e.x, b.y-e.y)).slice(0, chainCount);
                            let startX = e.x, startY = e.y;
                            targets.forEach(t => {
                                lightnings.push({x1: startX, y1: startY, x2: t.x, y2: t.y, life: 10});
                                t.hp -= chainDmg; spawnParticles(t.x, t.y, '#00ffff', 4);
                                startX = t.x; startY = t.y; // 체인처럼 연결
                            });
                        }
                        break; 
                    }
                }
                if (!hitEnemy && b && (b.y < -50 || b.x < -50 || b.x > canvas.width+50)) bullets.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; e.y += e.speed;
                if (e.isBoss && e.iframe > 0) e.iframe--;
                
                let drawnEnemy = false;
                if (customEnemyImg && customEnemyImg.complete && customEnemyImg.naturalWidth > 0 && !e.isBoss) {
                    try {
                        ctx.drawImage(customEnemyImg, e.x - e.w/2, e.y - e.h/2, e.w, e.h);
                        ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                        ctx.shadowColor = "black"; ctx.shadowBlur = 4; ctx.fillText(Math.ceil(e.hp), e.x, e.y); ctx.shadowBlur = 0;
                        drawnEnemy = true;
                    } catch(err) {}
                }
                if (!drawnEnemy) { draw3DBox(e.x, e.y, e.w, e.h, e.color || (e.isBoss ? '#8e44ad' : '#ff4757'), e.isBoss ? "" : Math.ceil(e.hp)); }

                if (e.isBoss) { 
                    ctx.fillStyle = '#333'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w, 8); 
                    let hpRatio = Math.max(0, e.hp/e.maxHp); if(isNaN(hpRatio)) hpRatio=0;
                    ctx.fillStyle = '#ff4757'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w*hpRatio, 8); 
                }

                if (e.hp <= 0) {
                    playSound('kill'); score += e.isBoss ? 1000 : 10;
                    spawnParticles(e.x, e.y, e.color || (e.isBoss ? '#8e44ad' : '#ff4757'), e.isBoss ? 40 : 10);
                    
                    if (e.isBoss) {
                        bossKills++; isBossStage = false; document.getElementById('boss-timer-display').style.display = 'none';
                        globalShakeTimer = 15; 
                        if (bossKills >= WIN_CONDITION) { gameEnd(true); return; }
                        else { p.exp += p.maxExp; updateUI(); }
                    } else { p.exp += 2; }
                    enemies.splice(i, 1); if (p.exp >= p.maxExp) triggerLevelUp(); updateUI();
                } else if (e.y > canvas.height + 50) {
                    p.hp -= (e.isBoss ? 50 : 5); enemies.splice(i, 1); updateUI();
                    globalShakeTimer = 10; 
                    if (p.hp <= 0) { gameEnd(false); return; }
                }
            }

            // 🌟 파티클 렌더링 물리 엔진 적용
            for(let i = particles.length - 1; i >= 0; i--){ 
                let pt = particles[i]; pt.life--; pt.x += pt.vx; pt.y += pt.vy; 
                ctx.globalAlpha = pt.life / pt.maxLife; 
                if (pt.isAoE) { ctx.strokeStyle = pt.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (1 - pt.life / pt.maxLife), 0, Math.PI*2); ctx.stroke(); } 
                else { ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (pt.life / pt.maxLife), 0, Math.PI*2); ctx.fill(); }
                ctx.globalAlpha = 1; if(pt.life <= 0) particles.splice(i, 1); 
            }

            for(let i=0; i<p.charCount; i++) {
                let cx = p.x + (i - (p.charCount-1)/2) * spacing;
                let drawnPlayer = false;
                if (customPlayerImg && customPlayerImg.complete && customPlayerImg.naturalWidth > 0) { 
                    try { ctx.drawImage(customPlayerImg, cx - p.w/2, p.y - p.h/2, p.w, p.h); drawnPlayer = true; } catch(err) {}
                } 
                if (!drawnPlayer) { draw3DBox(cx, p.y, p.w, p.h, '#00a8ff'); }
            }

            ctx.restore(); 
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
