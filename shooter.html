<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그라이트 화력 슈팅 (V17 스킬 스케일링 완벽화)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Apple SD Gothic Neo', sans-serif; user-select: none; }
        body { background-color: #050510; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100vh; background: #0b0b1a; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-left: 2px solid #2f3640; border-right: 2px solid #2f3640; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; pointer-events: none; z-index: 10; }
        .bar-bg { width: 100%; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-bottom: 8px; border: 2px solid #2f3640; overflow: hidden; position: relative; }
        #hp-bar { height: 100%; background: #ff4757; width: 100%; transition: width 0.2s; }
        #exp-bar { height: 100%; background: #1e90ff; width: 0%; transition: width 0.2s; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 14px; font-weight: bold; color: white; line-height: 16px; text-shadow: 1px 1px 2px black; }
        .top-stats { display: flex; flex-direction: column; gap: 5px; color: white; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px black; margin-top: 5px; pointer-events: auto; max-width: 70%; }

        #boss-timer-display { display: none; color: #ff4757; font-size: 22px; font-weight: 900; text-align: center; margin-top: 25px; text-shadow: 0 0 15px #ff4757; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        #sound-btn { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.8); border: 2px solid #57606f; border-radius: 50%; width: 50px; height: 50px; font-size: 22px; cursor: pointer; color: white; pointer-events: auto; display: flex; justify-content: center; align-items: center; z-index: 999; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #skill-btn { position: fixed; bottom: 20px; right: 20px; width: 85px; height: 85px; border-radius: 50%; background: rgba(0, 210, 211, 0.85); color: white; font-size: 18px; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0, 210, 211, 0.6); pointer-events: auto; border: 4px solid #fff; z-index: 999; cursor: pointer; transition: 0.1s; }
        #skill-btn.cooldown { background: rgba(100, 100, 100, 0.7); border-color: #888; color: #ccc; pointer-events: none; }

        @media (min-width: 700px) {
            #sound-btn { top: 40px; left: calc(50% - 240px - 80px); }
            #skill-btn { bottom: 60px; right: calc(50% - 240px - 110px); width: 100px; height: 100px; }
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        .title-text { font-size: 40px; font-weight: 900; color: #00a8ff; text-shadow: 0 0 20px rgba(0, 168, 255, 0.5); margin-bottom: 20px; text-align: center; }
        .start-btn { padding: 15px 40px; background: #00a8ff; color: white; border: none; border-radius: 30px; font-size: 22px; font-weight: bold; cursor: pointer; pointer-events: auto; }
        #reroll-btn { margin-top: 15px; padding: 10px 25px; font-size: 16px; background: #57606f; border-radius: 20px; color: white; border: none; cursor: pointer; display: none; pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        #levelup-screen { display: none; pointer-events: auto; }
        .ability-card { background: #2f3542; width: 90%; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 2px solid #57606f; cursor: pointer; color: white; transition: 0.2s; }
        .ability-card.rare { border-color: #e1b12c; background: #3a2b10; }
        .ability-card.legendary { border-color: #00ffff; background: #002233; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .ability-card:hover { transform: scale(1.03); background: #3a4151; }

        .chest-box { font-size: 80px; cursor: pointer; transition: 0.2s; }
        .anim-shake { animation: shake-normal 0.6s ease-in-out forwards; }
        .anim-shake-rare { animation: shake-rare 1.4s ease-in-out forwards; }
        @keyframes shake-normal { 0%, 100% { transform: rotate(0deg); } 20%, 60% { transform: rotate(-15deg); } 40%, 80% { transform: rotate(15deg); } 100% { opacity: 0; } }
        @keyframes shake-rare { 0%, 100% { transform: rotate(0deg); } 10%, 30%, 50%, 70%, 90% { transform: rotate(-25deg) scale(1.4); } 20%, 40%, 60%, 80% { transform: rotate(25deg) scale(1.4); } 100% { opacity: 0; scale: 2.5; } }

        #dev-panel { display: none; position: fixed; top: 10%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(0, 0, 0, 0.95); border: 2px solid #ff4757; border-radius: 15px; padding: 20px; color: white; z-index: 1000; overflow-y: auto; pointer-events: auto; }
        .dev-btn { background: #2f3542; color: white; border: 1px solid #747d8c; padding: 10px; margin: 4px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="sound-btn" onclick="toggleSound()">🔊</button>
    <div id="skill-btn" onmousedown="fireSkill(event)" ontouchstart="fireSkill(event)">
        <div id="skill-name">스킬(A)</div>
        <div id="skill-cool" style="font-size:32px; font-weight:900;"></div>
    </div>

    <div id="game-container">
        <div id="ui-layer" style="display: none;">
            <div class="bar-bg"><div id="hp-bar"></div><div class="bar-text" id="hp-text">HP: 100 / 100</div></div>
            <div class="bar-bg"><div id="exp-bar"></div><div class="bar-text" id="exp-text">LV.1</div></div>
            <div class="top-stats">
                <div id="score-display" onclick="checkDevMode()" style="cursor: pointer;">SCORE: 0</div>
                <div id="boss-kill-display">처치한 보스: 0 / 20</div>
            </div>
            <div id="boss-timer-display">⚠️ 보스 출현! 남은 시간: 30s ⚠️</div>
        </div>

        <div class="overlay" id="start-screen">
            <div class="title-text">SURVIVOR<br>SHOOTER</div>
            <p style="color: #ced6e0; margin-bottom: 20px; text-align: center;">끝없이 쏟아지는 적들을 쓸어버리세요!</p>
            <div class="skin-btn-group" style="display:flex; gap:10px; margin-bottom:30px;">
                <button class="skin-btn" style="padding:10px; border-radius:8px; cursor:pointer;" onclick="document.getElementById('p-img-upload').click()">내 캐릭터 변경</button>
                <button class="skin-btn" style="padding:10px; border-radius:8px; cursor:pointer;" onclick="document.getElementById('e-img-upload').click()">적 캐릭터 변경</button>
            </div>
            <input type="file" id="p-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'player')">
            <input type="file" id="e-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'enemy')">
            <button class="start-btn" onclick="startGame()">전투 시작</button>
        </div>

        <div class="overlay" id="levelup-screen">
            <div id="lvl-title-text" style="font-size:32px; color:#f1c40f; font-weight:900; margin-bottom:20px;">보물상자!</div>
            <div id="chest-container" style="display:flex; flex-direction:column; align-items:center;">
                <div id="chest-emoji" class="chest-box" onpointerdown="openChest()">🎁</div>
                <p style="color:white; margin-top:20px;">터치하여 열기</p>
            </div>
            <div id="ability-container" style="width: 100%; display: none; flex-direction: column; align-items: center; overflow-y: auto; max-height: 70vh;"></div>
            <button id="reroll-btn">🔄 능력 새로고침 (1회)</button>
        </div>

        <div class="overlay" id="end-screen" style="display: none;">
            <div id="end-title" class="title-text"></div>
            <p id="final-score" style="color: white; font-size: 22px; margin-bottom: 30px; text-align: center;"></p>
            <button class="start-btn" onclick="location.reload()">다시 시작</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="dev-panel">
        <h3>🛠️ 개발자 모드</h3>
        <button class="dev-btn" onclick="toggleSpawn()">소환 정지 토글</button>
        <button class="dev-btn" onclick="clearAllEnemies()">몹 싹쓸이</button>
        <button class="dev-btn" style="width:100%; margin-top:10px; background:#57606f;" onclick="closeDevMode()">닫기</button>
        <div id="dev-skills" style="display: flex; flex-wrap: wrap; gap: 5px; margin-top:10px;"></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        function resize() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
        window.addEventListener('resize', resize); resize();

        let gameState = 'START';
        let frameCount = 0; let score = 0; let bossKills = 0;
        const WIN_CONDITION = 20;
        let isBossStage = false; let isBossWarning = false; let bossWarningTimer = 0;
        let bossTimer = 30; 
        const BOSS_SPAWN_INTERVAL = 1800; 
        let bossSpawnTimer = BOSS_SPAWN_INTERVAL; 
        let globalShakeTimer = 0; 
        
        let isSwarm = false;
        let swarmWarningTimer = 0;

        let stars = [];
        for(let i=0; i<80; i++) stars.push({x: Math.random()*1000, y: Math.random()*1000, s: Math.random()*2+1, v: Math.random()*2+2});

        let p = {}; let bullets = []; let enemies = []; let particles = []; let activeSkills = []; 
        let shurikens = []; let orbitals = []; let lightnings = []; let bossBullets = []; let homingBullets = [];
        let swords = []; 

        let customPlayerImg = new Image(); customPlayerImg.src = "player.png"; customPlayerImg.onerror = () => { customPlayerImg = null; };
        let customEnemyImg = new Image(); customEnemyImg.src = "enemy.png"; customEnemyImg.onerror = () => { customEnemyImg = null; };
        function handleImage(event, type) {
            const file = event.target.files[0]; if (!file) return;
            const img = new Image(); img.src = URL.createObjectURL(file);
            img.onload = () => { if (type === 'player') customPlayerImg = img; else customEnemyImg = img; };
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx; let isSoundOn = true; let bgmInterval = null; let bgmStep = 0;
        
        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            startBGM(); 
        }
        
        function toggleSound() { 
            isSoundOn = !isSoundOn; 
            document.getElementById('sound-btn').innerText = isSoundOn ? '🔊' : '🔇'; 
            if(!isSoundOn && bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            else if(isSoundOn) startBGM();
        }
        
        function startBGM() {
            if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            bgmStep = 0;
            bgmInterval = setInterval(() => {
                if(!isSoundOn || gameState !== 'PLAYING') return;
                const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                let notes = [130, 130, 155, 174, 130, 196, 155, 130];
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(notes[bgmStep%8] * (isBossStage || isBossWarning || isSwarm ? 1.5 : 1), t);
                gain.gain.setValueAtTime(0.012, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
                osc.start(t); osc.stop(t+0.15); bgmStep++;
            }, 200);
        }
        
        function playSound(type) {
            if(!isSoundOn || !audioCtx) return; const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(600, t); gain.gain.setValueAtTime(0.005, t); osc.start(t); osc.stop(t+0.1); }
            else if(type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, t); gain.gain.setValueAtTime(0.015, t); osc.start(t); osc.stop(t+0.05); }
            else if(type === 'kill') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); gain.gain.setValueAtTime(0.02, t); osc.start(t); osc.stop(t+0.2); }
            else if(type === 'levelup') { osc.type = 'sine'; osc.frequency.setValueAtTime(500, t); gain.gain.setValueAtTime(0.05, t); osc.start(t); osc.stop(t+0.4); }
            else if(type === 'zap') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t); gain.gain.setValueAtTime(0.01, t); osc.start(t); osc.stop(t+0.1); }
            else if(type === 'boss_shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(150, t); gain.gain.setValueAtTime(0.01, t); osc.start(t); osc.stop(t+0.15); }
            else if(type === 'heal') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.linearRampToValueAtTime(1000, t+0.2); gain.gain.setValueAtTime(0.02, t); osc.start(t); osc.stop(t+0.2); }
        }

        let scoreTapCount = 0; let devStopSpawn = false;
        function checkDevMode() { scoreTapCount++; if(scoreTapCount >= 5) { scoreTapCount=0; if(prompt("PW:")==="1563") openDevMode(); } }
        function openDevMode() { document.getElementById('dev-panel').style.display='block'; renderDevSkills(); }
        function closeDevMode() { document.getElementById('dev-panel').style.display='none'; }
        function toggleSpawn() { devStopSpawn = !devStopSpawn; }
        function clearAllEnemies() { enemies = []; }
        function renderDevSkills() {
            const cont = document.getElementById('dev-skills'); cont.innerHTML = '';
            getAvailableAbilities(true).forEach(ab => {
                let btn = document.createElement('button'); btn.className='dev-btn'; btn.innerText=ab.name;
                btn.onclick = () => { ab.apply(); updateUI(); renderDevSkills(); }; cont.appendChild(btn);
            });
        }

        window.mouseX_val = canvas.width / 2;
        container.addEventListener('mousemove', e => { const rect = canvas.getBoundingClientRect(); window.mouseX_val = e.clientX - rect.left; });
        container.addEventListener('touchmove', e => { const rect = canvas.getBoundingClientRect(); window.mouseX_val = e.touches[0].clientX - rect.left; }, {passive: true});

        function getAvailableAbilities(isDev = false) {
            let pool = [
                { name: '⚔️ 공격력 UP', apply: () => { p.lvl_atk++; p.dmg += 1; } },
                { name: '💥 탄환 확산', apply: () => { p.lvl_bullet++; p.bulletSpread++; } },
                { name: '🪄 스킬 파괴력 UP', apply: () => { p.lvl_skill_dmg++; } },
                { name: '⏳ 스킬 쿨타임 감소', apply: () => { p.skillCooldownMax = Math.max(60, p.skillCooldownMax - 120); } },
                { name: '🧛 처치 시 흡혈', apply: () => { p.lvl_vampire++; p.vampire_chance += 0.05; } },
                { name: '💖 초당 자연 회복', apply: () => { p.lvl_regen++; } }
            ];

            if (Math.random() < 0.03 || isDev) pool.push({ isLegendary: true, name: '💠 [초희귀] 샷건 (탄환 x2)', apply: () => { p.bulletMultiplier *= 2; } });
            
            if (p.lvl_lightning > 0 || Math.random() < 0.25 || isDev) {
                pool.push({ isRare: p.lvl_lightning === 0, name: p.lvl_lightning === 0 ? '⚡ [레어] 연쇄 번개' : '⚡ 번개 확률 & 전이 UP', apply: () => { p.lvl_lightning++; p.lightning_chance = Math.min(0.8, 0.2 + p.lvl_lightning*0.05); } });
            }

            // 🌟 유도탄 데미지 & 개수 UP으로 텍스트 명확화
            if (p.lvl_homing > 0 || Math.random() < 0.3 || isDev) {
                pool.push({ isRare: p.lvl_homing === 0, name: p.lvl_homing === 0 ? '✨ [레어] 유도 분열탄' : '✨ 유도탄 분열 개수 & 위력 UP', apply: () => { p.lvl_homing++; p.homing_split++; } });
            }

            if (p.lvl_sword > 0 || Math.random() < 0.25 || isDev) {
                pool.push({ isRare: p.lvl_sword === 0, name: p.lvl_sword === 0 ? '🗡️ [레어] 심판의 검 (보스 극딜)' : '🗡️ 심판의 검 쿨타임 감소', apply: () => { p.lvl_sword++; } });
            }

            if (p.lvl_storm > 0 || Math.random() < 0.3 || isDev) {
                pool.push({ isRare: p.lvl_storm === 0, name: p.lvl_storm === 0 ? '🌀 [레어] 칼날 돌풍 (근접 방어)' : '🌀 칼날 돌풍 반경 & 쿨감', apply: () => { p.lvl_storm++; } });
            }

            if (p.lvl_orbital > 0 || Math.random() < 0.015 || isDev) {
                if (p.lvl_orbital === 0) pool.push({ isLegendary: true, name: '🌌 [전설] 위성 폭격', apply: () => { p.lvl_orbital++; p.orbitalTimer = 0; } });
                else { pool.push({ name: '🌌 위성 폭격 주기 감소', apply: () => { p.lvl_orbital++; } }); pool.push({ name: '🌌 위성 폭격 범위 증가', apply: () => { p.lvl_orbital_range++; } }); }
            }

            if (p.lvl_shuriken_active || Math.random() < 0.3 || isDev) {
                pool.push({ isRare: !p.lvl_shuriken_active, name: p.lvl_shuriken_active ? '🌟 수호 표창 개수 UP' : '🌟 [레어] 수호 표창', apply: () => { p.lvl_shuriken_active = true; p.shurikenLimit = Math.min(10, p.shurikenLimit + 1); } });
            }

            if (p.activeSkillType === 'boomerang') {
                pool.push({ name: '🎇 부메랑 분열', apply: () => { p.lvl_boom_split++; } });
                if (Math.random() < 0.15 || isDev) pool.push({ name: '🔄 스킬 교체: 레이저', apply: () => { p.activeSkillType = 'laser'; p.skillCooldownMax = 600; p.skillTimer = 0; } });
                pool.push({ name: '🔄 스킬 교체: 냥냥펀치', apply: () => { p.activeSkillType = 'punch'; p.skillCooldownMax = 600; p.skillTimer = 0; } });
            }
            if (p.activeSkillType === 'laser') pool.push({ name: '🔱 레이저 갈래 UP', apply: () => { p.lvl_laser_split++; } });
            if (p.activeSkillType === 'punch') { pool.push({ name: '🐾 냥냥펀치 개수 UP', apply: () => { p.lvl_punch_count++; } }); pool.push({ name: '💥 냥냥펀치 분열 UP', apply: () => { p.lvl_punch_split++; } }); }

            return pool;
        }

        function startGame() {
            if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            initAudio();
            p = { 
                x: canvas.width/2, y: canvas.height-100, vx: 0, w: 40, h: 40, 
                hp: 100, maxHp: 100, level: 1, exp: 0, maxExp: 30, dmg: 1, 
                bulletSpread: 1, bulletMultiplier: 1, totalFired: 0, fireDelay: 15, 
                activeSkillType: 'boomerang', skillTimer: 0, skillCooldownMax: 600, 
                lvl_atk: 0, lvl_skill_dmg: 0, lvl_boom_split: 0, lvl_boom_size: 0, lvl_laser_split: 0, lvl_punch_count: 0, lvl_punch_split: 1, 
                lvl_shuriken_active: false, shurikenLimit: 5, lastShurikenTime: 0, 
                lvl_orbital: 0, lvl_orbital_range: 0, orbitalTimer: 0, 
                lvl_lightning: 0, lightning_chance: 0.2,
                lvl_homing: 0, homing_split: 3,
                lvl_sword: 0, swordTimer: 0,
                lvl_storm: 0, stormTimer: 0, 
                lvl_vampire: 0, vampire_chance: 0, lvl_regen: 0, iframe: 0 
            };
            bullets = []; homingBullets = []; enemies = []; particles = []; activeSkills = []; shurikens = []; orbitals = []; lightnings = []; bossBullets = []; swords = [];
            score = 0; bossKills = 0; frameCount = 0; isBossStage = false; isBossWarning = false; isSwarm = false;
            bossSpawnTimer = BOSS_SPAWN_INTERVAL; 
            document.getElementById('start-screen').style.display = 'none'; document.getElementById('end-screen').style.display = 'none'; document.getElementById('ui-layer').style.display = 'block';
            gameState = 'PLAYING'; updateUI();
        }

        function updateUI() {
            document.getElementById('hp-bar').style.width = (Math.max(0, p.hp) / p.maxHp * 100) + '%';
            document.getElementById('hp-text').innerText = `HP: ${Math.floor(Math.max(0, p.hp))} / ${p.maxHp}`;
            document.getElementById('exp-bar').style.width = (p.exp / p.maxExp * 100) + '%';
            document.getElementById('exp-text').innerText = `LV.${p.level}`;
            document.getElementById('score-display').innerText = `SCORE: ${score}`;
            document.getElementById('boss-kill-display').innerText = `처치한 보스: ${bossKills} / ${WIN_CONDITION}`;
            let btn = document.getElementById('skill-btn');
            if (p.skillTimer > 0) { btn.classList.add('cooldown'); document.getElementById('skill-name').style.display='none'; document.getElementById('skill-cool').innerText = Math.ceil(p.skillTimer / 60); }
            else { btn.classList.remove('cooldown'); document.getElementById('skill-name').style.display='block'; document.getElementById('skill-cool').innerText = ''; }
        }

        let isChestOpening = false;
        let currentChestReroll = 1; 

        function triggerLevelUp() { 
            gameState = 'LEVELUP'; isChestOpening = false; isRareChest = Math.random() < 0.1; currentChestReroll = 1; 
            document.getElementById('levelup-screen').style.display = 'flex'; document.getElementById('chest-container').style.display = 'flex'; document.getElementById('ability-container').style.display = 'none'; document.getElementById('reroll-btn').style.display = 'none';

                else if(sk.type==='boomerang') {
                    if(sk.state==='flying') { sk.x+=sk.vx; sk.y+=sk.vy; if(sk.y<-sk.w||sk.x<-sk.w||sk.x>canvas.width+sk.w) {activeSkills.splice(i,1); continue;} }
                    else { sk.hoverTimer--; if(sk.hoverTimer<=0) { if(sk.level<=p.lvl_boom_split && sk.level<3) for(let j=0; j<5; j++) activeSkills.push({type:'boomerang', level:sk.level+1, x:sk.x, y:sk.y, w:sk.w*0.6, vx:Math.cos(j*Math.PI*2/5)*12, vy:Math.sin(j*Math.PI*2/5)*12, state:'flying', hoverTimer:0, dmg:sk.dmg}); activeSkills.splice(i,1); continue; } }
                    ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(frameCount*0.4); ctx.fillStyle='#00d2d3'; ctx.fillRect(-sk.w/2, -8, sk.w, 16); ctx.fillRect(-8, -sk.w/2, 16, sk.w); ctx.restore();
                    enemies.forEach(e => { if(Math.abs(e.x-sk.x)<sk.w/2 && Math.abs(e.y-sk.y)<sk.w/2) { e.hp-=sk.dmg; if(sk.state==='flying'){sk.state='hovering'; sk.hoverTimer=60;} } });
                } else if(sk.type==='laser') {
                    sk.life--; let lx = p.x + sk.offsetX; ctx.globalAlpha=0.7; ctx.fillStyle='#fff'; ctx.fillRect(lx-20, 0, 40, p.y); ctx.globalAlpha=1;
                    enemies.forEach(e => { if(Math.abs(e.x-lx)<40 && e.y<p.y) { e.hp-=sk.dmg; } });
                    if(sk.life<=0) activeSkills.splice(i, 1);
                } else if(sk.type==='punch') {
                    if(sk.state==='flying') { 
                        sk.x+=sk.vx; sk.y+=sk.vy; 
                        if(Math.abs(sk.vx)>0) sk.angle=Math.atan2(sk.vy, sk.vx)+Math.PI/2; else sk.angle=0; 
                        let hitAny = false; enemies.forEach(e=>{ if(Math.abs(e.x-sk.x)<sk.w/2&&Math.abs(e.y-sk.y)<sk.w/2){hitAny=true;} });
                        if(hitAny) { sk.state='punching'; sk.hitTimer=60; }
                        if(sk.y<-100 || sk.x<-100 || sk.x>canvas.width+100) sk.state='done'; 
                    }
                    else if (sk.state==='punching') { 
                        sk.hitTimer--; 
                        if(sk.hitTimer%10===0){
                            playSound('hit'); let aoe = sk.w * 1.5; particles.push({x:sk.x, y:sk.y, vx:0, vy:0, life:15, maxLife:15, size:aoe, color:'rgba(255,159,243,0.8)', isAoE:true});
                            enemies.forEach(e=>{ if(Math.abs(e.x-sk.x)<aoe && Math.abs(e.y-sk.y)<aoe){ e.hp -= sk.dmg*0.4; if(e.isBoss) e.iframe=4; } });
                        }
                        if(sk.hitTimer<=0){
                            if(sk.level<=p.lvl_punch_split) { for(let j=0; j<2; j++) { activeSkills.push({type:'punch',level:sk.level+1,x:sk.x,y:sk.y,w:sk.w*0.8,vx:sk.vx+(j===0?-5:5),vy:-10,dmg:sk.dmg,state:'flying',hitTimer:60}); } }
                            sk.state='done';
                        }
                    }
                    if (sk.state !== 'done') {
                        ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(sk.angle || 0); 
                        if(sk.state==='punching') ctx.translate(0, Math.sin(sk.hitTimer*0.8)*20-10); 
                        ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,0,sk.w*0.4,sk.w*0.35,0,0,Math.PI*2); ctx.fill(); 
                        ctx.fillStyle='#ff9ff3'; ctx.beginPath(); ctx.arc(0,5,sk.w*0.15,0,Math.PI*2); ctx.fill(); 
                        ctx.beginPath(); ctx.arc(-14,-10,sk.w*0.08,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(0,-18,sk.w*0.08,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(14,-10,sk.w*0.08,0,Math.PI*2); ctx.fill(); 
                        ctx.restore(); 
                    } else { activeSkills.splice(i, 1); }
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; 
                
                if(e.isBoss) {
                    if (frameCount % Math.max(30, 90 - bossKills * 3) === 0) {
                        playSound('boss_shoot');
                        let dx = p.x - e.x; let dy = p.y - e.y; let angle = Math.atan2(dy, dx);
                        let bulletCount = 3 + Math.floor(bossKills/3); 
                        let spread = 0.2 + Math.min(0.3, bossKills*0.02);
                        for(let a = 0; a < bulletCount; a++) {
                            let currentAngle = angle - spread*(bulletCount-1)/2 + a*spread; let speed = 4 + bossKills * 0.15;
                            bossBullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(currentAngle) * speed, vy: Math.sin(currentAngle) * speed, r: 7, color: '#ff4757', dmg: 10 + bossKills * 2 });
                        }
                    }
                } else { e.y += e.speed; }

                if(e.isBoss && e.iframe > 0) e.iframe--;
                
                let drawn = false;
                if(customEnemyImg && customEnemyImg.complete && !e.isBoss) { ctx.drawImage(customEnemyImg, e.x-e.w/2, e.y-e.h/2, e.w, e.h); drawn=true; }
                
                if(!drawn) {
                    if (e.isBoss) {
                        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(frameCount*0.05); ctx.fillStyle = '#8e44ad'; ctx.shadowColor = '#d980fa'; ctx.shadowBlur = 20;
                        ctx.beginPath(); ctx.roundRect(-e.w/2, -e.h/2, e.w, e.h, 15); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0,0, e.w/4, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(0,0, e.w/4 * (0.5 + Math.sin(frameCount*0.1)*0.5), 0, Math.PI*2); ctx.fill(); ctx.restore();
                    } else {
                        ctx.save(); let grad = ctx.createLinearGradient(e.x, e.y-e.h/2, e.x, e.y+e.h/2); grad.addColorStop(0, e.color || '#ff4757'); grad.addColorStop(1, '#111'); ctx.fillStyle = grad;
                        ctx.beginPath(); ctx.roundRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h, 6); ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.roundRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h*0.2, [6, 6, 0, 0]); ctx.fill();
                        ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(Math.ceil(e.hp), e.x, e.y); ctx.restore();
                    }
                }

                if(e.isBoss) { ctx.fillStyle='#333'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w, 8); ctx.fillStyle='#ff4757'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w*Math.max(0, e.hp/e.maxHp), 8); }
                
                if(e.hp<=0) { 
                    playSound('kill'); score+=e.isBoss?1000:10; 
                    if (p.lvl_vampire > 0 && Math.random() < p.vampire_chance && p.hp < p.maxHp) { p.hp = Math.min(p.maxHp, p.hp + 1 + p.lvl_vampire); spawnParticles(p.x, p.y, '#2ecc71', 2); playSound('heal'); updateUI(); }
                    
                    spawnParticles(e.x,e.y,e.isBoss?'#8e44ad':(e.color || '#ff4757'), e.isBoss?40:10); 

                    if(e.isBoss){
                        bossKills++; isBossStage=false; document.getElementById('boss-timer-display').style.display='none'; 
                        bossSpawnTimer = BOSS_SPAWN_INTERVAL;
                        if(bossKills>=WIN_CONDITION) {gameEnd(true); return;} else {p.exp+=p.maxExp; updateUI();}
                    } else { p.exp+=2; }
                    enemies.splice(i,1); if(p.exp>=p.maxExp) triggerLevelUp(); updateUI(); 
                }
                else if(e.y > canvas.height+50) { p.hp-=e.isBoss?50:5; enemies.splice(i,1); updateUI(); if(p.hp<=0) {gameEnd(false); return;} }
            }

            for (let i = bossBullets.length - 1; i >= 0; i--) {
                let bb = bossBullets[i]; bb.x += bb.vx; bb.y += bb.vy;
                ctx.fillStyle = bb.color; ctx.shadowColor = bb.color; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r/2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

                if (p.iframe <= 0 && Math.abs(bb.x - p.x) < p.w/2 && Math.abs(bb.y - p.y) < p.h/2) {
                    p.hp -= bb.dmg; p.iframe = 30; spawnParticles(p.x, p.y, '#ff0000', 15, 2); globalShakeTimer = 10; playSound('hit'); updateUI(); bossBullets.splice(i, 1);
                    if (p.hp <= 0) { gameEnd(false); return; } continue;
                }
                if(bb.y > canvas.height + 50 || bb.x < -50 || bb.x > canvas.width + 50) bossBullets.splice(i, 1);
            }

            for (let i = lightnings.length - 1; i >= 0; i--) {
                let l = lightnings[i]; l.life--;
                ctx.strokeStyle = `rgba(0, 255, 255, ${Math.max(0, l.life/10)})`; ctx.lineWidth = 3; ctx.beginPath();
                ctx.moveTo(l.x1, l.y1); ctx.lineTo((l.x1+l.x2)/2 + (Math.random()-0.5)*20, (l.y1+l.y2)/2 + (Math.random()-0.5)*20); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                if (l.life <= 0) lightnings.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i]; pt.life--; pt.x += pt.vx; pt.y += pt.vy; let lifeRatio = Math.max(0, pt.life / (pt.maxLife || 25)); ctx.globalAlpha = lifeRatio;
                if (pt.isAoE) { ctx.strokeStyle = pt.color; ctx.lineWidth = 3; ctx.beginPath(); let r = Math.max(0.1, pt.size * (1 - lifeRatio)); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.stroke(); } 
                else { ctx.fillStyle = pt.color; ctx.beginPath(); let r = Math.max(0.1, pt.size * lifeRatio); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill(); }
                ctx.globalAlpha = 1; if (pt.life <= 0) particles.splice(i, 1);
            }

            if (!(p.iframe > 0 && Math.floor(frameCount / 5) % 2 === 0)) {
                let dp = false;
                if(customPlayerImg && customPlayerImg.complete) { ctx.drawImage(customPlayerImg, p.x - p.w/2, p.y - p.h/2, p.w, p.h); dp=true; }
                if(!dp) {
                    ctx.save(); let grad = ctx.createLinearGradient(p.x, p.y-p.h/2, p.x, p.y+p.h/2); grad.addColorStop(0, '#00a8ff'); grad.addColorStop(1, '#111'); ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h, 6); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h*0.2, [6, 6, 0, 0]); ctx.fill(); ctx.restore();
                }
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
