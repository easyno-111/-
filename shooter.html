<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그라이트 화력 슈팅 (V27 환영검 리워크)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Apple SD Gothic Neo', sans-serif; user-select: none; }
        body { background-color: #050510; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
        
        #game-container { position: relative; width: 100%; max-width: 480px; height: 100vh; background: #0b0b1a; overflow: hidden; box-shadow: 0 0 50px rgba(0,0,0,0.8); border-left: 2px solid #2f3640; border-right: 2px solid #2f3640; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; padding: 15px; pointer-events: none; z-index: 10; }
        .bar-bg { width: 100%; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; margin-bottom: 8px; border: 2px solid #2f3640; overflow: hidden; position: relative; }
        #hp-bar { height: 100%; background: #ff4757; width: 100%; transition: width 0.2s; }
        #exp-bar { height: 100%; background: #1e90ff; width: 0%; transition: width 0.2s; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; text-align: center; font-size: 14px; font-weight: bold; color: white; line-height: 16px; text-shadow: 1px 1px 2px black; }
        .top-stats { display: flex; flex-direction: column; gap: 5px; color: white; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px black; margin-top: 5px; pointer-events: auto; max-width: 70%; }

        #boss-timer-display { display: none; color: #ff4757; font-size: 22px; font-weight: 900; text-align: center; margin-top: 25px; text-shadow: 0 0 15px #ff4757; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        #sound-btn { position: fixed; top: 15px; right: 15px; background: rgba(0,0,0,0.8); border: 2px solid #57606f; border-radius: 50%; width: 50px; height: 50px; font-size: 22px; cursor: pointer; color: white; pointer-events: auto; display: flex; justify-content: center; align-items: center; z-index: 999; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        #skill-btn { position: fixed; bottom: 20px; right: 20px; width: 85px; height: 85px; border-radius: 50%; background: rgba(0, 210, 211, 0.85); color: white; font-size: 18px; font-weight: bold; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 20px rgba(0, 210, 211, 0.6); pointer-events: auto; border: 4px solid #fff; z-index: 999; cursor: pointer; transition: 0.1s; }
        #skill-btn.cooldown { background: rgba(100, 100, 100, 0.7); border-color: #888; color: #ccc; pointer-events: none; }

        @media (min-width: 700px) {
            #sound-btn { top: 40px; left: calc(50% - 240px - 80px); }
            #skill-btn { bottom: 60px; right: calc(50% - 240px - 110px); width: 100px; height: 100px; }
        }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        .title-text { font-size: 40px; font-weight: 900; color: #00a8ff; text-shadow: 0 0 20px rgba(0, 168, 255, 0.5); margin-bottom: 20px; text-align: center; }
        .start-btn { padding: 15px 40px; background: #00a8ff; color: white; border: none; border-radius: 30px; font-size: 22px; font-weight: bold; cursor: pointer; pointer-events: auto; }
        #reroll-btn { margin-top: 15px; padding: 10px 25px; font-size: 16px; background: #57606f; border-radius: 20px; color: white; border: none; cursor: pointer; display: none; pointer-events: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        #levelup-screen { display: none; pointer-events: auto; }
        .ability-card { background: #2f3542; width: 90%; border-radius: 15px; padding: 18px; margin-bottom: 12px; border: 2px solid #57606f; cursor: pointer; color: white; transition: 0.2s; }
        .ability-card.rare { border-color: #e1b12c; background: #3a2b10; }
        .ability-card.legendary { border-color: #00ffff; background: #002233; box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); }
        .ability-card:hover { transform: scale(1.03); background: #3a4151; }

        .chest-box { font-size: 80px; cursor: pointer; transition: 0.2s; }
        .anim-shake { animation: shake-normal 0.6s ease-in-out forwards; }
        .anim-shake-rare { animation: shake-rare 1.4s ease-in-out forwards; }
        @keyframes shake-normal { 0%, 100% { transform: rotate(0deg); } 20%, 60% { transform: rotate(-15deg); } 40%, 80% { transform: rotate(15deg); } 100% { opacity: 0; } }
        @keyframes shake-rare { 0%, 100% { transform: rotate(0deg); } 10%, 30%, 50%, 70%, 90% { transform: rotate(-25deg) scale(1.4); } 20%, 40%, 60%, 80% { transform: rotate(25deg) scale(1.4); } 100% { opacity: 0; scale: 2.5; } }

        #dev-panel { display: none; position: fixed; top: 5%; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; background: rgba(10, 15, 25, 0.95); border: 2px solid #00a8ff; border-radius: 15px; padding: 20px; color: white; z-index: 1000; max-height: 90vh; overflow-y: auto; pointer-events: auto; box-shadow: 0 0 30px rgba(0, 168, 255, 0.4); }
        .dev-skill-row { display: flex; justify-content: space-between; align-items: center; background: #2f3542; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
        .dev-btn-small { background: #00a8ff; color: white; border: none; width: 28px; height: 28px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .dev-btn-small:hover { background: #0082c8; }
        .dev-btn { background: #57606f; color: white; border: none; padding: 10px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <button id="sound-btn" onclick="toggleSound()">🔊</button>
    <div id="skill-btn" onmousedown="fireSkill(event)" ontouchstart="fireSkill(event)">
        <div id="skill-name">스킬(A)</div>
        <div id="skill-cool" style="font-size:32px; font-weight:900;"></div>
    </div>

    <div id="game-container">
        <div id="ui-layer" style="display: none;">
            <div class="bar-bg"><div id="hp-bar"></div><div class="bar-text" id="hp-text">HP: 100 / 100</div></div>
            <div class="bar-bg"><div id="exp-bar"></div><div class="bar-text" id="exp-text">LV.1</div></div>
            <div class="top-stats">
                <div id="score-display" onclick="checkDevMode()" style="cursor: pointer;">SCORE: 0</div>
                <div id="boss-kill-display">처치한 보스: 0 / 20</div>
            </div>
            <div id="boss-timer-display">⚠️ 보스 출현! 남은 시간: 30s ⚠️</div>
        </div>

        <div class="overlay" id="start-screen">
            <div class="title-text">SURVIVOR<br>SHOOTER</div>
            <p style="color: #ced6e0; margin-bottom: 20px; text-align: center;">끝없이 쏟아지는 적들을 쓸어버리세요!</p>
            <div class="skin-btn-group" style="display:flex; gap:10px; margin-bottom:30px;">
                <button class="skin-btn" style="padding:10px; border-radius:8px; cursor:pointer;" onclick="document.getElementById('p-img-upload').click()">내 캐릭터 변경</button>
                <button class="skin-btn" style="padding:10px; border-radius:8px; cursor:pointer;" onclick="document.getElementById('e-img-upload').click()">적 캐릭터 변경</button>
            </div>
            <input type="file" id="p-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'player')">
            <input type="file" id="e-img-upload" accept="image/*" style="display:none;" onchange="handleImage(event, 'enemy')">
            <button class="start-btn" onclick="startGame()">전투 시작</button>
        </div>

        <div class="overlay" id="levelup-screen">
            <div id="lvl-title-text" style="font-size:32px; color:#f1c40f; font-weight:900; margin-bottom:20px;">보물상자!</div>
            <div id="chest-container" style="display:flex; flex-direction:column; align-items:center;">
                <div id="chest-emoji" class="chest-box" onpointerdown="openChest()">🎁</div>
                <p style="color:white; margin-top:20px;">터치하여 열기</p>
            </div>
            <div id="ability-container" style="width: 100%; display: none; flex-direction: column; align-items: center; overflow-y: auto; max-height: 70vh;"></div>
            <button id="reroll-btn">🔄 능력 새로고침 (1회)</button>
        </div>

        <div class="overlay" id="end-screen" style="display: none;">
            <div id="end-title" class="title-text"></div>
            <p id="final-score" style="color: white; font-size: 22px; margin-bottom: 30px; text-align: center;"></p>
            <button class="start-btn" onclick="location.reload()">다시 시작</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="dev-panel">
        <h3 style="text-align:center; color:#00a8ff; margin-bottom:15px;">🛠️ 개발자 시스템 툴</h3>
        <div style="display:flex; gap:10px; margin-bottom: 15px;">
            <button class="dev-btn" onclick="toggleSpawn()" style="margin:0; background:#eb4d4b;">소환 정지</button>
            <button class="dev-btn" onclick="clearAllEnemies()" style="margin:0; background:#f0932b;">몹 싹쓸이</button>
        </div>
        <div id="dev-skills-list"></div>
        <button class="dev-btn" onclick="closeDevMode()" style="margin-top:15px;">닫기</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');
        function resize() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; }
        window.addEventListener('resize', resize); resize();

        let gameState = 'START';
        let frameCount = 0; let score = 0; let bossKills = 0;
        const WIN_CONDITION = 20;
        let isBossStage = false; let isBossWarning = false; let bossWarningTimer = 0;
        let bossTimer = 30; 
        const BOSS_SPAWN_INTERVAL = 1800; 
        let bossSpawnTimer = BOSS_SPAWN_INTERVAL; 
        let globalShakeTimer = 0; 
        
        let isSwarm = false;
        let swarmWarningTimer = 0;

        let stars = [];
        for(let i=0; i<80; i++) stars.push({x: Math.random()*1000, y: Math.random()*1000, s: Math.random()*2+1, v: Math.random()*2+2});

        let p = {}; let bullets = []; let enemies = []; let particles = []; let activeSkills = []; 
        let shurikens = []; let orbitals = []; let lightnings = []; let bossBullets = []; let homingBullets = [];
        let swords = []; let blackholes = []; 

        let customPlayerImg = new Image(); customPlayerImg.src = "player.png"; customPlayerImg.onerror = () => { customPlayerImg = null; };
        let customEnemyImg = new Image(); customEnemyImg.src = "enemy.png"; customEnemyImg.onerror = () => { customEnemyImg = null; };
        function handleImage(event, type) {
            const file = event.target.files[0]; if (!file) return;
            const img = new Image(); img.src = URL.createObjectURL(file);
            img.onload = () => { if (type === 'player') customPlayerImg = img; else customEnemyImg = img; };
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx; let isSoundOn = true; let bgmInterval = null; let bgmStep = 0;
        
        function initAudio() { 
            if (!audioCtx) audioCtx = new AudioContext(); 
            if (audioCtx.state === 'suspended') audioCtx.resume(); 
            startBGM(); 
        }
        
        function toggleSound() { 
            isSoundOn = !isSoundOn; 
            document.getElementById('sound-btn').innerText = isSoundOn ? '🔊' : '🔇'; 
            if(!isSoundOn && bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            else if(isSoundOn) startBGM();
        }
        
        function startBGM() {
            if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            bgmStep = 0;
            bgmInterval = setInterval(() => {
                if(!isSoundOn || gameState !== 'PLAYING') return;
                const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                let notes = [130, 130, 155, 174, 130, 196, 155, 130];
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(notes[bgmStep%8] * (isBossStage || isBossWarning || isSwarm ? 1.5 : 1), t);
                gain.gain.setValueAtTime(0.012, t); gain.gain.exponentialRampToValueAtTime(0.001, t+0.15);
                osc.start(t); osc.stop(t+0.15); bgmStep++;
            }, 200);
        }
        
        function playSound(type) {
            if(!isSoundOn || !audioCtx) return; const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(600, t); gain.gain.setValueAtTime(0.005, t); osc.start(t); osc.stop(t+0.1); }
            else if(type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, t); gain.gain.setValueAtTime(0.015, t); osc.start(t); osc.stop(t+0.05); }
            else if(type === 'kill') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); gain.gain.setValueAtTime(0.02, t); osc.start(t); osc.stop(t+0.2); }
            else if(type === 'levelup') { osc.type = 'sine'; osc.frequency.setValueAtTime(500, t); gain.gain.setValueAtTime(0.05, t); osc.start(t); osc.stop(t+0.4); }
            else if(type === 'zap') { osc.type = 'triangle'; osc.frequency.setValueAtTime(800, t); gain.gain.setValueAtTime(0.01, t); osc.start(t); osc.stop(t+0.1); }
            else if(type === 'boss_shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(150, t); gain.gain.setValueAtTime(0.01, t); osc.start(t); osc.stop(t+0.15); }
            else if(type === 'heal') { osc.type = 'sine'; osc.frequency.setValueAtTime(600, t); osc.frequency.linearRampToValueAtTime(1000, t+0.2); gain.gain.setValueAtTime(0.02, t); osc.start(t); osc.stop(t+0.2); }
            else if(type === 'bh_spawn') { osc.type = 'sine'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(10, t+1.0); gain.gain.setValueAtTime(0.05, t); osc.start(t); osc.stop(t+1.0); }
        }

        let keyBuffer = "";
        let scoreTapCount = 0; let devStopSpawn = false;
        
        window.addEventListener('keydown', (e) => { 
            if ((e.key === 'a' || e.key === 'A') && gameState === 'PLAYING') fireSkill(); 
            keyBuffer += e.key; if (keyBuffer.length > 4) keyBuffer = keyBuffer.slice(-4); 
            if (keyBuffer === "1563") { openDevMode(); keyBuffer = ""; }
        });

        function checkDevMode() { scoreTapCount++; if(scoreTapCount >= 5) { scoreTapCount=0; if(prompt("PW:")==="1563") openDevMode(); } }
        
        const devSkillMap = [
            { id: 'lvl_atk', name: '⚔️ 공격력 UP' },
            { id: 'lvl_firespeed', name: '🔫 평타 연사 속도' },
            { id: 'lvl_pierce', name: '🏹 평타 관통' },
            { id: 'lvl_bullet', name: '💥 탄환 확산' },
            { id: 'lvl_shotgun', name: '💠 샷건 (x2 배수)' },
            { id: 'lvl_skill_dmg', name: '🪄 스킬 파괴력' },
            { id: 'lvl_skill_cd', name: '⏳ 스킬 쿨감' },
            { id: 'lvl_lightning', name: '⚡ 연쇄 번개(레이저)' },
            { id: 'lvl_homing', name: '✨ 유도 분열탄' },
            { id: 'lvl_sword', name: '🗡️ 심판의 검 (환영검)' },
            { id: 'lvl_storm', name: '🌀 칼날 돌풍' },
            { id: 'lvl_blackhole', name: '🌌 블랙홀 탄환' },
            { id: 'lvl_orbital', name: '☄️ 위성 폭격' },
            { id: 'lvl_shuriken', name: '🌟 수호 표창' },
            { id: 'lvl_vampire', name: '🧛 흡혈' },
            { id: 'lvl_regen', name: '💖 자연 회복' },
            { id: 'lvl_boom_split', name: '🪃 부메랑 분열' },
            { id: 'lvl_laser_split', name: '🔱 레이저 갈래' },
            { id: 'lvl_punch_count', name: '🐾 냥냥펀치 개수' },
            { id: 'lvl_punch_split', name: '💥 냥냥펀치 분열' }
        ];

        function openDevMode() { document.getElementById('dev-panel').style.display='block'; renderDevSkills(); }
        function closeDevMode() { document.getElementById('dev-panel').style.display='none'; }
        function toggleSpawn() { devStopSpawn = !devStopSpawn; }
        function clearAllEnemies() { enemies = []; }
        
        function renderDevSkills() {
            const cont = document.getElementById('dev-skills-list');
            cont.innerHTML = `
                <div style="background:#2f3542; padding:10px; border-radius:8px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
                    <label style="font-weight:bold;">액티브 스킬 교체</label>
                    <select onchange="p.activeSkillType=this.value; p.skillTimer=0; updateUI();" style="background:#00a8ff; color:white; border:none; padding:5px 10px; border-radius:5px; font-weight:bold; outline:none;">
                        <option value="boomerang" ${p.activeSkillType==='boomerang'?'selected':''}>🪃 부메랑</option>
                        <option value="laser" ${p.activeSkillType==='laser'?'selected':''}>🔱 레이저</option>
                        <option value="punch" ${p.activeSkillType==='punch'?'selected':''}>🐾 냥냥펀치</option>
                    </select>
                </div>
            `;
            devSkillMap.forEach(s => {
                let row = document.createElement('div'); row.className = 'dev-skill-row';
                let isEnabled = p[s.id] > 0;
                row.innerHTML = `
                    <label style="flex:1; display:flex; align-items:center; gap:10px; cursor:pointer;">
                        <input type="checkbox" onchange="toggleDevSkill('${s.id}', this.checked)" ${isEnabled ? 'checked' : ''} style="transform:scale(1.3);">
                        ${s.name}
                    </label>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="dev-btn-small" onclick="adjustDevSkill('${s.id}', -1)">-</button>
                        <span style="width:25px; text-align:center; font-weight:bold; font-size:16px;">${p[s.id] || 0}</span>
                        <button class="dev-btn-small" onclick="adjustDevSkill('${s.id}', 1)">+</button>
                    </div>
                `;
                cont.appendChild(row);
            });
        }

        function toggleDevSkill(id, checked) { p[id] = checked ? 1 : 0; recalculateStats(); renderDevSkills(); }
        function adjustDevSkill(id, delta) { p[id] = Math.max(0, (p[id] || 0) + delta); recalculateStats(); renderDevSkills(); }

        function recalculateStats() {
            p.dmg = 1; for(let i=0; i<(p.lvl_atk||0); i++) p.dmg = (p.dmg+2)*1.3;
            p.fireDelay = 15; for(let i=0; i<(p.lvl_firespeed||0); i++) p.fireDelay = Math.max(4, p.fireDelay - 2);
            p.skillCooldownMax = 600; for(let i=0; i<(p.lvl_skill_cd||0); i++) p.skillCooldownMax = Math.max(60, p.skillCooldownMax - 120);
            p.bulletMultiplier = Math.pow(2, p.lvl_shotgun || 0);
            p.bulletSpread = 1 + (p.lvl_bullet || 0);
            p.lightning_chance = Math.min(0.8, 0.2 + (p.lvl_lightning||0)*0.05);
            p.homing_split = 3 + (p.lvl_homing||0);
            p.shurikenLimit = Math.min(10, 5 + (p.lvl_shuriken||0));
            p.lvl_shuriken_active = (p.lvl_shuriken||0) > 0;
            p.vampire_chance = (p.lvl_vampire||0) * 0.05;
            p.bh_chance = (p.lvl_blackhole > 0) ? Math.min(0.1, 0.01 + (p.lvl_blackhole - 1) * 0.01) : 0; 
            updateUI();
        }

        window.mouseX_val = canvas.width / 2;
        container.addEventListener('mousemove', e => { const rect = canvas.getBoundingClientRect(); window.mouseX_val = e.clientX - rect.left; });
        container.addEventListener('touchmove', e => { const rect = canvas.getBoundingClientRect(); window.mouseX_val = e.touches[0].clientX - rect.left; }, {passive: true});

        function getAvailableAbilities(isDev = false) {
            let pool = [
                { name: '🔫 연사 속도 UP (평타 기관총)', apply: () => { p.lvl_firespeed++; recalculateStats(); } },
                { name: '⚔️ 공격력 UP (데미지 대폭 상승)', apply: () => { p.lvl_atk++; recalculateStats(); } },
                { name: '🏹 기본 공격 관통 횟수 UP', apply: () => { p.lvl_pierce++; recalculateStats(); } },
                { name: '💥 탄환 확산 (부채꼴 범위 증가)', apply: () => { p.lvl_bullet++; recalculateStats(); } },
                { name: '🪄 스킬 파괴력 UP', apply: () => { p.lvl_skill_dmg++; recalculateStats(); } },
                { name: '⏳ 스킬 쿨타임 감소', apply: () => { p.lvl_skill_cd++; recalculateStats(); } },
                { name: '🧛 처치 시 흡혈', apply: () => { p.lvl_vampire++; recalculateStats(); } },
                { name: '💖 초당 자연 회복', apply: () => { p.lvl_regen++; recalculateStats(); } }
            ];

            if (Math.random() < 0.03 || isDev) pool.push({ isLegendary: true, name: '💠 [초희귀] 샷건 (탄환 x2)', apply: () => { p.lvl_shotgun++; recalculateStats(); } });
            if (p.lvl_lightning > 0 || Math.random() < 0.25 || isDev) pool.push({ isRare: p.lvl_lightning === 0, name: p.lvl_lightning === 0 ? '⚡ [레어] 연쇄 번개 (관통 레이저)' : '⚡ 번개 확률 & 갯수 UP', apply: () => { p.lvl_lightning++; recalculateStats(); } });
            if (p.lvl_homing > 0 || Math.random() < 0.3 || isDev) pool.push({ isRare: p.lvl_homing === 0, name: p.lvl_homing === 0 ? '✨ [레어] 유도 분열탄' : '✨ 유도탄 분열 개수 & 위력 UP', apply: () => { p.lvl_homing++; recalculateStats(); } });
            
            // 🗡️ 심판의 검 (환영검 배열) 텍스트 변경
            if (p.lvl_sword > 0 || Math.random() < 0.25 || isDev) pool.push({ isRare: p.lvl_sword === 0, name: p.lvl_sword === 0 ? '🗡️ [레어] 심판의 검 (환영검 진형)' : '🗡️ 환영검 개수 & 위력 UP', apply: () => { p.lvl_sword++; recalculateStats(); } });
            
            if (p.lvl_blackhole > 0 || Math.random() < 0.1 || isDev) pool.push({ isRare: p.lvl_blackhole === 0, name: p.lvl_blackhole === 0 ? '🌌 [레어] 블랙홀 탄환 (초광역 몹 집결)' : '🌌 블랙홀 범위 및 발동 확률 UP', apply: () => { p.lvl_blackhole++; recalculateStats(); } });
            if (p.lvl_storm > 0 || Math.random() < 0.3 || isDev) pool.push({ isRare: p.lvl_storm === 0, name: p.lvl_storm === 0 ? '🌀 [레어] 칼날 돌풍 (무한 지속 오라)' : '🌀 칼날 돌풍 반경 & 위력 UP', apply: () => { p.lvl_storm++; recalculateStats(); } });
            if (p.lvl_orbital > 0 || Math.random() < 0.015 || isDev) {
                if (p.lvl_orbital === 0) pool.push({ isLegendary: true, name: '☄️ [전설] 위성 폭격', apply: () => { p.lvl_orbital++; p.orbitalTimer = 0; recalculateStats(); } });
                else { pool.push({ name: '☄️ 위성 폭격 주기 감소', apply: () => { p.lvl_orbital++; recalculateStats(); } }); pool.push({ name: '☄️ 위성 폭격 범위 증가', apply: () => { p.lvl_orbital_range++; recalculateStats(); } }); }
            }
            if (p.lvl_shuriken > 0 || Math.random() < 0.3 || isDev) pool.push({ isRare: p.lvl_shuriken === 0, name: p.lvl_shuriken === 0 ? '🌟 [레어] 수호 표창' : '🌟 수호 표창 개수 UP', apply: () => { p.lvl_shuriken++; recalculateStats(); } });

            if (p.activeSkillType === 'boomerang') {
                pool.push({ name: '🎇 부메랑 분열', apply: () => { p.lvl_boom_split++; recalculateStats(); } });
                if (Math.random() < 0.15 || isDev) pool.push({ name: '🔄 스킬 교체: 레이저', apply: () => { p.activeSkillType = 'laser'; p.skillCooldownMax = 600; p.skillTimer = 0; updateUI(); } });
                pool.push({ name: '🔄 스킬 교체: 냥냥펀치', apply: () => { p.activeSkillType = 'punch'; p.skillCooldownMax = 600; p.skillTimer = 0; updateUI(); } });
            }
            if (p.activeSkillType === 'laser') pool.push({ name: '🔱 레이저 갈래 UP', apply: () => { p.lvl_laser_split++; recalculateStats(); } });
            if (p.activeSkillType === 'punch') { pool.push({ name: '🐾 냥냥펀치 개수 UP', apply: () => { p.lvl_punch_count++; recalculateStats(); } }); pool.push({ name: '💥 냥냥펀치 분열 UP', apply: () => { p.lvl_punch_split++; recalculateStats(); } }); }

            return pool;
        }

        function startGame() {
            if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
            initAudio();
            p = { 
                x: canvas.width/2, y: canvas.height-100, vx: 0, w: 40, h: 40, 
                hp: 100, maxHp: 100, level: 1, exp: 0, maxExp: 30, 
                lvl_atk: 0, lvl_firespeed: 0, lvl_pierce: 0, lvl_bullet: 0, lvl_shotgun: 0,
                lvl_skill_dmg: 0, lvl_skill_cd: 0, lvl_vampire: 0, lvl_regen: 0,
                lvl_lightning: 0, lvl_homing: 0, lvl_sword: 0, lvl_storm: 0, lvl_blackhole: 0, bh_chance: 0, lvl_orbital: 0, lvl_shuriken: 0,
                activeSkillType: 'boomerang', lvl_boom_split: 0, lvl_laser_split: 0, lvl_punch_count: 0, lvl_punch_split: 1, 
                
                totalFired: 0, skillTimer: 0, lastShurikenTime: 0, orbitalTimer: 0, swordTimer: 0, stormTimer: 0, iframe: 0 
            };
            recalculateStats();
            bullets = []; homingBullets = []; enemies = []; particles = []; activeSkills = []; shurikens = []; orbitals = []; lightnings = []; bossBullets = []; swords = []; blackholes = [];
            score = 0; bossKills = 0; frameCount = 0; isBossStage = false; isBossWarning = false; isSwarm = false;
            bossSpawnTimer = BOSS_SPAWN_INTERVAL; 
            document.getElementById('start-screen').style.display = 'none'; document.getElementById('end-screen').style.display = 'none'; document.getElementById('ui-layer').style.display = 'block';
            gameState = 'PLAYING'; updateUI();
        }

        function updateUI() {
            document.getElementById('hp-bar').style.width = (Math.max(0, p.hp) / p.maxHp * 100) + '%';
            document.getElementById('hp-text').innerText = `HP: ${Math.floor(Math.max(0, p.hp))} / ${p.maxHp}`;
            document.getElementById('exp-bar').style.width = (p.exp / p.maxExp * 100) + '%';
            document.getElementById('exp-text').innerText = `LV.${p.level}`;
            document.getElementById('score-display').innerText = `SCORE: ${score}`;
            document.getElementById('boss-kill-display').innerText = `처치한 보스: ${bossKills} / ${WIN_CONDITION}`;
            let btn = document.getElementById('skill-btn');
            if (p.skillTimer > 0) { btn.classList.add('cooldown'); document.getElementById('skill-name').style.display='none'; document.getElementById('skill-cool').innerText = Math.ceil(p.skillTimer / 60); }
            else { btn.classList.remove('cooldown'); document.getElementById('skill-name').style.display='block'; document.getElementById('skill-cool').innerText = ''; }
        }

        let isChestOpening = false;
        let currentChestReroll = 1; 

        function triggerLevelUp() { 
            gameState = 'LEVELUP'; isChestOpening = false; isRareChest = Math.random() < 0.1; currentChestReroll = 1; 
            document.getElementById('levelup-screen').style.display = 'flex'; document.getElementById('chest-container').style.display = 'flex'; document.getElementById('ability-container').style.display = 'none'; document.getElementById('reroll-btn').style.display = 'none';
            let chestEl = document.getElementById('chest-emoji'); chestEl.className = 'chest-box'; 
            if (isRareChest) { document.getElementById('lvl-title-text').innerText = '✨ 황금 상자! ✨'; document.getElementById('lvl-title-text').style.color = '#00ffff'; chestEl.innerHTML = '✨🎁✨'; } 
            else { document.getElementById('lvl-title-text').innerText = '보물상자 발견!'; document.getElementById('lvl-title-text').style.color = '#f1c40f'; chestEl.innerHTML = '🎁'; }
        }
        
        function openChest() {
            if(isChestOpening) return; isChestOpening = true; playSound('shoot');
            let chestEl = document.getElementById('chest-emoji');
            if (isRareChest) { chestEl.classList.add('anim-shake-rare'); setTimeout(showOptions, 1400); } 
            else { chestEl.classList.add('anim-shake'); setTimeout(showOptions, 600); }
        }

        function showOptions() {
            playSound('levelup');
            document.getElementById('chest-container').style.display = 'none';
            document.getElementById('ability-container').style.display = 'flex';
            
            const rerollBtn = document.getElementById('reroll-btn');
            rerollBtn.style.display = currentChestReroll > 0 ? 'inline-block' : 'none';
            rerollBtn.onclick = () => {
                if(currentChestReroll > 0) { currentChestReroll--; playSound('shoot'); showOptions(); }
            };

            let choices = getAvailableAbilities().sort(() => 0.5 - Math.random()).slice(0, isRareChest ? 5 : 3);
            const cont = document.getElementById('ability-container'); cont.innerHTML = '';
            choices.forEach(ab => {
                let card = document.createElement('div'); card.className = ab.isLegendary ? 'ability-card legendary' : (ab.isRare ? 'ability-card rare' : 'ability-card');
                card.innerHTML = `<div class="ab-name">${ab.name}</div>`;
                card.onclick = () => { 
                    ab.apply(); p.level++; p.maxExp = Math.floor(p.maxExp * 1.35); p.exp = 0; 
                    document.getElementById('levelup-screen').style.display = 'none'; gameState = 'PLAYING'; updateUI(); 
                };
                cont.appendChild(card);
            });
        }

        function fireSkill(e) {
            if(e) e.preventDefault(); 
            if(p.skillTimer > 0 || gameState !== 'PLAYING') return;
            p.skillTimer = p.skillCooldownMax; playSound('skill');
            let sd = p.dmg * 8 * (1 + (p.lvl_skill_dmg||0) * 0.5);
            
            if(p.activeSkillType === 'boomerang') activeSkills.push({ type: 'boomerang', level: 1, x: p.x, y: p.y - 40, w: 120, vx: p.vx*0.3, vy: -15, state: 'flying', hoverTimer: 0, dmg: sd*0.5 });
            else if(p.activeSkillType === 'laser') { for(let i=0; i<(1+p.lvl_laser_split*2); i++) activeSkills.push({ type: 'laser', offsetX: (i-p.lvl_laser_split)*50, life: 180, w: 40, dmg: sd*0.05 }); }
            else if(p.activeSkillType === 'punch') { 
                for(let i=0; i<(1+p.lvl_punch_count); i++) {
                    activeSkills.push({ 
                        type: 'punch', splitLevel: 0, x: p.x, y: p.y - 30, w: 70, 
                        vx: Math.cos(-Math.PI/2+(i-p.lvl_punch_count/2)*0.4)*18 + p.vx*0.3, 
                        vy: Math.sin(-Math.PI/2+(i-p.lvl_punch_count/2)*0.4)*18, 
                        state: 'flying', hitTimer: 0, pierceTimer: 0, dmg: sd*0.4 
                    }); 
                }
            }
            updateUI();
        }

        function gameEnd(win) {
            gameState = 'END'; document.getElementById('ui-layer').style.display = 'none'; document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-title').innerText = win ? "VICTORY!" : "GAME OVER";
            document.getElementById('end-title').style.color = win ? "#00a8ff" : "#ff4757";
            document.getElementById('final-score').innerText = `최종 점수: ${score}\n처치한 보스: ${bossKills}`;
            if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
        }

        function spawnParticles(x, y, color, count, speedMult = 1) {
            for(let i=0; i<count; i++) { particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 8 * speedMult, vy: (Math.random() - 0.5) * 8 * speedMult, life: 25, maxLife: 25, size: 3 + Math.random()*3, color: color, isAoE: false }); }
        }
        
        function drawPaw(w) {
            ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(0,0,w*0.4,w*0.35,0,0,Math.PI*2); ctx.fill(); 
            ctx.fillStyle='#ff9ff3'; ctx.beginPath(); ctx.arc(0,5,w*0.15,0,Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(-14,-10,w*0.08,0,Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(0,-18,w*0.08,0,Math.PI*2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(14,-10,w*0.08,0,Math.PI*2); ctx.fill(); 
        }

        let lastTime = 0; const frameDelay = 1000/60;
        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if(!lastTime) lastTime = timestamp; let dt = timestamp - lastTime;
            if(dt < frameDelay) return; lastTime = timestamp - (dt % frameDelay);
            if(gameState !== 'PLAYING') return; frameCount++; ctx.clearRect(0,0,canvas.width,canvas.height);

            if (p.lvl_regen > 0 && frameCount % 60 === 0 && p.hp < p.maxHp) { p.hp = Math.min(p.maxHp, p.hp + p.lvl_regen * 2); spawnParticles(p.x, p.y, '#2ecc71', 2); updateUI(); }

            ctx.fillStyle = isBossWarning ? '#300000' : 'white';
            stars.forEach(s => { s.y += isBossStage || isBossWarning || isSwarm ? s.v*3 : s.v; if(s.y > canvas.height) { s.y = -10; s.x = Math.random()*canvas.width; } ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, Math.PI*2); ctx.fill(); });
            ctx.globalAlpha = 1;

            ctx.save();
            if(globalShakeTimer > 0) { ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15); globalShakeTimer--; }
            if(p.skillTimer > 0) { p.skillTimer--; if(p.skillTimer <= 0) { p.skillTimer=0; updateUI(); } else if(p.skillTimer%60===0) updateUI(); }
            if(p.iframe > 0) { p.iframe--; }

            if (!isBossStage && !isBossWarning) {
                bossSpawnTimer--;
                
                if (bossSpawnTimer === 420) { isSwarm = true; swarmWarningTimer = 90; playSound('levelup'); }
                if (bossSpawnTimer === 120) { isSwarm = false; }

                if (bossSpawnTimer <= 0) { 
                    isBossWarning = true; bossWarningTimer = 120; isSwarm = false; 
                } 
                else if (!devStopSpawn) {
                    if (isSwarm && swarmWarningTimer <= 0) {
                        let swarmSpawnRate = bossKills === 0 ? 15 : Math.max(2, Math.floor(12 * Math.pow(0.85, bossKills)));
                        if (frameCount % swarmSpawnRate === 0) {
                            let swarmCount = Math.floor(2 * Math.pow(1.15, bossKills));
                            for(let k=0; k<swarmCount; k++) {
                                let spd = 3.0 + Math.random()*2.0 + (bossKills * 0.2);
                                enemies.push({ x: Math.random()*canvas.width, y: -30, w: 25, h: 25, hp: 1+Math.floor(bossKills/2), speed: spd, isBoss: false, color: '#e67e22' });
                            }
                        }
                    } else if (!isSwarm) {
                        let spawnRate = 45; let hordeCount = 1;
                        if (bossKills === 1) { spawnRate = 35; hordeCount = 2; } 
                        else if (bossKills >= 2) {
                            spawnRate = Math.max(5, Math.floor(30 * Math.pow(0.85, bossKills - 2)));
                            hordeCount = Math.min(25, Math.floor(2 * Math.pow(1.15, bossKills - 2)));
                        }
                        if (frameCount % spawnRate === 0 && enemies.length < 250) { 
                            for(let k=0; k<hordeCount; k++) {
                                let spd = 1.5 + Math.random()*1.5 + (bossKills * 0.15);
                                enemies.push({ x: Math.random()*canvas.width, y: -30 - Math.random()*50, w: 30, h: 30, hp: 1+Math.floor(bossKills/1.5), speed: spd, isBoss: false });
                            }
                        }
                    }
                }
            }

            if (swarmWarningTimer > 0) {
                swarmWarningTimer--;
                ctx.fillStyle = `rgba(230, 126, 34, ${Math.abs(Math.sin(frameCount*0.2))})`; ctx.font = "900 30px Arial"; ctx.textAlign = "center";
                ctx.fillText("적의 대규모 무리 접근 중!", canvas.width/2, canvas.height/4);
            }

            if(isBossWarning) {
                bossWarningTimer--;
                ctx.fillStyle = `rgba(255, 0, 0, ${0.1 + Math.sin(frameCount*0.2)*0.1})`; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = 'red'; ctx.font = "900 60px Arial"; ctx.textAlign = "center"; ctx.globalAlpha = Math.abs(Math.sin(frameCount*0.15));
                ctx.fillText("WARNING", canvas.width/2, canvas.height/2); ctx.globalAlpha = 1;
                let portalAlpha = Math.max(0, (120 - bossWarningTimer) / 120);
                ctx.shadowColor = 'red'; ctx.shadowBlur = 20; ctx.fillStyle = `rgba(150, 0, 0, ${portalAlpha})`;
                ctx.beginPath(); ctx.arc(canvas.width/2, 160, 80 * portalAlpha, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

                if(bossWarningTimer <= 0) {
                    isBossWarning = false; isBossStage = true; bossTimer = 30;
                    enemies = []; bossBullets = [];
                    let bh = 150 * Math.pow(1.25, bossKills);
                    enemies.push({ x: canvas.width/2, y: 160, w: 90, h: 90, hp: bh, maxHp: bh, speed: 0, isBoss: true, iframe: 0 });
                    document.getElementById('boss-timer-display').innerText = `⚠️ 보스 출현! 남은 시간: ${bossTimer}s ⚠️`;
                    document.getElementById('boss-timer-display').style.display = 'block';
                    globalShakeTimer = 40; playSound('kill');
                }
            }

            if (isBossStage && frameCount % 60 === 0) {
                bossTimer--;
                document.getElementById('boss-timer-display').innerText = `⚠️ 보스 출현! 남은 시간: ${bossTimer}s ⚠️`;
                if (bossTimer <= 0) { gameEnd(false); return; }
            }

            // 🕳️ 리얼 블랙홀: 날아가는 검은 구체 & 빨아들이기 효과 (데미지 0)
            for (let i = blackholes.length - 1; i >= 0; i--) {
                let bh = blackholes[i]; 
                bh.life--;
                bh.y += bh.vy; // 탄환처럼 전진
                
                ctx.save(); ctx.translate(bh.x, bh.y); ctx.rotate(frameCount * 0.1);
                
                // 인터스텔라 풍 블랙홀 시각 효과
                let grad = ctx.createRadialGradient(0,0, bh.r*0.2, 0,0, bh.r);
                grad.addColorStop(0, 'rgba(0,0,0,1)');
                grad.addColorStop(0.5, 'rgba(100,0,200,0.5)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, bh.r, 0, Math.PI * 2); ctx.fill();
                
                ctx.beginPath(); ctx.ellipse(0, 0, bh.r*0.6, bh.r*0.2, frameCount*0.05, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(255, 200, 100, 0.8)'; ctx.lineWidth = 4; ctx.stroke();
                
                ctx.beginPath(); ctx.arc(0, 0, bh.r * 0.3, 0, Math.PI * 2); ctx.fillStyle = 'black'; ctx.fill();
                ctx.restore();
                
                // 몹을 강제로 빨아들임
                enemies.forEach(e => {
                    let dx = bh.x - e.x; let dy = bh.y - e.y; let dist = Math.hypot(dx, dy);
                    if (dist < bh.r * 2.5 && !e.isBoss) {
                        e.x += (dx / dist) * 7; 
                        e.y += (dy / dist) * 7;
                        if (dist < bh.r * 0.5) {
                            e.x += Math.cos(frameCount*0.2)*5;
                            e.y += Math.sin(frameCount*0.2)*5;
                        }
                    }
                });
                // 생명력이 다하거나 화면 위로 완전히 넘어가면 소멸
                if (bh.life <= 0 || bh.y < -300) blackholes.splice(i, 1);
            }

            // 🐾 액티브 스킬: 부메랑 / 레이저 / 냥냥펀치 (오리지널 롤백 & 관통 추가)
            for(let i=activeSkills.length-1; i>=0; i--) {
                let sk = activeSkills[i];
                if(sk.type==='boomerang') {
                    if(sk.state==='flying') { 
                        sk.x+=sk.vx; sk.y+=sk.vy; 
                        if(sk.y<-sk.w||sk.x<-sk.w||sk.x>canvas.width+sk.w) {activeSkills.splice(i,1); continue;} 
                    }
                    else { 
                        sk.hoverTimer--; 
                        if(sk.hoverTimer<=0) { 
                            if(sk.level<=p.lvl_boom_split && sk.level<3) {
                                for(let j=0; j<5; j++) activeSkills.push({type:'boomerang', level:sk.level+1, x:sk.x, y:sk.y, w:sk.w*0.6, vx:Math.cos(j*Math.PI*2/5)*12, vy:Math.sin(j*Math.PI*2/5)*12, state:'flying', hoverTimer:0, dmg:sk.dmg}); 
                            }
                            activeSkills.splice(i,1); continue; 
                        } 
                    }
                    ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(frameCount*0.4); ctx.fillStyle='#00d2d3'; ctx.fillRect(-sk.w/2, -8, sk.w, 16); ctx.fillRect(-8, -sk.w/2, 16, sk.w); ctx.restore();
                    
                    let hitAny = false;
                    enemies.forEach(e => { 
                        if(Math.abs(e.x-sk.x)<sk.w/2 && Math.abs(e.y-sk.y)<sk.w/2) { 
                            if (frameCount % 6 === 0) { e.hp -= sk.dmg; hitAny = true; if(e.isBoss) e.iframe = 2; }
                            if(sk.state==='flying'){ sk.state='hovering'; sk.hoverTimer=50; }
                        } 
                    });
                    if (hitAny && frameCount % 6 === 0) playSound('hit');
                } else if(sk.type==='laser') {
                    sk.life--; let lx = p.x + sk.offsetX; ctx.globalAlpha=0.7; ctx.fillStyle='#fff'; ctx.fillRect(lx-20, 0, 40, p.y); ctx.globalAlpha=1;
                    enemies.forEach(e => { if(Math.abs(e.x-lx)<40 && e.y<p.y) { e.hp-=sk.dmg; } });
                    if(sk.life<=0) activeSkills.splice(i, 1);
                } else if(sk.type==='punch') {
                    // 🐾 냥냥펀치 오리지널 롤백 & 분열 무적 관통 부여
                    if(sk.state==='flying') { 
                        sk.x+=sk.vx; sk.y+=sk.vy; 
                        if(Math.abs(sk.vx)>0) sk.angle=Math.atan2(sk.vy, sk.vx)+Math.PI/2; else sk.angle=0; 
                        
                        if (sk.pierceTimer > 0) sk.pierceTimer--;

                        if (sk.pierceTimer <= 0) {
                            let hitAny = false; 
                            enemies.forEach(e=>{ if(Math.abs(e.x-sk.x)<sk.w/2 && Math.abs(e.y-sk.y)<sk.w/2){ hitAny=true; } });
                            // 적에 닿으면 제자리 멈춤 및 난타 시작
                            if(hitAny) { sk.state='punching'; sk.hitTimer=60; }
                        } else {
                            // 관통 중일 때 닿는 적 데미지
                            if (frameCount % 5 === 0) {
                                enemies.forEach(e=>{ if(Math.abs(e.x-sk.x)<sk.w/2 && Math.abs(e.y-sk.y)<sk.w/2){ e.hp -= sk.dmg*0.2; } });
                            }
                        }
                        
                        if(sk.y<-100 || sk.x<-100 || sk.x>canvas.width+100 || sk.y>canvas.height+100) sk.state='done'; 
                        
                        if(sk.state === 'flying') {
                            ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(sk.angle || 0); drawPaw(sk.w * 0.8); ctx.restore(); 
                        }
                    }
                    else if (sk.state==='punching') { 
                        sk.hitTimer--; 
                        if(sk.hitTimer%10===0){
                            playSound('hit'); let aoe = sk.w * 1.5; particles.push({x:sk.x, y:sk.y, vx:0, vy:0, life:15, maxLife:15, size:aoe, color:'rgba(255,159,243,0.8)', isAoE:true});
                            enemies.forEach(e=>{ if(Math.abs(e.x-sk.x)<aoe && Math.abs(e.y-sk.y)<aoe){ e.hp -= sk.dmg*0.4; if(e.isBoss) e.iframe=4; } });
                        }
                        if(sk.hitTimer<=0){
                            // 분열 캡 적용 (p.lvl_punch_split 까지만)
                            if(sk.splitLevel < p.lvl_punch_split) { 
                                for(let j=0; j<2; j++) { 
                                    // 분열 시 30프레임(0.5초) 관통 무적 부여
                                    activeSkills.push({type:'punch', splitLevel: sk.splitLevel+1, x:sk.x, y:sk.y, w:sk.w*0.8, vx:sk.vx+(j===0?-8:8), vy:-10, dmg:sk.dmg, state:'flying', hitTimer: 0, pierceTimer: 30}); 
                                } 
                            }
                            sk.state='done';
                        }
                        if (sk.state !== 'done') {
                            ctx.save(); ctx.translate(sk.x, sk.y); ctx.rotate(sk.angle || 0); 
                            ctx.translate(0, Math.sin(sk.hitTimer*0.8)*20-10); 
                            drawPaw(sk.w); 
                            ctx.restore(); 
                        }
                    }
                    if (sk.state === 'done') { activeSkills.splice(i, 1); }
                }
            }

            // 🗡️ 심판의 검 (환영검 배열 리워크)
            if (p.lvl_sword > 0) {
                p.swordTimer--;
                if (p.swordTimer <= 0) {
                    p.swordTimer = Math.max(60, 240 - p.lvl_sword * 20);
                    if (enemies.length > 0) {
                        let target = enemies.reduce((max, e) => (e.hp > max.hp ? e : max), enemies[0]);
                        if (target) {
                            let swordCount = 3 + p.lvl_sword * 2; // 레벨당 2개씩 증가 (기본 5개)
                            let swordDmg = p.dmg * 20 * (1 + (p.lvl_skill_dmg||0)); // 개별 위력
                            for (let k = 0; k < swordCount; k++) {
                                swords.push({
                                    target: target,
                                    angle: (Math.PI * 2 / swordCount) * k,
                                    orbitRadius: 80,
                                    delay: 30 + k * 8, // 0.5초 후 8프레임 간격으로 순차 발사
                                    state: 'orbit',
                                    dmg: swordDmg,
                                    x: target.x + Math.cos((Math.PI * 2 / swordCount) * k) * 80,
                                    y: target.y + Math.sin((Math.PI * 2 / swordCount) * k) * 80,
                                    hit: false
                                });
                            }
                            playSound('skill');
                        }
                    }
                }
            }

            // 🗡️ 환영검 상태 업데이트 및 렌더링
            for (let i = swords.length - 1; i >= 0; i--) {
                let s = swords[i];
                
                // 타겟이 죽었거나 없으면 가장 가까운 적을 새로 탐색 (딜 낭비 방지)
                if (!s.target || s.target.hp <= 0 || !enemies.includes(s.target)) {
                    let closestDist = Infinity; let closestE = null;
                    for(let j=0; j<enemies.length; j++) { 
                        let dist = Math.hypot(enemies[j].x - s.x, enemies[j].y - s.y); 
                        if (dist < closestDist) { closestDist = dist; closestE = enemies[j]; } 
                    }
                    s.target = closestE;
                    if (!s.target) s.state = 'strike'; // 적이 아예 없으면 그냥 돌진 후 소멸
                }

                let angleToTarget = s.angle;

                if (s.state === 'orbit') {
                    if (s.target) {
                        s.angle += 0.1; 
                        let targetX = s.target.x + Math.cos(s.angle) * s.orbitRadius;
                        let targetY = s.target.y + Math.sin(s.angle) * s.orbitRadius;
                        s.x += (targetX - s.x) * 0.3; // 부드럽게 타겟 주변으로 이동
                        s.y += (targetY - s.y) * 0.3;
                        angleToTarget = Math.atan2(s.target.y - s.y, s.target.x - s.x);
                    }
                    s.delay--;
                    if (s.delay <= 0) s.state = 'strike';
                } 
                else if (s.state === 'strike') {
                    if (s.target) {
                        let dx = s.target.x - s.x; let dy = s.target.y - s.y;
                        let dist = Math.hypot(dx, dy);
                        angleToTarget = Math.atan2(dy, dx);
                        
                        s.x += Math.cos(angleToTarget) * 30; // 매우 빠른 속도로 꽂힘
                        s.y += Math.sin(angleToTarget) * 30;
                        
                        if (dist < s.target.w/2 + 20) {
                            s.target.hp -= s.dmg;
                            s.hit = true;
                            playSound('hit');
                            spawnParticles(s.x, s.y, '#f39c12', 15, 2);
                            if(s.target.isBoss) s.target.iframe = 2;
                        }
                    } else {
                        // 타겟이 없으면 직진
                        s.x += Math.cos(s.angle) * 30;
                        s.y += Math.sin(s.angle) * 30;
                        if(s.x < -100 || s.x > canvas.width+100 || s.y < -100 || s.y > canvas.height+100) s.hit = true;
                    }
                }

                // 얇은 환영검 렌더링
                if (!s.hit) {
                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(angleToTarget + Math.PI/2); 
                    
                    ctx.shadowColor = '#f39c12'; ctx.shadowBlur = 10;
                    ctx.fillStyle = '#fff';
                    
                    // 칼날
                    ctx.beginPath();
                    ctx.moveTo(0, -25); 
                    ctx.lineTo(4, 10);  
                    ctx.lineTo(-4, 10); 
                    ctx.closePath();
                    ctx.fill();
                    
                    // 코등이 & 손잡이
                    ctx.fillStyle = '#f39c12';
                    ctx.fillRect(-8, 10, 16, 3);
                    ctx.fillRect(-2, 13, 4, 8);
                    
                    ctx.restore();
                } else {
                    swords.splice(i, 1);
                }
            }

            if(p.lvl_orbital > 0) {
                p.orbitalTimer--;
                if(p.orbitalTimer <= 0) {
                    p.orbitalTimer = Math.max(120, 360 - p.lvl_orbital*30);
                    let t = enemies.find(e => e.isBoss) || enemies[Math.floor(Math.random()*enemies.length)];
                    if(t) orbitals.push({ x: t.x, y: t.y, timer: 90, state: 'aim', r: 60+p.lvl_orbital_range*20 });
                }
            }
            for (let i = orbitals.length - 1; i >= 0; i--) {
                let o = orbitals[i];
                if(o.state === 'aim') {
                    o.timer--; ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(frameCount * 0.1);
                    ctx.strokeStyle='red'; ctx.lineWidth=3; ctx.beginPath(); let r = Math.max(0.1, o.r*(o.timer/90+0.5)); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.stroke(); ctx.restore();
                    if(o.timer<=0) { o.state='fire'; o.timer=40; globalShakeTimer=30; playSound('skill'); }
                } else {
                    o.timer--; let a = Math.max(0, o.timer/40); 
                    ctx.fillStyle=`rgba(0,255,255,${a})`; ctx.fillRect(o.x-o.r, 0, o.r*2, canvas.height);
                    enemies.forEach(e => { if(Math.abs(e.x-o.x) < o.r + e.w/2) e.hp -= (p.dmg * 10 * (1 + (p.lvl_skill_dmg||0) * 0.5)); });
                    if(o.timer<=0) orbitals.splice(i, 1);
                }
            }

            if(p.lvl_shuriken_active) {
                if(frameCount % 60 === 0 && shurikens.filter(s=>s.state==='orbit').length < p.shurikenLimit) {
                    shurikens.push({ x: p.x, y: p.y, spin: 0, state: 'orbit', vx: 0, vy: 0, hitLog: new Map() });
                }
                let orb = shurikens.filter(s=>s.state==='orbit');
                if(orb.length > 0 && orb.length >= p.shurikenLimit) orb.forEach(s => {
                    let t = enemies.find(e=>e.isBoss) || enemies[0];
                    if(t) { let dx=t.x-s.x, dy=t.y-s.y, d=Math.sqrt(dx*dx+dy*dy); s.vx=(dx/d)*18; s.vy=(dy/d)*18; } else { s.vx=0; s.vy=-18; }
                    s.state='pierce';
                });
            }
            for(let i=shurikens.length-1; i>=0; i--) {
                let s = shurikens[i];
                if(s.state === 'orbit') {
                    let idx = shurikens.filter(sh=>sh.state==='orbit').indexOf(s); let total = Math.max(1, shurikens.filter(sh=>sh.state==='orbit').length);
                    let ang = (frameCount*0.1) + (idx*Math.PI*2/total); s.x = p.x + Math.cos(ang)*85; s.y = p.y + Math.sin(ang)*85; s.spin += 0.3;
                } else {
                    s.x += s.vx; s.y += s.vy; s.spin += 0.6;
                    enemies.forEach(e => {
                        if(Math.abs(e.x-s.x) < e.w/2+15 && Math.abs(e.y-s.y) < e.h/2+15) {
                            let hits = s.hitLog.get(e) || 0;
                            if(hits < 3) {
                                s.vx *= 0.65; s.vy *= 0.65; 
                                e.hp -= (p.dmg * 0.5 * (1 + (p.lvl_skill_dmg||0) * 0.3)); 
                                s.hitLog.set(e, hits+1);
                                if(frameCount%5===0) spawnParticles(s.x, s.y, '#f1c40f', 1); 
                            }
                        }
                    });
                    if(s.x<-50||s.x>canvas.width+50||s.y<-50||s.y>canvas.height+50) shurikens.splice(i, 1);
                }
                if(shurikens[i]) {
                    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.spin); ctx.fillStyle='#f1c40f'; ctx.beginPath();
                    for(let j=0; j<4; j++) { ctx.lineTo(16,0); ctx.lineTo(4,4); ctx.rotate(Math.PI/2); } ctx.fill(); ctx.restore();
                }
            }

            let targetX = Math.max(20, Math.min(canvas.width-20, window.mouseX_val));
            p.vx = (targetX - p.x)*0.25; p.x += p.vx;
            
            // 🔫 샷건 발사 (부채꼴 확산 스케일링 상향)
            if(frameCount%p.fireDelay === 0) {
                playSound('shoot'); 
                let totalBullets = p.bulletSpread * p.bulletMultiplier;
                // 확산 각도 범위 (최대 120도 부채꼴)
                let maxSpreadAngle = Math.min(Math.PI * 0.8, (totalBullets * 0.15)); 
                
                for(let j=0; j<totalBullets; j++) {
                    p.totalFired++; 
                    let angleOffset = totalBullets > 1 ? (j - (totalBullets-1)/2) * (maxSpreadAngle / totalBullets) : 0;
                    let bvx = Math.sin(angleOffset) * 15 + p.vx * 0.15; 
                    let bvy = -Math.cos(angleOffset) * 15;

                    // 🕳️ 블랙홀 시드 발사 판정
                    let isBhSeed = (p.bh_chance > 0 && Math.random() < p.bh_chance);
                    let isEnhanced = (p.lvl_homing > 0 && p.totalFired % 3 === 0);
                    let enhancedDmg = p.dmg * 2.0 * (1 + (p.lvl_skill_dmg||0) * 0.5);
                    
                    let bColor = isBhSeed ? '#111' : (isEnhanced ? '#00ffff' : '#f1c40f');
                    let bRadius = isBhSeed ? 10 : (isEnhanced ? 8 : 6);

                    bullets.push({ 
                        x: p.x, y: p.y - 20, 
                        vx: bvx, vy: bvy,
                        dmg: isEnhanced ? enhancedDmg : p.dmg, 
                        enhanced: isEnhanced, color: bColor, r: bRadius,
                        pierce: p.lvl_pierce || 0, hitLog: new Map(),
                        isBhSeed: isBhSeed
                    });
                }
            }

            for(let i=bullets.length-1; i>=0; i--) {
                let b = bullets[i]; b.x+=b.vx; b.y+=b.vy; 
                
                if(b.isBhSeed) {
                    ctx.save();
                    ctx.shadowBlur = 10; ctx.shadowColor = 'purple';
                    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = 'purple'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.restore();
                } else {
                    ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
                }
                
                let removed = false;
                for(let j=0; j<enemies.length; j++){
                    let e = enemies[j];
                    if(!b.hitLog.has(e) && Math.abs(b.x-e.x)<e.w/2 && Math.abs(b.y-e.y)<e.h/2) {
                        
                        // 🕳️ 블랙홀 시드 적중 시 개화
                        if (b.isBhSeed) {
                            let bh_radius = 120 + p.lvl_blackhole * 30; 
                            let bh_life = 60 + p.lvl_blackhole * 20;
                            blackholes.push({x: b.x, y: b.y, r: bh_radius, life: bh_life, maxLife: bh_life, dmg: 0, vy: -1.5});
                            playSound('bh_spawn');
                            bullets.splice(i, 1); removed = true; break;
                        }

                        e.hp -= b.dmg; b.hitLog.set(e, true); playSound('hit');
                        
                        if (b.enhanced) {
                            playSound('zap');
                            let homingDmg = p.dmg * (0.8 + p.lvl_homing * 0.5) * (1 + (p.lvl_skill_dmg||0) * 0.5);
                            for(let k=0; k<p.homing_split; k++) {
                                let angle = Math.random() * Math.PI * 2;
                                homingBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle)*6, vy: Math.sin(angle)*6, dmg: homingDmg, target: null, life: 120, pierce: 2, ignore: e, hitLog: new Map() });
                            }
                        }
                        if(p.lvl_lightning > 0 && Math.random() < p.lightning_chance) {
                            playSound('zap');
                            let ld = (p.dmg * 2.0) * (1 + (p.lvl_skill_dmg||0) * 0.5); 
                            let jumps = 1 + p.lvl_lightning; 
                            let lx = e.x, ly = e.y;
                            for(let k=0; k<jumps; k++) {
                                if(enemies.length === 0) break;
                                let target = enemies[Math.floor(Math.random() * enemies.length)];
                                lightnings.push({x1: lx, y1: ly, x2: target.x, y2: target.y, life: 15, dmg: ld, hitDone: false});
                                lx = target.x; ly = target.y;
                            }
                        }
                        
                        if(b.pierce <= 0) {
                            bullets.splice(i, 1); removed = true; break;
                        } else {
                            b.pierce--; 
                        }
                    }
                }
                if(!removed && (b.y<-50||b.y>canvas.height+50||b.x<-50||b.x>canvas.width+50)) bullets.splice(i, 1);
            }

            for (let i = homingBullets.length - 1; i >= 0; i--) {
                let hb = homingBullets[i]; hb.life--;
                
                if (!hb.target || hb.target.hp <= 0 || !enemies.includes(hb.target)) {
                    let closestDist = Infinity; let closestE = null;
                    for(let j=0; j<enemies.length; j++) { if (enemies[j] !== hb.ignore && !hb.hitLog.has(enemies[j])) { let dist = Math.hypot(enemies[j].x - hb.x, enemies[j].y - hb.y); if (dist < closestDist) { closestDist = dist; closestE = enemies[j]; } } }
                    hb.target = closestE;
                }
                if (hb.target) {
                    let dx = hb.target.x - hb.x; let dy = hb.target.y - hb.y; let dist = Math.max(1, Math.hypot(dx, dy));
                    hb.vx += (dx/dist) * 2.0; hb.vy += (dy/dist) * 2.0; 
                    let speed = Math.hypot(hb.vx, hb.vy); if (speed > 8) { hb.vx = (hb.vx/speed)*8; hb.vy = (hb.vy/speed)*8; }
                }
                hb.x += hb.vx; hb.y += hb.vy;
                ctx.fillStyle = '#00ffff'; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 5; ctx.beginPath(); ctx.arc(hb.x, hb.y, 5, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
                for (let j=0; j<enemies.length; j++) {
                    let e = enemies[j];
                    if (e !== hb.ignore && !hb.hitLog.has(e) && Math.abs(hb.x - e.x) < e.w/2 + 5 && Math.abs(hb.y - e.y) < e.h/2 + 5) {
                        e.hp -= hb.dmg; hb.hitLog.set(e, true); hb.pierce--; hb.target = null; spawnParticles(e.x, e.y, '#00ffff', 3); 
                    }
                }
                if (hb.pierce <= 0 || hb.life <= 0 || hb.y < -50 || hb.y > canvas.height+50 || hb.x < -50 || hb.x > canvas.width+50) homingBullets.splice(i, 1);
            }

            for (let i = lightnings.length - 1; i >= 0; i--) {
                let l = lightnings[i]; 
                if (!l.hitDone) {
                    l.hitDone = true;
                    let vx = l.x2 - l.x1; let vy = l.y2 - l.y1; let len2 = vx*vx + vy*vy;
                    if(len2 > 0) {
                        enemies.forEach(en => {
                            let wx = en.x - l.x1; let wy = en.y - l.y1;
                            let t = Math.max(0, Math.min(1, (wx*vx + wy*vy) / len2)); 
                            let cx = l.x1 + t*vx; let cy = l.y1 + t*vy;
                            if (Math.hypot(en.x - cx, en.y - cy) < en.w/2 + 20) { 
                                en.hp -= l.dmg; if(Math.random()<0.5) spawnParticles(en.x, en.y, '#00ffff', 1);
                            }
                        });
                    }
                }
                l.life--;
                ctx.strokeStyle = `rgba(0, 255, 255, ${Math.max(0, l.life/15)})`; ctx.lineWidth = 4; ctx.beginPath();
                ctx.moveTo(l.x1, l.y1); ctx.lineTo((l.x1+l.x2)/2 + (Math.random()-0.5)*30, (l.y1+l.y2)/2 + (Math.random()-0.5)*30); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                if (l.life <= 0) lightnings.splice(i, 1);
            }

            if (p.lvl_storm > 0) {
                let sk_r = 60 + p.lvl_storm * 20; 
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(frameCount * 0.15);
                ctx.globalAlpha = 0.6; ctx.strokeStyle = '#00a8ff'; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(0, 0, sk_r, 0, Math.PI * 2); ctx.stroke();
                
                for(let j=0; j<4; j++) {
                    ctx.save(); ctx.rotate((Math.PI*2/4)*j); 
                    ctx.fillStyle = '#fff'; ctx.beginPath(); 
                    ctx.moveTo(sk_r-10, 0); ctx.lineTo(sk_r+10, -25); ctx.lineTo(sk_r+30, 0); ctx.fill(); 
                    ctx.restore(); 
                }
                ctx.fillStyle = 'rgba(0, 168, 255, 0.15)'; ctx.beginPath(); ctx.arc(0, 0, sk_r, 0, Math.PI * 2); ctx.fill(); 
                ctx.restore();
                
                if (frameCount % 15 === 0) {
                    let stormDmg = p.dmg * 1.5 * (1 + (p.lvl_skill_dmg||0) * 0.5) * p.lvl_storm; 
                    enemies.forEach(e => {
                        if (Math.hypot(e.x - p.x, e.y - p.y) < sk_r + e.w/2) {
                            e.hp -= stormDmg; 
                            e.y -= 15; 
                            e.x += (e.x > p.x ? 10 : -10); 
                            if(e.isBoss) e.iframe = 4;
                            spawnParticles(e.x, e.y, '#00a8ff', 2);
                        }
                    });
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; 
                
                if(e.isBoss) {
                    if (frameCount % Math.max(30, 90 - bossKills * 3) === 0) {
                        playSound('boss_shoot');
                        let dx = p.x - e.x; let dy = p.y - e.y; let angle = Math.atan2(dy, dx);
                        let bulletCount = 3 + Math.floor(bossKills/3); 
                        let spread = 0.2 + Math.min(0.3, bossKills*0.02);
                        for(let a = 0; a < bulletCount; a++) {
                            let currentAngle = angle - spread*(bulletCount-1)/2 + a*spread; 
                            let speed = 5 + bossKills * 0.2; 
                            bossBullets.push({ x: e.x, y: e.y + e.h/2, vx: Math.cos(currentAngle) * speed, vy: Math.sin(currentAngle) * speed, r: 7, color: '#ff4757', dmg: 10 + bossKills * 2 });
                        }
                    }
                } else { e.y += e.speed; }

                if(e.isBoss && e.iframe > 0) e.iframe--;
                
                let drawn = false;
                if(customEnemyImg && customEnemyImg.complete && !e.isBoss) { ctx.drawImage(customEnemyImg, e.x-e.w/2, e.y-e.h/2, e.w, e.h); drawn=true; }
                
                if(!drawn) {
                    if (e.isBoss) {
                        ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(frameCount*0.05); ctx.fillStyle = '#8e44ad'; ctx.shadowColor = '#d980fa'; ctx.shadowBlur = 20;
                        ctx.beginPath(); ctx.roundRect(-e.w/2, -e.h/2, e.w, e.h, 15); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(0,0, e.w/4, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.arc(0,0, e.w/4 * (0.5 + Math.sin(frameCount*0.1)*0.5), 0, Math.PI*2); ctx.fill(); ctx.restore();
                    } else {
                        ctx.save(); let grad = ctx.createLinearGradient(e.x, e.y-e.h/2, e.x, e.y+e.h/2); grad.addColorStop(0, e.color || '#ff4757'); grad.addColorStop(1, '#111'); ctx.fillStyle = grad;
                        ctx.beginPath(); ctx.roundRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h, 6); ctx.fill();
                        ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.roundRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h*0.2, [6, 6, 0, 0]); ctx.fill();
                        ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(Math.ceil(e.hp), e.x, e.y); ctx.restore();
                    }
                }

                if(e.isBoss) { ctx.fillStyle='#333'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w, 8); ctx.fillStyle='#ff4757'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-15, e.w*Math.max(0, e.hp/e.maxHp), 8); }
                
                if(e.hp<=0) { 
                    playSound('kill'); score+=e.isBoss?1000:10; 
                    if (p.lvl_vampire > 0 && Math.random() < p.vampire_chance && p.hp < p.maxHp) { p.hp = Math.min(p.maxHp, p.hp + 1 + p.lvl_vampire); spawnParticles(p.x, p.y, '#2ecc71', 2); playSound('heal'); updateUI(); }
                    
                    spawnParticles(e.x,e.y,e.isBoss?'#8e44ad':(e.color || '#ff4757'), e.isBoss?40:10); 

                    if(e.isBoss){
                        bossKills++; isBossStage=false; document.getElementById('boss-timer-display').style.display='none'; 
                        bossSpawnTimer = BOSS_SPAWN_INTERVAL;
                        if(bossKills>=WIN_CONDITION) {gameEnd(true); return;} else {p.exp+=p.maxExp; updateUI();}
                    } else { 
                        p.exp += (2 + Math.floor(bossKills / 2)); 
                    }
                    enemies.splice(i,1); if(p.exp>=p.maxExp) triggerLevelUp(); updateUI(); 
                }
                else if(e.y > canvas.height+50) { p.hp-=e.isBoss?50:5; enemies.splice(i,1); updateUI(); if(p.hp<=0) {gameEnd(false); return;} }
            }

            for (let i = bossBullets.length - 1; i >= 0; i--) {
                let bb = bossBullets[i]; bb.x += bb.vx; bb.y += bb.vy;
                ctx.fillStyle = bb.color; ctx.shadowColor = bb.color; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bb.x, bb.y, bb.r/2, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

                if (p.iframe <= 0 && Math.abs(bb.x - p.x) < p.w/2 && Math.abs(bb.y - p.y) < p.h/2) {
                    p.hp -= bb.dmg; p.iframe = 30; spawnParticles(p.x, p.y, '#ff0000', 15, 2); globalShakeTimer = 10; playSound('hit'); updateUI(); bossBullets.splice(i, 1);
                    if (p.hp <= 0) { gameEnd(false); return; } continue;
                }
                if(bb.y > canvas.height + 50 || bb.x < -50 || bb.x > canvas.width + 50) bossBullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i]; pt.life--; pt.x += pt.vx; pt.y += pt.vy; let lifeRatio = Math.max(0, pt.life / (pt.maxLife || 25)); ctx.globalAlpha = lifeRatio;
                if (pt.isAoE) { ctx.strokeStyle = pt.color; ctx.lineWidth = 3; ctx.beginPath(); let r = Math.max(0.1, pt.size * (1 - lifeRatio)); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.stroke(); } 
                else { ctx.fillStyle = pt.color; ctx.beginPath(); let r = Math.max(0.1, pt.size * lifeRatio); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill(); }
                ctx.globalAlpha = 1; if (pt.life <= 0) particles.splice(i, 1);
            }

            if (!(p.iframe > 0 && Math.floor(frameCount / 5) % 2 === 0)) {
                let dp = false;
                if(customPlayerImg && customPlayerImg.complete) { ctx.drawImage(customPlayerImg, p.x - p.w/2, p.y - p.h/2, p.w, p.h); dp=true; }
                if(!dp) {
                    ctx.save(); let grad = ctx.createLinearGradient(p.x, p.y-p.h/2, p.x, p.y+p.h/2); grad.addColorStop(0, '#00a8ff'); grad.addColorStop(1, '#111'); ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h, 6); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.roundRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h*0.2, [6, 6, 0, 0]); ctx.fill(); ctx.restore();
                }
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
