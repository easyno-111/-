<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Survivor v0.9.0</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #112211; color: #fff; overflow: hidden; font-family: 'Pretendard', sans-serif; touch-action: none; user-select: none; }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .version { position: absolute; top: 15px; left: 15px; font-size: 14px; color: rgba(255,255,255,0.6); font-weight: bold; }
        #devTrigger { position: absolute; top: 0; right: 0; width: 80px; height: 80px; pointer-events: auto; z-index: 99; cursor: crosshair; }

        #topBar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 10; }
        #timer { font-size: 32px; font-weight: 900; font-family: monospace; background: rgba(0,0,0,0.6); padding: 5px 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        #bossTimerContainer { color: #ff4444; font-size: 20px; font-weight: bold; margin-top: 8px; background: rgba(40,0,0,0.8); padding: 4px 15px; border-radius: 10px; border: 1px solid #f00; display: none; }
        #warningMessage { position: absolute; top: 25%; left: 50%; transform: translateX(-50%); font-size: 40px; color: #ff3333; font-weight: 900; text-shadow: 0 0 20px rgba(255,0,0,0.8); opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.7); padding: 10px 30px; border-radius: 15px; z-index: 10; }

        #bottomUI { position: absolute; bottom: 0; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); z-index: 10; }
        #activeSkillsPanel { display: flex; gap: 8px; margin-bottom: 15px; }
        .skill-slot { width: 40px; height: 40px; background: rgba(0,0,0,0.6); border: 2px solid #555; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 20px; position: relative; box-shadow: 0 0 5px #000; }
        .skill-slot .lvl { position: absolute; bottom: -5px; right: -5px; background: #000; font-size: 10px; padding: 2px 4px; border-radius: 4px; border: 1px solid #ffcc00; color: #ffcc00; font-weight: bold; }
        #hpBarContainer { width: 250px; height: 18px; background: rgba(0,0,0,0.8); border: 2px solid #222; border-radius: 10px; overflow: hidden; margin-bottom: 10px; box-shadow: 0 0 10px rgba(255,0,0,0.2); }
        #hpFill { width: 100%; height: 100%; background: linear-gradient(90deg, #aa0000, #ff4444); transition: width 0.2s ease-out; }
        #xpSection { width: 100%; display: flex; align-items: center; padding: 0 20px; box-sizing: border-box; }
        #levelText { font-size: 22px; font-weight: 900; margin-right: 15px; color: #44aaff; text-shadow: 0 2px 4px #000; }
        #xpBarContainer { flex-grow: 1; height: 12px; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 6px; overflow: hidden; }
        #xpFill { width: 0%; height: 100%; background: linear-gradient(90deg, #0055aa, #44aaff); transition: width 0.2s linear; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10,15,10,0.85); backdrop-filter: blur(8px); pointer-events: auto; z-index: 100; }
        h1 { font-size: 48px; margin-bottom: 20px; letter-spacing: 3px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .diff-selector { margin-bottom: 30px; font-size: 20px; font-weight: bold; color: #ffcc00; background: rgba(0,0,0,0.5); padding: 15px 30px; border-radius: 15px; border: 1px solid #555; }
        .diff-selector label { margin: 0 10px; cursor: pointer; color: #fff; }
        .btn { background: linear-gradient(135deg, #2a2a3a, #1a1a2a); border: 1px solid #444; color: #fff; padding: 15px 30px; margin: 10px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: all 0.2s; width: 280px; }
        .btn:hover { background: linear-gradient(135deg, #3a3a4a, #2a2a3a); border-color: #888; transform: translateY(-2px); }
        .hidden { display: none !important; }

        #skillContainer { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1000px; }
        .skill-card { background: rgba(30,40,30,0.9); border: 2px solid #44aa44; border-radius: 16px; padding: 25px; width: 280px; cursor: pointer; text-align: left; transition: all 0.2s; position: relative; }
        .skill-card.active-type { border-color: #aa44ff; }
        .skill-card:hover { transform: scale(1.05) translateY(-5px); border-color: #fff; box-shadow: 0 12px 25px rgba(255,255,255,0.2); }
        .skill-title { font-size: 20px; font-weight: 900; color: #66ff66; display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .active-type .skill-title { color: #aa44ff; }
        .skill-desc { font-size: 14px; color: #ccc; line-height: 1.4; }

        #devPanel { background: rgba(15,10,20,0.95); border: 2px solid #aa44ff; border-radius: 15px; padding: 30px; width: 500px; max-height: 85%; overflow-y: auto; text-align: left; }
        .dev-row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; font-size: 14px; }
        .dev-btn { background: #333; color: #fff; border: 1px solid #666; padding: 4px 12px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .dev-close { background: linear-gradient(135deg, #aa3333, #882222); color: #fff; width: 100%; padding: 15px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
        <div class="version">v0.9.0</div>
        <div id="devTrigger" onclick="checkDevMode()"></div>

        <div id="topBar">
            <div id="timer">00:00</div>
            <div id="bossTimerContainer">보스 타임어택: <span id="bossTimer">60</span>초!</div>
        </div>
        <div id="warningMessage">⚠️ 중간 보스 접근 ⚠️</div>

        <div id="bottomUI">
            <div id="activeSkillsPanel">
                <div class="skill-slot" id="slot-0"></div><div class="skill-slot" id="slot-1"></div><div class="skill-slot" id="slot-2"></div><div class="skill-slot" id="slot-3"></div>
                <div class="skill-slot" id="slot-4"></div><div class="skill-slot" id="slot-5"></div><div class="skill-slot" id="slot-6"></div><div class="skill-slot" id="slot-7"></div>
            </div>
            <div id="hpBarContainer"><div id="hpFill"></div></div>
            <div id="xpSection">
                <div id="levelText">LV. 1</div>
                <div id="xpBarContainer"><div id="xpFill"></div></div>
            </div>
        </div>
        
        <div id="menuScreen" class="overlay">
            <h1>SPACE SURVIVOR</h1>
            <div class="diff-selector">
                난이도 선택: 
                <label><input type="radio" name="difficulty" value="0.7"> Easy</label>
                <label><input type="radio" name="difficulty" value="1.0" checked> Normal</label>
                <label><input type="radio" name="difficulty" value="1.5"> Hard</label>
            </div>
            <button class="btn" onclick="startGame('melee')">🗡️ 근접 요원</button>
            <button class="btn" onclick="startGame('ranged')">🏹 원거리 저격수</button>
            <button class="btn" onclick="startGame('magic')">✨ 초능력술사</button>
        </div>

        <div id="levelUpScreen" class="overlay hidden">
            <h2 id="lvlUpTitle" style="color: #ffcc00; font-size: 36px; text-shadow: 0 0 20px rgba(255,200,0,0.5); margin-bottom: 30px;">LEVEL UP!</h2>
            <div id="skillContainer"></div>
        </div>

        <div id="devScreen" class="overlay hidden">
            <div id="devPanel">
                <h2 style="color: #dd88ff; text-align: center; margin-top: 0;">🛠️ DEV MODE</h2>
                <div class="dev-row" style="background: rgba(255,0,0,0.1); padding: 10px; border-radius: 8px;">
                    <label><input type="checkbox" id="devSpawnToggle" onchange="toggleSpawn(this)"> 적 스폰 중지</label>
                    <button class="dev-btn" style="background:#cc3333;" onclick="killAllEnemies()">즉시 소탕 (Kill All)</button>
                </div>
                <h3 style="font-size: 14px; margin-top: 15px; border-bottom: 1px solid #444;">스킬/스탯 조작 (패시브)</h3>
                <div id="devPassivesContainer"></div>
                <h3 style="font-size: 14px; margin-top: 15px; border-bottom: 1px solid #444; color:#aa44ff;">스킬 조작 (액티브 - 최대 8칸)</h3>
                <div id="devActivesContainer"></div>
                <button class="dev-close" onclick="closeDevMode()">닫기 (게임 재개)</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay hidden">
            <h1 style="color: #ff4444;">MISSION FAILED</h1>
            <h2 id="survivalTimeResult" style="color: #aaa; margin-bottom: 40px;">버틴 시간: 00:00</h2>
            <button class="btn" onclick="location.reload()">재도전</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d', { alpha: false }); let width, height;

const ui = {
    timer: document.getElementById('timer'), bossTimerContainer: document.getElementById('bossTimerContainer'), bossTimer: document.getElementById('bossTimer'),
    warning: document.getElementById('warningMessage'), xpFill: document.getElementById('xpFill'), levelText: document.getElementById('levelText'), hpFill: document.getElementById('hpFill'),
    menu: document.getElementById('menuScreen'), levelUp: document.getElementById('levelUpScreen'), lvlUpTitle: document.getElementById('lvlUpTitle'), skillContainer: document.getElementById('skillContainer'),
    gameOver: document.getElementById('gameOverScreen'), result: document.getElementById('survivalTimeResult'), devScreen: document.getElementById('devScreen'), 
    devPassivesContainer: document.getElementById('devPassivesContainer'), devActivesContainer: document.getElementById('devActivesContainer')
};

const FPS = 60; const frameInterval = 1000 / FPS; let lastTime = 0;
let gameState = 'menu'; let frameCount = 0; let gameSeconds = 0; let worldX = 0, worldY = 0;
let enemies = []; let projectiles = []; let effects = []; let gems = []; let drops = []; let grasses = [];
let waveWarningTimer = 0; let bossMode = false; let bossTimeLeft = 0; let activeMagnet = 0;
let difficultyMult = 1.0;

let devConfig = { spawnPaused: false };
const joystick = { active: false, originX: 0, originY: 0, x: 0, y: 0, dx: 0, dy: 0, radius: 40 };

const passiveSkills = {
    weaponUpgrade:{ level: 0, max: 5, icon: "🔥", name: "특화 무기 진화", desc: "직업 고유의 평타가 강화됩니다. (범위/타수 등 증가)" }, // 🚀 신규 평타 강화 패시브
    attackPower:  { level: 0, max: 8, icon: "⚔️", name: "공격력 증가", desc: "모든 공격과 스킬 데미지가 상승합니다." },
    attackSpeed:  { level: 0, max: 8, icon: "⚡", name: "공격속도 증가", desc: "모든 스킬의 쿨타임이 감소합니다." },
    knockback:    { level: 0, max: 8, icon: "🛡️", name: "넉백 증가", desc: "기본 공격의 넉백이 늘어납니다." },
    hpRegen:      { level: 0, max: 8, icon: "💚", name: "체력 회복력", desc: "초당 체력이 서서히 회복됩니다." },
    lifeSteal:    { level: 0, max: 8, icon: "🦇", name: "체력 흡수", desc: "적 처치 시 체력을 회복합니다." },
    xpGain:       { level: 0, max: 8, icon: "📈", name: "경험치 획득량", desc: "경험치 획득량이 증가합니다." },
    magnet:       { level: 0, max: 8, icon: "🧲", name: "자석 범위 증가", desc: "경험치 획득 범위가 파멸적으로 넓어집니다." },
    moveSpeed:    { level: 0, max: 8, icon: "👟", name: "이동속도 증가", desc: "이동 속도가 빨라집니다." }
};

const activeSkills = {
    missile:    { level: 0, max: 5, icon: "🚀", name: "유도 미사일", desc: "적을 쫓아가는 미사일을 발사합니다." },
    shield:     { level: 0, max: 5, icon: "🌀", name: "수호 방패", desc: "5바퀴를 돌며 적을 강하게 튕겨내는 방패를 생성합니다." },
    bomb:       { level: 0, max: 5, icon: "💣", name: "폭탄", desc: "폭발 시 4개의 파편으로 분열하여 광역 피해를 줍니다." },
    shuriken:   { level: 0, max: 5, icon: "⭐", name: "수리검", desc: "적(보스 우선)에게 날아가 박힌 후 미친듯이 갈아버립니다." }, // 🚀 개편
    dove:       { level: 0, max: 5, icon: "🕊️", name: "비둘기", desc: "주위를 맴돌며 미사일을 쏘는 비둘기 소환." },
    laser:      { level: 0, max: 5, icon: "🔦", name: "레이저 빔", desc: "가장 가까운 적에게 직선 관통 레이저 발사." },
    poison:     { level: 0, max: 5, icon: "🧪", name: "맹독 지대", desc: "광범위 지역에 최대 체력 비례 데미지를 주는 독 장판 생성." },
    lightning:  { level: 0, max: 5, icon: "🌩️", name: "낙뢰", desc: "무작위 적에게 강력한 벼락을 내리칩니다." },
    nova:       { level: 0, max: 5, icon: "❄️", name: "서리 폭발", desc: "캐릭터 중심으로 얼음 파동이 터져나옵니다." },
    boomerang:  { level: 0, max: 5, icon: "🪃", name: "부메랑", desc: "던지면 되돌아오는 관통 부메랑을 던집니다." }
};
let myActiveSlots = []; 

const charSpecs = {
    melee: { color: '#ff5555', range: 120, fireCooldown: 50, speed: 3.5, damage: 30, knockback: 15, baseMagnet: 100 },
    ranged: { color: '#55ff55', range: 300, fireCooldown: 25, speed: 3.0, damage: 15, knockback: 5, baseMagnet: 100 },
    magic: { color: '#aa55ff', range: 220, fireCooldown: 60, speed: 2.8, damage: 25, knockback: 10, baseMagnet: 100 }
};

const player = { 
    type: 'melee', color: '#fff', size: 15, angle: -Math.PI/2, 
    maxHp: 100, hp: 100, level: 1, xp: 0, maxXp: 30, attackCount: 0,
    speed: 0, range: 0, fireCooldown: 0, currentCooldown: 0, damage: 0, knockback: 0, magnetRange: 100,
    bonusDmg: 0, cdr: 1.0 
};

let activeTimers = { missile: 0, shield: 0, bomb: 0, shuriken: 0, dove: 0, laser: 0, poison: 0, lightning: 0, nova: 0, boomerang: 0 };
let dovesState = []; 

function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; initGrass(); }
window.addEventListener('resize', resize); resize();
function initGrass() { grasses = []; for (let i = 0; i < 200; i++) grasses.push({ x: Math.random()*width*1.5, y: Math.random()*height*1.5, length: Math.random()*8+4 }); }
function getDistSq(x1, y1, x2, y2) { const dx = x1 - x2; const dy = y1 - y2; return dx * dx + dy * dy; }

function recalcStats() {
    const base = charSpecs[player.type];
    player.bonusDmg = passiveSkills.attackPower.level * 5; 
    player.cdr = Math.max(0.4, 1.0 - (passiveSkills.attackSpeed.level * 0.06)); 

    player.damage = base.damage + player.bonusDmg; 
    player.fireCooldown = Math.max(5, base.fireCooldown * player.cdr);
    player.knockback = base.knockback + (passiveSkills.knockback.level * 3);
    player.speed = base.speed + (passiveSkills.moveSpeed.level * 0.4);
    player.magnetRange = base.baseMagnet + (passiveSkills.magnet.level * 80);

    // 🚀 특화 무기 진화 (사거리 등 기본 스펙에 영향주는 부분)
    if(player.type === 'melee') {
        player.range = base.range + (passiveSkills.weaponUpgrade.level * 25); // 근접 범위 증가
    } else {
        player.range = base.range;
    }
}

function startGame(type) {
    difficultyMult = parseFloat(document.querySelector('input[name="difficulty"]:checked').value);
    player.type = type; player.hp = player.maxHp = 100; player.level = 1; player.xp = 0; player.maxXp = 30; player.attackCount = 0;
    for(let k in passiveSkills) passiveSkills[k].level = 0;
    for(let k in activeSkills) activeSkills[k].level = 0;
    myActiveSlots = []; updateActiveUI();
    
    recalcStats(); player.color = charSpecs[type].color; player.angle = -Math.PI / 2;
    worldX = 0; worldY = 0; frameCount = 0; gameSeconds = 0; lastTime = performance.now();
    enemies = []; projectiles = []; effects = []; gems = []; drops = []; activeMagnet = 0; dovesState = []; bossMode = false;
    
    gameState = 'playing'; ui.menu.classList.add('hidden'); updateUI(); requestAnimationFrame(gameLoop);
}

function handleInputStart(x,y) { if(gameState!=='playing')return; joystick.active=true; joystick.originX=joystick.x=x; joystick.originY=joystick.y=y; }
function handleInputMove(x,y) {
    if(!joystick.active)return; joystick.x=x; joystick.y=y;
    const dx=joystick.x-joystick.originX; const dy=joystick.y-joystick.originY; const distSq=dx*dx+dy*dy;
    if(distSq>0) player.angle = Math.atan2(dy, dx);
    if(distSq>joystick.radius*joystick.radius){
        const dist=Math.sqrt(distSq); joystick.dx=dx/dist; joystick.dy=dy/dist;
        joystick.x=joystick.originX+joystick.dx*joystick.radius; joystick.y=joystick.originY+joystick.dy*joystick.radius;
    } else { joystick.dx=dx/joystick.radius; joystick.dy=dy/joystick.radius; }
}
function handleInputEnd() { joystick.active=false; joystick.dx=0; joystick.dy=0; }
canvas.addEventListener('touchstart', e => handleInputStart(e.touches[0].clientX, e.touches[0].clientY));
canvas.addEventListener('touchmove', e => handleInputMove(e.touches[0].clientX, e.touches[0].clientY));
canvas.addEventListener('touchend', handleInputEnd);
canvas.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleInputMove(e.clientX, e.clientY));
canvas.addEventListener('mouseup', handleInputEnd);

function spawnEnemy(isWave=false, isBoss=false, isMidBoss=false) {
    if (devConfig.spawnPaused && !isWave && !isBoss && !isMidBoss) return;
    const angle = Math.random() * Math.PI * 2; 
    const spawnRadius = Math.max(width, height) * 0.6; 
    let healthMultiplier = (1 + (gameSeconds / 60) * 0.6) * difficultyMult; 
    
    let size = isBoss ? 50 : (isMidBoss ? 25 : (isWave ? 16 : (Math.random()>0.9 ? 18 : 14)));
    let baseSpeed = isBoss ? 1.8 : (isMidBoss ? 2.2 : (1 + Math.random()*0.5 + (gameSeconds/300)));
    if (isWave) baseSpeed *= 1.2;
    let maxHp = isBoss ? (20000 + gameSeconds * 200) * difficultyMult : (isMidBoss ? 500*healthMultiplier : 25*healthMultiplier);
    if (isWave) maxHp *= 1.5;
    
    let e = {
        x: worldX + Math.cos(angle)*spawnRadius, y: worldY + Math.sin(angle)*spawnRadius,
        size: size, speed: baseSpeed, maxHp: maxHp, isBoss: isBoss, isMidBoss: isMidBoss, isWave: isWave, isDead: false
    };
    e.hp = e.maxHp; enemies.push(e);
}

let hitCooldown = 0;
function checkPlayerHit() {
    if (hitCooldown > 0) hitCooldown--; if (hitCooldown > 0) return;
    for (let i=0; i<enemies.length; i++) {
        if(enemies[i].isDead) continue;
        const hitRad = player.size + enemies[i].size;
        if (getDistSq(worldX, worldY, enemies[i].x, enemies[i].y) < hitRad*hitRad) {
            player.hp -= (enemies[i].isBoss || enemies[i].isMidBoss) ? 25 : 10; updateUI('hp'); hitCooldown = 30;
            effects.push({ x: worldX, y: worldY, type: 'blood', life: 15, maxLife: 15, radius: 25 });
            if (player.hp <= 0) { gameState = 'gameover'; ui.result.innerText = `버틴 시간: ${formatTime(gameSeconds)}`; ui.gameOver.classList.remove('hidden'); }
            break;
        }
    }
}

function damageEnemy(e, dmg, knockback, dirX, dirY) {
    e.hp -= dmg;
    if (e.hp <= 0) {
        e.isDead = true;
        if(e.isBoss) { bossMode = false; updateUI('boss'); }
        if(e.isMidBoss) { triggerLevelUp(true); } 
        gems.push({ x: e.x, y: e.y, isDead: false, type: e.isBoss||e.isMidBoss ? 'big_gem' : 'gem' });
        
        let roll = Math.random();
        if(roll < 0.005) drops.push({ x: e.x, y: e.y, type: 'magnet', isDead: false });
        else if(roll < 0.0125) drops.push({ x: e.x, y: e.y, type: 'hp', isDead: false });

        if (passiveSkills.lifeSteal.level > 0 && player.hp < player.maxHp) {
            player.hp = Math.min(player.maxHp, player.hp + (passiveSkills.lifeSteal.level * 0.5)); updateUI('hp');
        }
    } else {
        const kb = (e.isBoss || e.isMidBoss) ? knockback * 0.1 : knockback; e.x += dirX*kb; e.y += dirY*kb;
    }
}

function getNearestEnemy(x, y, rangeSq) {
    let nearest = null; let minDistSq = rangeSq || Infinity;
    for (let i=0; i<enemies.length; i++) {
        if(enemies[i].isDead) continue;
        const dSq = getDistSq(x, y, enemies[i].x, enemies[i].y);
        if (dSq < minDistSq) { minDistSq = dSq; nearest = enemies[i]; }
    }
    return nearest;
}

// 🚀 평타 개편 로직
function handleBasicAttacks() {
    if (player.currentCooldown > 0) { player.currentCooldown--; return; }
    const rangeSq = player.range * player.range;
    let nearest = getNearestEnemy(worldX, worldY, rangeSq);

    if (nearest) {
        const dx=nearest.x-worldX; const dy=nearest.y-worldY; const dist=Math.sqrt(dx*dx+dy*dy);
        const dirX=dx/dist; const dirY=dy/dist; const angle=Math.atan2(dy, dx);
        
        let wLvl = passiveSkills.weaponUpgrade.level;

        if (player.type === 'melee') {
            // 🗡️ 근접 요원: 범위 증가 + 레벨에 따른 다단 히트 (3렙: 2타, 5렙: 3타)
            let hits = wLvl >= 5 ? 3 : (wLvl >= 3 ? 2 : 1);
            for(let i=0; i<enemies.length; i++) {
                if(enemies[i].isDead) continue;
                if(getDistSq(worldX, worldY, enemies[i].x, enemies[i].y) <= rangeSq) {
                    const edx=enemies[i].x-worldX; const edy=enemies[i].y-worldY; const edist=Math.sqrt(edx*edx+edy*edy)||1;
                    for(let h=0; h<hits; h++) {
                        if(enemies[i].isDead) break;
                        damageEnemy(enemies[i], player.damage, player.knockback, edx/edist, edy/edist);
                    }
                }
            }
            effects.push({ x: worldX, y: worldY, type: 'slash', angle: angle, life: 15, maxLife: 15, radius: player.range });
            if(hits >= 2) effects.push({ x: worldX, y: worldY, type: 'slash', angle: angle+0.2, life: 15, maxLife: 15, radius: player.range*0.8 });
            if(hits === 3) effects.push({ x: worldX, y: worldY, type: 'slash', angle: angle-0.2, life: 15, maxLife: 15, radius: player.range*0.6 });
        
        } else if (player.type === 'ranged') {
            // 🏹 원거리 저격수: 다중 발사 (스프레드 샷, 최대 6발)
            let arrows = 1 + wLvl; 
            let spread = 0.15;
            for(let a=0; a<arrows; a++) {
                let ang = angle + (a - (arrows-1)/2) * spread;
                projectiles.push({ x: worldX, y: worldY, dx: Math.cos(ang)*18, dy: Math.sin(ang)*18, angle: ang, life: 30, type: 'arrow', dmg: player.damage, kb: player.knockback, isDead: false });
            }

        } else if (player.type === 'magic') {
            // ✨ 초능력술사: 거대 구슬 발동 주기 감소 및 다중 투척
            player.attackCount++; 
            let reqForBig = Math.max(1, 5 - wLvl); // 5, 4, 3, 2, 1
            let isBig = (wLvl >= 4) || (player.attackCount % reqForBig === 0);
            let orbCount = (wLvl === 5) ? 3 : 1;
            
            for(let a=0; a<orbCount; a++) {
                let ang = angle + (a - Math.floor(orbCount/2)) * 0.2;
                projectiles.push({ 
                    x: worldX, y: worldY, dx: Math.cos(ang)*(isBig?6:10), dy: Math.sin(ang)*(isBig?6:10), 
                    life: 60, type: isBig ? 'big_orb' : 'orb', 
                    dmg: isBig ? player.damage*3 : player.damage, 
                    kb: player.knockback, isDead: false 
                });
            }
        }
        player.currentCooldown = player.fireCooldown;
    }
}

function handleActiveSkills() {
    const pX = worldX; const pY = worldY;

    if (activeSkills.missile.level > 0) {
        activeTimers.missile--;
        if(activeTimers.missile <= 0) {
            let count = activeSkills.missile.level;
            for(let i=0; i<count; i++) {
                let ang = Math.random()*Math.PI*2;
                projectiles.push({ x: pX, y: pY, dx: Math.cos(ang)*8, dy: Math.sin(ang)*8, life: 90, type: 'missile', dmg: 20 + activeSkills.missile.level*10 + player.bonusDmg, isDead: false });
            }
            activeTimers.missile = 60 * player.cdr; 
        }
    }
    if (activeSkills.shield.level > 0) {
        activeTimers.shield--;
        if(activeTimers.shield <= 0) {
            let radius = 120 + activeSkills.shield.level*10; 
            for(let i=0; i<5; i++) {
                projectiles.push({ 
                    x: pX, y: pY, angle: (Math.PI*2/5)*i, radius: radius, 
                    life: 300, maxLife: 300, type: 'shield', 
                    dmg: 20 + activeSkills.shield.level*10 + player.bonusDmg, 
                    kb: 60 + activeSkills.shield.level*20,
                    isDead: false 
                });
            }
            activeTimers.shield = 450 * player.cdr; 
        }
    }
    if (activeSkills.bomb.level > 0) {
        activeTimers.bomb--;
        if(activeTimers.bomb <= 0) {
            let nearest = getNearestEnemy(pX, pY, 100000);
            if(nearest) {
                let count = activeSkills.bomb.level;
                for(let i=0; i<count; i++) {
                    let tx = nearest.x + (Math.random()-0.5)*100; let ty = nearest.y + (Math.random()-0.5)*100;
                    let dx = tx-pX; let dy = ty-pY; let dist = Math.sqrt(dx*dx+dy*dy);
                    projectiles.push({ x: pX, y: pY, dx: (dx/dist)*5, dy: (dy/dist)*5, life: dist/5, type: 'bomb', dmg: 40 + activeSkills.bomb.level*15 + player.bonusDmg, isDead: false });
                }
            }
            activeTimers.bomb = 90 * player.cdr;
        }
    }
    // ⭐ 수리검 개편 (생성 로직 - 바로 타겟 탐색 시작)
    if (activeSkills.shuriken.level > 0) {
        activeTimers.shuriken--;
        if(activeTimers.shuriken <= 0) {
            let count = activeSkills.shuriken.level;
            for(let i=0; i<count; i++) {
                projectiles.push({ x: pX, y: pY, state: 'seek', life: 300, type: 'shuriken', dmg: 15 + activeSkills.shuriken.level*8 + player.bonusDmg, target: null, isDead: false });
            }
            activeTimers.shuriken = 150 * player.cdr;
        }
    }
    if (activeSkills.dove.level > 0) {
        let reqDoves = Math.min(3, Math.ceil(activeSkills.dove.level / 2)); 
        while(dovesState.length < reqDoves) dovesState.push({ x: pX, y: pY, cd: 0 });
        for(let i=0; i<dovesState.length; i++) {
            let dv = dovesState[i];
            let targetX = pX + Math.cos(frameCount*0.05 + i*2)*40; let targetY = pY + Math.sin(frameCount*0.05 + i*2)*40;
            dv.x += (targetX - dv.x) * 0.1; dv.y += (targetY - dv.y) * 0.1;
            dv.cd--;
            if(dv.cd <= 0) {
                let n = getNearestEnemy(dv.x, dv.y, 40000);
                if(n) {
                    let dx = n.x-dv.x; let dy = n.y-dv.y; let dist = Math.sqrt(dx*dx+dy*dy);
                    projectiles.push({ x: dv.x, y: dv.y, dx: (dx/dist)*12, dy: (dy/dist)*12, life: 40, type: 'dove_shot', dmg: 15 + activeSkills.dove.level*10 + player.bonusDmg, isDead: false });
                    dv.cd = (60 - (activeSkills.dove.level * 5)) * player.cdr;
                }
            }
        }
    }
    if (activeSkills.laser.level > 0) {
        activeTimers.laser--;
        if(activeTimers.laser <= 0) {
            let n = getNearestEnemy(pX, pY, 90000); 
            if(n) {
                let dx = n.x-pX; let dy = n.y-pY; let dist = Math.sqrt(dx*dx+dy*dy); let dirX = dx/dist; let dirY = dy/dist;
                effects.push({ x: pX, y: pY, type: 'laser', angle: Math.atan2(dy,dx), life: 10, maxLife: 10, radius: 400 });
                for(let i=0; i<enemies.length; i++) {
                    if(enemies[i].isDead) continue;
                    let ex = enemies[i].x - pX; let ey = enemies[i].y - pY; let dot = ex*dirX + ey*dirY; 
                    if(dot > 0 && dot < 400) {
                        let perpDistSq = getDistSq(ex, ey, dirX*dot, dirY*dot);
                        if(perpDistSq < 400) damageEnemy(enemies[i], 30 + activeSkills.laser.level*20 + player.bonusDmg, 5, dirX, dirY);
                    }
                }
            }
            activeTimers.laser = 120 * player.cdr;
        }
    }
    if (activeSkills.poison.level > 0) {
        activeTimers.poison--;
        if(activeTimers.poison <= 0) {
            let pct = activeSkills.poison.level * 0.01; 
            effects.push({ x: pX, y: pY, type: 'poison', life: 180, maxLife: 180, 
                radius: 120 + activeSkills.poison.level * 40,
                dmg: 10 + activeSkills.poison.level*5 + player.bonusDmg, 
                hpPct: pct 
            });
            activeTimers.poison = 100 * player.cdr;
        }
    }
    if (activeSkills.lightning.level > 0) {
        activeTimers.lightning--;
        if(activeTimers.lightning <= 0 && enemies.length > 0) {
            let count = activeSkills.lightning.level;
            for(let i=0; i<count; i++) {
                let target = enemies[Math.floor(Math.random() * enemies.length)];
                if(target && !target.isDead) {
                    effects.push({ x: target.x, y: target.y, type: 'lightning', life: 15, maxLife: 15, radius: 30 });
                    damageEnemy(target, 100 + activeSkills.lightning.level*50 + (player.bonusDmg*2), 0, 0, 0);
                    for(let j=0; j<enemies.length; j++) {
                        if(enemies[j] !== target && !enemies[j].isDead && getDistSq(target.x, target.y, enemies[j].x, enemies[j].y) < 6400) damageEnemy(enemies[j], 30 + player.bonusDmg, 0, 0, 0);
                    }
                }
            }
            activeTimers.lightning = 150 * player.cdr;
        }
    }
    if (activeSkills.nova.level > 0) {
        activeTimers.nova--;
        if(activeTimers.nova <= 0) {
            let radius = 100 + activeSkills.nova.level*20;
            effects.push({ x: pX, y: pY, type: 'nova', life: 20, maxLife: 20, radius: radius });
            for(let i=0; i<enemies.length; i++) {
                if(enemies[i].isDead) continue;
                if(getDistSq(pX, pY, enemies[i].x, enemies[i].y) < radius*radius) {
                    let edx = enemies[i].x - pX; let edy = enemies[i].y - pY; let edist = Math.sqrt(edx*edx+edy*edy) || 1;
                    damageEnemy(enemies[i], 20 + activeSkills.nova.level*15 + player.bonusDmg, 30, edx/edist, edy/edist);
                    enemies[i].speed *= 0.5; 
                }
            }
            activeTimers.nova = 180 * player.cdr;
        }
    }
    if (activeSkills.boomerang.level > 0) {
        activeTimers.boomerang--;
        if(activeTimers.boomerang <= 0) {
            let n = getNearestEnemy(pX, pY, 40000); let dirX = 1, dirY = 0;
            if(n) { let dx = n.x-pX; let dy = n.y-pY; let dist = Math.sqrt(dx*dx+dy*dy); dirX=dx/dist; dirY=dy/dist; }
            let count = activeSkills.boomerang.level;
            for(let i=0; i<count; i++) {
                let ang = Math.atan2(dirY, dirX) + (i - Math.floor(count/2))*0.2;
                projectiles.push({ x: pX, y: pY, dx: Math.cos(ang)*10, dy: Math.sin(ang)*10, life: 120, maxLife: 120, type: 'boomerang', dmg: 25 + activeSkills.boomerang.level*10 + player.bonusDmg, isDead: false });
            }
            activeTimers.boomerang = 120 * player.cdr;
        }
    }
}

function handleGemsAndDrops() {
    let gainedXp = 0; const magnetSq = player.magnetRange * player.magnetRange; const pickupSq = player.size * player.size * 2;
    if(activeMagnet > 0) activeMagnet--;

    for (let i = 0; i < gems.length; i++) {
        const g = gems[i]; if (g.isDead) continue;
        const distSq = getDistSq(worldX, worldY, g.x, g.y);
        if (activeMagnet > 0 || distSq < magnetSq) {
            const dist = Math.sqrt(distSq) || 1;
            g.x += ((worldX - g.x) / dist) * 12; g.y += ((worldY - g.y) / dist) * 12;
        }
        if (getDistSq(worldX, worldY, g.x, g.y) < pickupSq) {
            g.isDead = true; gainedXp += (g.type === 'big_gem' ? 40 : 10) * (1 + (passiveSkills.xpGain.level * 0.2));
        }
    }
    
    for (let i = 0; i < drops.length; i++) {
        const d = drops[i]; if (d.isDead) continue;
        if (getDistSq(worldX, worldY, d.x, d.y) < pickupSq) {
            d.isDead = true;
            if(d.type === 'magnet') activeMagnet = 60; 
            if(d.type === 'hp') { player.hp = Math.min(player.maxHp, player.hp + 20); updateUI('hp'); effects.push({x:worldX, y:worldY, type:'heal', life:15, maxLife:15, radius:20}); }
        }
    }

    if (gainedXp > 0) {
        player.xp += gainedXp;
        if (player.xp >= player.maxXp) {
            player.level++; player.xp -= player.maxXp; player.maxXp = Math.floor(player.maxXp * 1.2);
            player.maxHp += 5; player.hp = player.maxHp; updateUI('hp'); updateUI('level');
            effects.push({ x: worldX, y: worldY, type: 'levelup', life: 30, maxLife: 30, radius: 50 });
            triggerLevelUp(false);
        }
        updateUI('xp');
    }
}

function triggerLevelUp(isChest = false) {
    gameState = 'levelup'; handleInputEnd();
    ui.lvlUpTitle.innerText = isChest ? "CHEST REWARD!" : "LEVEL UP!";
    ui.lvlUpTitle.style.color = isChest ? "#ff55ff" : "#ffcc00";
    ui.skillContainer.innerHTML = '';
    
    let pool = [];
    for(let k in passiveSkills) { if(passiveSkills[k].level < passiveSkills[k].max) pool.push({ key: k, obj: passiveSkills[k], isAct: false }); }
    for(let k in activeSkills) {
        let sk = activeSkills[k];
        if(sk.level === 0) { if(myActiveSlots.length < 8) pool.push({ key: k, obj: sk, isAct: true }); } 
        else if(sk.level < sk.max) { pool.push({ key: k, obj: sk, isAct: true }); }
    }

    if (pool.length === 0) {
        let card = document.createElement('div'); card.className = 'skill-card';
        card.innerHTML = `<div class="skill-title"><span>❤️ 최대 체력 회복</span><span style="color:#f0f">[ MAX ]</span></div><div class="skill-desc">모든 능력을 마스터했습니다! 체력을 100% 회복합니다.</div>`;
        card.onclick = () => { player.hp = player.maxHp; updateUI('hp'); resumeGame(); };
        ui.skillContainer.appendChild(card);
    } else {
        for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
        let choices = pool.slice(0, 3);
        choices.forEach(c => {
            let nextLvl = c.obj.level + 1; let lvlStr = nextLvl === c.obj.max ? `<span style="color:#f0f">[ MAX ]</span>` : `[ ${nextLvl} / ${c.obj.max} ]`;
            let card = document.createElement('div'); card.className = `skill-card ${c.isAct ? 'active-type' : ''}`;
            card.innerHTML = `<div class="skill-title"><span>${c.obj.icon} ${c.obj.name}</span> <span>${lvlStr}</span></div><div class="skill-desc">${c.obj.desc}</div>`;
            card.onclick = () => {
                c.obj.level++;
                if(c.isAct && c.obj.level === 1) { myActiveSlots.push(c.key); updateActiveUI(); }
                recalcStats(); updateActiveUI(); resumeGame();
            };
            ui.skillContainer.appendChild(card);
        });
    }
    ui.levelUp.classList.remove('hidden');
}

function updateActiveUI() {
    for(let i=0; i<8; i++) {
        let slot = document.getElementById(`slot-${i}`);
        if(i < myActiveSlots.length) {
            let key = myActiveSlots[i]; let sk = activeSkills[key];
            slot.innerHTML = `${sk.icon}<div class="lvl">Lv.${sk.level}</div>`;
            slot.style.borderColor = '#aa44ff';
        } else { slot.innerHTML = ''; slot.style.borderColor = '#555'; }
    }
}
function resumeGame() { ui.levelUp.classList.add('hidden'); gameState = 'playing'; lastTime = performance.now(); }

function checkDevMode() { if(gameState==='dev')return; if(prompt("개발자 비밀번호(1563):")==="1563") openDevMode(); }
function openDevMode() {
    const prev = gameState; gameState = 'dev'; handleInputEnd();
    document.getElementById('devSpawnToggle').checked = devConfig.spawnPaused;
    
    const makeRow = (k, sk, isAct) => {
        let row = document.createElement('div'); row.className = 'dev-row';
        let lvlStr = sk.level >= sk.max ? `<span style="color:#f0f; font-weight:bold;">MAX</span>` : `${sk.level}/${sk.max}`;
        row.innerHTML = `<div style="flex:1;">${sk.icon} ${sk.name}</div><div style="flex:1; text-align:center; color:#44aaff;" id="dev-val-${k}">[ ${lvlStr} ]</div><div><button class="dev-btn" onclick="modifySkill('${k}', -1, ${isAct})">-</button> <button class="dev-btn" onclick="modifySkill('${k}', 1, ${isAct})">+</button></div>`;
        return row;
    };
    
    ui.devPassivesContainer.innerHTML = ''; ui.devActivesContainer.innerHTML = '';
    for(let k in passiveSkills) ui.devPassivesContainer.appendChild(makeRow(k, passiveSkills[k], false));
    for(let k in activeSkills) ui.devActivesContainer.appendChild(makeRow(k, activeSkills[k], true));
    ui.devScreen.classList.remove('hidden'); ui.devScreen.dataset.prev = prev === 'dev' ? 'playing' : prev;
}
function closeDevMode() { ui.devScreen.classList.add('hidden'); gameState = ui.devScreen.dataset.prev || 'playing'; lastTime = performance.now(); }
function toggleSpawn(cb) { devConfig.spawnPaused = cb.checked; }
function killAllEnemies() { enemies.forEach(e => { e.isDead = true; gems.push({ x: e.x, y: e.y, isDead: false, type: e.isBoss||e.isMidBoss ? 'big_gem' : 'gem' }); }); if(bossMode){bossMode=false; updateUI('boss');} }
function modifySkill(k, amt, isAct) {
    let sk = isAct ? activeSkills[k] : passiveSkills[k];
    if(isAct && amt > 0 && sk.level === 0 && myActiveSlots.length >= 8) return; 
    sk.level = Math.max(0, Math.min(sk.max, sk.level + amt));
    if(isAct) {
        if(sk.level > 0 && !myActiveSlots.includes(k)) myActiveSlots.push(k);
        if(sk.level === 0 && myActiveSlots.includes(k)) myActiveSlots.splice(myActiveSlots.indexOf(k), 1);
        updateActiveUI();
    }
    recalcStats();
    let display = document.getElementById(`dev-val-${k}`);
    display.innerHTML = `[ ${sk.level >= sk.max ? `<span style="color:#f0f; font-weight:bold;">MAX</span>` : `${sk.level}/${sk.max}`} ]`;
}

function formatTime(sec) { const m = String(Math.floor(sec/60)).padStart(2,'0'); const s = String(sec%60).padStart(2,'0'); return `${m}:${s}`; }
function updateUI(t='all') {
    if(t==='time'||t==='all') ui.timer.innerText = formatTime(gameSeconds);
    if(t==='hp'||t==='all') ui.hpFill.style.width = `${(player.hp/player.maxHp)*100}%`;
    if(t==='xp'||t==='all') ui.xpFill.style.width = `${(player.xp/player.maxXp)*100}%`;
    if(t==='level'||t==='all') ui.levelText.innerText = `LV. ${player.level}`;
    if(t==='boss'||t==='all') { if(bossMode){ui.bossTimerContainer.style.display='block'; ui.bossTimer.innerText=bossTimeLeft;} else ui.bossTimerContainer.style.display='none'; }
}

function update() {
    if (gameState !== 'playing') return;
    frameCount++;
    
    if (frameCount % FPS === 0) {
        gameSeconds++; updateUI('time');
        if (passiveSkills.hpRegen.level > 0 && player.hp < player.maxHp) { player.hp = Math.min(player.maxHp, player.hp + passiveSkills.hpRegen.level); updateUI('hp'); }

        if (gameSeconds > 0 && gameSeconds % 60 === 0) {
            if (gameSeconds % 300 === 0) {
                bossMode = true; bossTimeLeft = 60; spawnEnemy(false, true, false);
                ui.warning.innerText = "🚨 거대 보스 출현! 1분 내 처치! 🚨"; ui.warning.style.opacity = 1; waveWarningTimer = FPS * 3; updateUI('boss');
            } else {
                spawnEnemy(false, false, true); 
                ui.warning.innerText = "⚠️ 몬스터 웨이브 & 중간 보스 접근 ⚠️"; ui.warning.style.opacity = 1; waveWarningTimer = FPS * 2;
                for(let i=0; i<30; i++) spawnEnemy(true, false, false); 
            }
        }
        if (bossMode) { bossTimeLeft--; updateUI('boss'); if (bossTimeLeft <= 0) { player.hp = 0; checkPlayerHit(); } }
    }
    if (waveWarningTimer > 0) { waveWarningTimer--; if (waveWarningTimer === 0) ui.warning.style.opacity = 0; }

    worldX += joystick.dx * player.speed; worldY += joystick.dy * player.speed;

    let spawnRate = Math.max(10, FPS - Math.floor(gameSeconds / 10));
    if (frameCount % spawnRate === 0 && enemies.length < 150) spawnEnemy();

    handleBasicAttacks(); handleActiveSkills(); checkPlayerHit(); handleGemsAndDrops();

    for (let i = 0; i < projectiles.length; i++) {
        let p = projectiles[i]; if (p.isDead) continue;
        
        if(p.type === 'missile') { 
            let n = getNearestEnemy(p.x, p.y, 40000);
            if(n) { let dx=n.x-p.x; let dy=n.y-p.y; let dist=Math.sqrt(dx*dx+dy*dy); p.dx += (dx/dist)*0.5; p.dy += (dy/dist)*0.5; }
        } 
        // ⭐ 수리검 궤도 비행 -> 타겟 추적/갈기 로직 완벽 적용
        else if(p.type === 'shuriken') { 
            if(!p.target || p.target.isDead) {
                p.state = 'seek';
                // 보스, 중간보스 우선 탐색
                let boss = enemies.find(e => (!e.isDead && (e.isBoss || e.isMidBoss)));
                if(boss) p.target = boss;
                else p.target = getNearestEnemy(p.x, p.y, 400000); // 화면 끝까지 추적
            }
            if(p.state === 'seek') {
                if(p.target) {
                    let dx = p.target.x - p.x; let dy = p.target.y - p.y; let dist = Math.sqrt(dx*dx+dy*dy);
                    p.dx = (dx/dist)*22; p.dy = (dy/dist)*22; // 아주 빠르게 맹렬히 비행
                    if(dist < 30) p.state = 'grind';
                }
            }
            if(p.state === 'grind') {
                if(!p.target || p.target.isDead) { p.state = 'seek'; } 
                else { 
                    p.x = p.target.x; p.y = p.target.y; p.dx=0; p.dy=0; 
                    if(frameCount % 3 === 0) { // 3프레임마다 연타 스파크 타격
                        damageEnemy(p.target, p.dmg * 0.3, 0, 0, 0); 
                        effects.push({x: p.x + (Math.random()-0.5)*40, y: p.y + (Math.random()-0.5)*40, type: 'spark', life: 10, maxLife: 10, radius: 5});
                    }
                } 
            }
        } 
        else if(p.type === 'shield') {
            p.angle += 0.1047; 
            p.x = worldX + Math.cos(p.angle)*p.radius;
            p.y = worldY + Math.sin(p.angle)*p.radius;
            p.dx = 0; p.dy = 0;
        } 
        else if(p.type === 'boomerang') {
            if(p.life < p.maxLife/2) {
                let dx = worldX - p.x; let dy = worldY - p.y; let dist = Math.sqrt(dx*dx+dy*dy);
                p.dx += (dx/dist)*1.0; p.dy += (dy/dist)*1.0; 
            }
        }

        p.x += p.dx || 0; p.y += p.dy || 0; p.life--; 
        
        if (p.life <= 0) { 
            if(p.type === 'bomb') {
                effects.push({x:p.x, y:p.y, type:'explosion', life:15, maxLife:15, radius:80});
                for(let f=0; f<4; f++) { 
                    let ang = (Math.PI*2 / 4) * f + Math.random();
                    projectiles.push({ x: p.x, y: p.y, dx: Math.cos(ang)*8, dy: Math.sin(ang)*8, life: 30, type: 'bomb_frag', dmg: p.dmg * 0.5, isDead: false });
                }
            } else if (p.type === 'bomb_frag') {
                effects.push({x:p.x, y:p.y, type:'explosion', life:10, maxLife:10, radius:40});
            }
            p.isDead = true; continue; 
        }

        for (let j = 0; j < enemies.length; j++) {
            let e = enemies[j]; if (e.isDead) continue;
            let hitRadSq = (p.type==='bomb'||p.type==='shuriken') ? 0 : 400; 
            if(p.type==='bomb_frag') hitRadSq=400;
            if(p.type==='big_orb') hitRadSq=900;
            if(p.type==='shield') hitRadSq=625; 

            if(hitRadSq > 0 && getDistSq(p.x, p.y, e.x, e.y) < hitRadSq) {
                if (p.type === 'big_orb') {
                    effects.push({ x: p.x, y: p.y, type: 'explosion', life: 20, maxLife: 20, radius: 120 });
                    for(let k=0; k<enemies.length; k++) { if(!enemies[k].isDead && getDistSq(p.x, p.y, enemies[k].x, enemies[k].y)<14400) damageEnemy(enemies[k], p.dmg, p.kb, 0, 0); }
                } else if(p.type === 'bomb_frag') {
                    damageEnemy(e, p.dmg, 5, 0, 0);
                    effects.push({x:p.x, y:p.y, type:'explosion', life:10, maxLife:10, radius:40});
                    p.isDead = true; break;
                } else if(p.type !== 'boomerang' && p.type !== 'shield') { 
                    let edx=e.x-p.x; let edy=e.y-p.y; let edist=Math.sqrt(edx*edx+edy*edy)||1;
                    damageEnemy(e, p.dmg, p.kb || 5, edx/edist, edy/edist);
                    effects.push({ x: e.x, y: e.y, type: 'hit', life: 10, maxLife: 10, radius: 15 });
                    
                    if(p.type === 'missile' || p.type === 'dove_shot' || p.type === 'arrow') { p.isDead = true; break; }
                } else {
                    let edx=e.x-p.x; let edy=e.y-p.y; let edist=Math.sqrt(edx*edx+edy*edy)||1;
                    damageEnemy(e, p.dmg, p.kb || 0, edx/edist, edy/edist); 
                    effects.push({ x: e.x, y: e.y, type: 'hit', life: 5, maxLife: 5, radius: 10 });
                }
            }
        }
    }

    for (let i=0; i<effects.length; i++) {
        let ef = effects[i]; ef.life--;
        if(ef.type === 'poison' && ef.life % 30 === 0) {
            for(let j=0; j<enemies.length; j++) {
                if(!enemies[j].isDead && getDistSq(ef.x, ef.y, enemies[j].x, enemies[j].y) < ef.radius*ef.radius) {
                    let totalDmg = ef.dmg + (enemies[j].maxHp * ef.hpPct);
                    damageEnemy(enemies[j], totalDmg, 0, 0, 0);
                }
            }
        }
    }

    for (let i = 0; i < enemies.length; i++) {
        let e = enemies[i]; if (e.isDead) continue;
        const dx = worldX - e.x; const dy = worldY - e.y; const distSq = dx*dx + dy*dy;
        if (distSq > 0) { const dist = Math.sqrt(distSq); e.x += (dx/dist)*e.speed; e.y += (dy/dist)*e.speed; }
    }

    enemies = enemies.filter(e => !e.isDead); projectiles = projectiles.filter(p => !p.isDead);
    gems = gems.filter(g => !g.isDead); drops = drops.filter(d => !d.isDead); effects = effects.filter(ef => ef.life > 0);
}

function draw() {
    ctx.fillStyle = '#112211'; ctx.fillRect(0, 0, width, height);
    const cx = width/2; const cy = height/2;

    ctx.strokeStyle = '#1d3b1d'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i=0; i<grasses.length; i++) {
        let sx = (grasses[i].x - worldX) % (width*1.5); let sy = (grasses[i].y - worldY) % (height*1.5);
        if (sx < -width*0.2) sx += width*1.5; if (sy < -height*0.2) sy += height*1.5;
        ctx.moveTo(sx, sy); ctx.lineTo(sx+5, sy-grasses[i].length);
    }
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx, cy, player.magnetRange, 0, Math.PI*2); ctx.stroke();
    
    // 특화 무기(평타) 사거리 표시
    ctx.strokeStyle='rgba(255,100,100,0.1)'; ctx.beginPath(); ctx.arc(cx, cy, player.range, 0, Math.PI*2); ctx.stroke();

    for (let i=0; i<effects.length; i++) {
        let ef = effects[i]; let ex = ef.x-worldX+cx; let ey = ef.y-worldY+cy;
        if(ef.type === 'poison') { 
            let p = ef.life / ef.maxLife;
            ctx.fillStyle = `rgba(130, 255, 50, ${p * 0.3})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = `rgba(80, 200, 255, ${p * 0.15})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius*0.7, 0, Math.PI*2); ctx.fill(); 
        }
    }

    for (let i=0; i<drops.length; i++) {
        let d = drops[i]; let dx = d.x-worldX+cx; let dy = d.y-worldY+cy;
        if(d.type === 'magnet') { ctx.fillStyle = '#ff3333'; ctx.fillRect(dx-6, dy-6, 4, 12); ctx.fillStyle = '#3333ff'; ctx.fillRect(dx+2, dy-6, 4, 12); ctx.fillStyle = '#aaa'; ctx.fillRect(dx-6, dy-6, 12, 4); }
        else if(d.type === 'hp') { ctx.fillStyle = '#fff'; ctx.fillRect(dx-8, dy-8, 16, 16); ctx.fillStyle = '#0a0'; ctx.fillRect(dx-2, dy-6, 4, 12); ctx.fillRect(dx-6, dy-2, 12, 4); }
    }

    for (let i=0; i<gems.length; i++) {
        let g = gems[i]; ctx.fillStyle = g.type==='big_gem'?'#ffcc00':'#44aaff';
        let size = g.type==='big_gem'?7:4; ctx.fillRect(g.x-worldX+cx-size, g.y-worldY+cy-size, size*2, size*2);
    }

    for (let i=0; i<enemies.length; i++) {
        let e = enemies[i]; let ex = e.x-worldX+cx; let ey = e.y-worldY+cy;
        ctx.fillStyle = e.isBoss ? '#dd2222' : (e.isMidBoss ? '#aa33aa' : '#33cc55'); 
        ctx.beginPath(); ctx.arc(ex, ey, e.size, 0, Math.PI*2); ctx.fill();
        if(e.hp < e.maxHp) { ctx.fillStyle='#000'; ctx.fillRect(ex-15, ey-e.size-8, 30, 4); ctx.fillStyle='#f00'; ctx.fillRect(ex-15, ey-e.size-8, 30*(e.hp/e.maxHp), 4); }
    }

    for (let i=0; i<dovesState.length; i++) {
        let dv = dovesState[i]; let dx = dv.x-worldX+cx; let dy = dv.y-worldY+cy;
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(dx+5, dy); ctx.lineTo(dx-5, dy+4); ctx.lineTo(dx-5, dy-4); ctx.fill();
    }

    for (let i=0; i<effects.length; i++) {
        let ef = effects[i]; let ex = ef.x-worldX+cx; let ey = ef.y-worldY+cy; let p = ef.life/ef.maxLife; let invP = 1-p;
        if(ef.type === 'slash') { ctx.strokeStyle = `rgba(255,255,255,${p*0.8})`; ctx.lineWidth = 15*p; ctx.beginPath(); ctx.arc(ex, ey, ef.radius, ef.angle-1, ef.angle+1); ctx.stroke(); } 
        else if(ef.type === 'explosion') { ctx.fillStyle = `rgba(255,100,50,${p})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius*invP, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = `rgba(255,255,255,${p*0.5})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius*invP*0.5, 0, Math.PI*2); ctx.fill(); } 
        else if(ef.type === 'hit') { ctx.fillStyle = `rgba(255,255,100,${p})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius*p, 0, Math.PI*2); ctx.fill(); } 
        else if(ef.type === 'spark') { ctx.fillStyle = `rgba(255, 200, 0, ${p})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius*p, 0, Math.PI*2); ctx.fill(); } 
        else if(ef.type === 'blood') { ctx.fillStyle = `rgba(255,0,0,${p*0.6})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius*invP, 0, Math.PI*2); ctx.fill(); }
        else if(ef.type === 'laser') { ctx.strokeStyle = `rgba(0, 255, 255, ${p})`; ctx.lineWidth = 20*p; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex+Math.cos(ef.angle)*ef.radius, ey+Math.sin(ef.angle)*ef.radius); ctx.stroke(); }
        else if(ef.type === 'lightning') { ctx.strokeStyle = `rgba(200, 200, 255, ${p})`; ctx.lineWidth = 10*p; ctx.beginPath(); ctx.moveTo(ex, ey-500); ctx.lineTo(ex, ey); ctx.stroke(); ctx.fillStyle=`rgba(200,200,255,${p})`; ctx.beginPath(); ctx.arc(ex, ey, ef.radius, 0, Math.PI*2); ctx.fill(); }
        else if(ef.type === 'nova') { ctx.strokeStyle = `rgba(100, 200, 255, ${p})`; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(ex, ey, ef.radius*invP, 0, Math.PI*2); ctx.stroke(); }
        else if(ef.type === 'heal') { ctx.fillStyle = `rgba(100, 255, 100, ${p})`; ctx.font="bold 16px sans-serif"; ctx.fillText("+20", ex-10, ey-invP*20); }
    }

    for (let i=0; i<projectiles.length; i++) {
        let pr = projectiles[i]; let px = pr.x-worldX+cx; let py = pr.y-worldY+cy;
        if(pr.type === 'arrow' || pr.type === 'missile' || pr.type === 'dove_shot') {
            let color = pr.type==='missile'?'#ff8800':(pr.type==='dove_shot'?'#aaaaff':'#ffff88');
            ctx.fillStyle = color; ctx.save(); ctx.translate(px, py); ctx.rotate(Math.atan2(pr.dy, pr.dx)); ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.fill(); ctx.restore();
        } else if(pr.type === 'orb') { ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill(); }
        else if(pr.type === 'big_orb') { ctx.fillStyle = `rgba(255,255,255,0.5)`; ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI*2); ctx.fill(); }
        else if(pr.type === 'bomb') { ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI*2); ctx.fill(); ctx.fillStyle='#f00'; ctx.beginPath(); ctx.arc(px, py, 4 + Math.sin(frameCount*0.5)*2, 0, Math.PI*2); ctx.fill(); } 
        else if(pr.type === 'bomb_frag') { ctx.fillStyle = '#ff4444'; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill(); }
        else if(pr.type === 'shuriken') { 
            ctx.save(); ctx.translate(px, py); ctx.rotate(frameCount*0.8); 
            ctx.fillStyle='#aaa'; 
            ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(4, -4); ctx.lineTo(12, 0); ctx.lineTo(4, 4); ctx.lineTo(0, 12); ctx.lineTo(-4, 4); ctx.lineTo(-12, 0); ctx.lineTo(-4, -4); ctx.fill(); 
            ctx.fillStyle='#0ff'; ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
            ctx.restore(); 
        }
        else if(pr.type === 'shield') { 
            ctx.save(); ctx.translate(px, py); ctx.rotate(pr.angle);
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 15, -Math.PI/2, Math.PI/2); ctx.stroke();
            ctx.fillStyle = 'rgba(0, 255, 255, 0.4)'; ctx.beginPath(); ctx.arc(0, 0, 15, -Math.PI/2, Math.PI/2); ctx.fill();
            ctx.restore(); 
        }
        else if(pr.type === 'boomerang') { ctx.save(); ctx.translate(px, py); ctx.rotate(frameCount*0.3); ctx.strokeStyle='#0ff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI); ctx.stroke(); ctx.restore(); }
    }

    if (hitCooldown % 10 < 5) {
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(player.angle); 
        ctx.fillStyle = player.color; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-12, 10); ctx.lineTo(-6, 0); ctx.lineTo(-12, -10); ctx.closePath(); ctx.fill();
        if (joystick.dx!==0 || joystick.dy!==0) { ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-18, 4); ctx.lineTo(-18, -4); ctx.fill(); }
        ctx.restore();
    }

    if (joystick.active && gameState==='playing') {
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joystick.originX, joystick.originY, joystick.radius, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(joystick.x, joystick.y, 15, 0, Math.PI*2); ctx.fill();
    }
}

function gameLoop(timestamp) {
    requestAnimationFrame(gameLoop);
    const elapsed = timestamp - lastTime;
    if (elapsed > frameInterval) { lastTime = timestamp - (elapsed % frameInterval); update(); draw(); }
}
</script>
</body>
</html>
